    <div class="rp-workspace"><div class="rp-workspace-inner">
<!-- "Keep it" from the email a week before a dropped app closes (accounts/keep.js). The link is the proof: no sign-in. -->
<main id="main" tabindex="-1">
  <div class="rp-page-header"><div><div class="cp-kicker" style="margin-bottom:10px">Your plan</div><h1 class="rp-page-title">Keep your app</h1></div></div>
  <div class="card stack">
    <p id="keep-words">When you changed your plan, you left out an app. It stays open until the end of the month you've paid for, then closes. Keep it, and your plan goes back to what it was, at the same price as before.</p>
    <div class="cp-actions cp-start">
      <button type="button" class="primary" id="keep">Keep it</button>
      <a class="button" id="plan-link" href="/account/">See your plan</a>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
    </div></div>
  </div>
