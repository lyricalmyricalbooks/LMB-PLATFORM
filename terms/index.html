<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colophon terms</title>
<meta name="description" content="Colophon's terms, privacy policy, data agreement and what happens if Colophon ever closes, on one page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&family=DM+Mono&display=swap">
<style>
  :root { --paper: #f4efe6; --ink: #1d1a17; --blue: #0078bf; --yellow: #ffe800; --muted: #5a534c; }
  @media (prefers-color-scheme: dark) { :root { --paper: #23201d; --ink: #f1ebe1; --muted: #b9b0a5; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.55 Archivo, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  .mark { font: 14px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font: 400 clamp(40px, 8vw, 72px)/1.12 Anton, Impact, sans-serif; text-transform: uppercase; margin: 16px 0 24px; }
  h2 { font: 400 28px/1.2 Anton, Impact, sans-serif; text-transform: uppercase; margin: 36px 0 8px; }
  nav ul { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 8px 20px; font: 14px "DM Mono", monospace; }
  .draft { border: 2px solid var(--ink); background: var(--yellow); color: #1d1a17; padding: 14px 16px; box-shadow: 4px 4px 0 var(--ink); }
  .version { font: 13px "DM Mono", monospace; color: var(--muted); margin-top: 40px; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark">Colophon · terms</div>
  <h1>Our promises</h1>
  <div id="terms"></div>
</main>
<script type="module">
  import { renderTerms } from "./page.js";
  document.getElementById("terms").innerHTML = renderTerms();
</script>
</body>
</html>
