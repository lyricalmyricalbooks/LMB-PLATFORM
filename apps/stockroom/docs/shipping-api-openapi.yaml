      x-ibm-languages:
        description:
          fr: Il s’agit de la clé de compte disponible dans la plateforme Zonos (Paramètres → Intégrations) que vous avez obtenue lors de votre inscription à Zonos. Elle n’est requise que si vous prévoyez expédier vers les États-Unis et souhaitez soumettre des envois sans ID de déclaration préexistant.
      required: false
