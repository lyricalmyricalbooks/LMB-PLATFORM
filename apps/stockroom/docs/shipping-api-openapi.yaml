                      <p>Tableau de cha&icirc;nes de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>Il s'agit de la liste de shipmentIds devant &ecirc;tre exclus de la transmission. Ces envois demeureront dans leur groupe et ils seront automatiquement ramass&eacute;s au cours de la prochaine transmission.</td>
                  </tr>
                </tbody>
              </table> <p><strong>Demande &ndash; Aper&ccedil;u d&eacute;taill&eacute; des champs simples</strong></p> <table summary="Transmettre les envois
                            &ndash; Aper&ccedil;u d&eacute;taill&eacute;
                                          des champs de la demande" cellspacing="0">
                <thead>
                  <tr>
                    <th>Nom du champ</th>
                    <th>Type</th>
                    <th>Requis/Facultatif</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <p>groupId</p>
                    </td>
                    <td>Cha&icirc;ne de caract&egrave;res</td>
                    <td>Requis</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 32 caract&egrave;res)</p>
                      <p>Fait partie de groupIds.</p>
                      <p>Occurrence (1&nbsp;&agrave; N fois)</p>
                      <p>Il s'agit du groupId de tout groupe dont les envois doivent &ecirc;tre inclus dans le proc&eacute;d&eacute; de transmission.</p>
                      <p>Un groupId a pour but de regrouper plusieurs envois ensemble afin de les inclure sur le m&ecirc;me manifeste. Par exemple, le regroupement est utile dans les sc&eacute;narios suivants :</p>
                      <ul>
                        <li>Vous avez plusieurs emplacements de service.</li>
                        <li>Vous souhaitez que tous les envois dans un groupe soient exp&eacute;di&eacute;s le m&ecirc;me jour.</li>
                        <li>Vous voulez regrouper les envois ensemble aux fins de r&eacute;f&eacute;rence interne ou de facturation.</li>
                      </ul>
                      <p><strong>Remarque :</strong> Les envois du r&eacute;gime int&eacute;rieur, &agrave; destination des &Eacute;tats-Unis et du r&eacute;gime international seront plac&eacute;s sur des manifestes s&eacute;par&eacute;s, m&ecirc;me s'ils contiennent le m&ecirc;me <br>groupId.</p>
                      <p><strong>Limites du rendement</strong><br>Afin d'&eacute;viter un d&eacute;lai de temporisation de nos serveurs, veuillez suivre ces recommandations :</p>
                      <ul>
                        <li>Ne pas inclure plus de 30 groupes par manifeste (p. ex. un maximum de 30 groupIds dans une seule demande de service Transmettre les envois).</li>
                        <li>Ne pas placer plus de 5 000 envois dans un groupe.</li>
                      </ul>
                      <p><strong>Limites du syst&egrave;me</strong><br>Pour &eacute;viter une erreur, veuillez ne pas d&eacute;passer les limites suivantes avant d'effectuer une demande de service Transmettre les envois :</p>
                      <ul>
                        <li>Maximum de 50 groupes par manifeste (erreur 9109 si la limite est d&eacute;pass&eacute;e).</li>
                        <li>Maximum de 10 000 envois dans un groupe (erreur 9110 si la limite est d&eacute;pass&eacute;e).</li>
                        <li>Maximum de 10 000 envois dans l'ensemble de plusieurs groupes (erreur 9108 si la limite est d&eacute;pass&eacute;e).</li>
                      </ul>
                    </td>
