        - transactionType
    merchantName:
      description: |-
        Will have the value: "Canada Post"

        ---

        La valeur sera la suivante : « Canada Post ».
      type: string
      minLength: 1
      maxLength: 40
    merchantUrl:
      description: |-
        Will have the value: "www.canadapost.ca"

        ---

        La valeur sera la suivante : « www.canadapost.ca ».
      type: string
      maxLength: 60
    nameOnCard:
      description: |-
        The name on the default credit card stored by Canada Post.

        ---

        Nom figurant sur la carte de crédit par défaut sauvegardée par Postes Canada.
      type: string
      minLength: 1
      maxLength: 40
    transactionType:
      description: |-
        Will have the value: "Sale".

        ---

        La valeur sera la suivante : « Sale ».
      type: string
      maxLength: 44
    currency:
      type: string
      description: |-
        The currency of the transaction: CAD.

        ---

        Devise de la transaction : CAD.
      minLength: 1
      maxLength: 3
    links:
      description: |-
        This structure represents a list of links to information relating to the shipment that was generated.

        ---

        Cette structure représente une liste de liens vers les renseignements concernant l'envoi créé. 
      type: array
      items:
        $ref: '#/components/schemas/link'
    link:
      description: |-
        Several links will be returned and each will have a unique rel.
        type:


        1.  rel="self"

            This indicates that the link represents the shipment just generated. In this case, the href field can be used as an endpoint to the Get Shipment service for the shipment just generated. (See **Get Shipment** for information on how to invoke that service). As the Get Shipment service returns all the same information as the generate Shipment service, it can be used to re-generate (at a later time) all the information provided as part of the generate Shipment

            The href field can also be used to delete the shipment (via an invocation of the empty Shipment service - See **empty Shipment** for information on how to invoke that service).

            The mediaType field will indicate the API version to be followed when calling either the Get Shipment or Transmit Shipments service.

        2.  rel="label"

            This indicates that the link represents one of the labels rendered as part of the generate Shipment process. In this case, the href field is an endpoint to the Get Artifact service for that label. (See **Get Artifact** for information on how to invoke that service). The mediaType field will indicate the format of the graphics file (PDF or ZPL).

            Note, for links of type rel="label", the additional field index:"n" (e.g. index:"1") is also required. This accommodates the situation where a multi-page label is spread over a number of separate artifacts (one for each page). In most cases, there will be only one page, so index="1" will be used.

        3.  rel="returnLabel"

            This indicates that the link represents the return label rendered as part of the generate Shipment process. In this case, the href field is an endpoint to the Get Artifact service for that label. (See **Get Artifact** for information on how to invoke that service). The mediaType field will indicate the format of the graphics file (PDF or ZPL).

        4.  rel="commercialInvoice"

            This only exists in the case of a US or International shipment where a commercial invoice is required to show to border customs.

            This indicates that the link represents the commercial invoice rendered as part of the generate Shipment process. In this case, the href field is an endpoint to the Get Artifact service for that label. (See the section **Get Artifact** for information on how to invoke that service). The mediaType field will indicate the format of the graphics file (PDF or ZPL).

        5.  rel="details"

            This indicates that the link represents additional details that were generated as part of the generate Shipment process. In this case, the href field is an endpoint to the Get Shipment Details service to retrieve that information. (See **Get Shipment Details** for information on how to invoke that service). The mediaType field will indicate the API version to be followed when calling the Get Shipment Details service.

        6.  rel="price"

            This indicates that the link represents a price estimation generated as part of the generate Shipment process. In this case, the href field is an endpoint to the Get Shipment Price service to retrieve that information. (See **Get Shipment Price** for information on how to invoke that service). The mediaType field will indicate the API version to be followed when calling the Get Shipment Price service. Not returned when providePricingInfo was set to true in the request.

        7.  rel="group"

            This indicates that the link represents the group that the shipment was generated under as part of the generate Shipment process. In this case, the href field is an endpoint to the Get Shipments service to retrieve that information. (See **Get Shipments** for information on how to invoke that service). The mediaType field will indicate the API version to be followed when calling the Get Shipments service.

        8.  rel="receipt"

            This link is used to access a credit card receipt that was generated by a generate Shipment process where no manifest is required for proof of payment (See **Get Shipment Receipt** for information on how to obtain the receipt). The mediaType field indicates the API version that will be returned.

            Not returned when provideReceiptInfo was set to true in the request.

        9.  rel="refund"

            This link is used to request the refund of a shipment where no manifest is required. A refund can be issued if you have printed a label that you are not going to use, such one that has become spoiled or damaged. See **Request Shipment Refund** for details on how to request a refund. This link is only returned on shipment where no manifest is required.

            In all of the above cases, the value of the mediaType field should be included as an HTTP Accept header in any of the calls to other services pointed to by the href.

        ---

        Plusieurs liens s'afficheront. Un type unique de rel sera associé à chacun d'eux.

        1.  rel="self"
            
            Indique que le lien représente l'envoi qui vient tout juste d'être créé. Dans ce cas, le champ « href » peut être utilisé comme point final propre au service Obtenir l'envoi pour l'envoi créé. (Consultez la section **Obtenir l'envoi** pour obtenir des renseignements sur la façon de présenter une demande pour ce service.) Étant donné que les renseignements liés au service Obtenir l'envoi sont les mêmes que ceux du service Créer l'envoi, il est possible d'utiliser cet élément pour générer de nouveau (plus tard) tous les renseignements fournis pour le service Créer l'envoi.
            
            Le champ « href » peut également être utilisé pour supprimer l'envoi (en présentant une demande de service Annuler l'envoi). Consultez la section **Annuler l'envoi** pour obtenir des renseignements sur la façon de faire.
            
            Le champ lié au type de média désignera la version de l'API qu'il faut respecter en présentant une demande de service Obtenir l'envoi ou Transmettre les envois.
            
        2.  rel="label"
            
            Cela indique que le lien représente une des étiquettes produites dans le cadre du procédé de création d'un envoi. Dans ce cas, le champ « href » correspond au point final du service Obtenir l'artefact pour cette étiquette. (Consultez la section **Obtenir l'artefact** pour obtenir des renseignements sur la façon de faire.) Le champ mediaType désignera le format du fichier graphique (PDF ou ZPL).
            
            Nota : Pour les liens de type rel="label", le champ supplémentaire index="n" (p. ex., index="1") est aussi requis. Il convient à une situation où une étiquette de plusieurs pages est apposée sur un certain nombre d'artefacts distincts (une pour chaque page). Dans la plupart des cas, il y aura seulement une page, alors le champ index="1" sera utilisé.
            
        3.  rel="returnLabel"

            Cela indique que le lien représente l'étiquette Service de retour produite dans le cadre du procédé de création d'un envoi. Dans ce cas, le champ « href » correspond au point final du service Obtenir l'artefact pour cette étiquette. (Consultez la section **Obtenir l'artefact** pour obtenir des renseignements sur la façon de faire.) Le champ mediaType désignera le format du fichier graphique (PDF ou ZPL).

        5.  rel="commercialInvoice"
            
            Il existe seulement dans le cas d'un envoi à destination des États-Unis ou du régime international pour lequel il faut présenter une facture commerciale aux douanes.
            
            Cela indique que le lien représente la facture commerciale produite dans le cadre du procédé de création d'un envoi. Dans ce cas, le champ « href » correspond au point final du service Obtenir l'artefact pour cette étiquette. (Consultez la section **Obtenir l'artefact** pour obtenir des renseignements sur la façon de faire.) Le champ mediaType désignera le format du fichier graphique (PDF ou ZPL).
            
        6.  rel="details"
            
            Cela indique que le lien représente les détails supplémentaires produits dans le cadre du procédé de création d'un envoi. Dans ce cas, le champ « href » correspond au point final du service Obtenir les détails de l'envoi pour récupérer ces renseignements. (Consultez la section **Obtenir les détails de l'envoi** pour obtenir des renseignements sur la façon de présenter une demande de service.) Le champ lié au type de média désignera la version de l'API qu'il faut respecter en présentant une demande de service Obtenir les détails de l'envoi.
            
        7.  rel="price"
            
            Cela indique que le lien représente une estimation de prix générée dans le cadre du procédé de création d'un envoi. Dans ce cas, le champ « href » correspond au point final du service Obtenir le tarif de l'envoi pour récupérer ces renseignements. (Consultez la section **Obtenir le tarif de l'envoi** pour obtenir des renseignements sur la façon de présenter une demande de service.) Le champ mediaType désignera la version de l'API qu'il faut respecter en présentant une demande de service Obtenir le tarif de l'envoi. Ne sera pas retourné lorsque le champ « providePricingInfo » est réglé à « true » dans la demande.
            
        8.  rel="group"
            
            Cela indique que le lien représente le groupe en fonction duquel l'envoi a été créé dans le cadre du procédé de création. Dans ce cas, le champ « href » correspond au point final du service Obtenir les envois pour récupérer ces renseignements. (Consultez la section **Obtenir les envois** pour obtenir des renseignements sur la façon de présenter une demande de service.) Le champ mediaType désignera la version de l'API qu'il faut respecter en présentant une demande de service Obtenir les envois.
            
            Dans tous les cas susmentionnés, la valeur de le champ mediaType doit être incluse dans l'en-tête HTTP Accept lorsqu'il faut présenter toute autre demande de service désignée par le champ « href ».
            
        9.  rel="receipt"
            
            Ce lien est utilisé pour accéder au reçu de la carte de crédit qui a été généré par le procédé de création d'un envoi pour lequel un manifeste n'est pas requis à titre de preuve de paiement (voir le document sur le service **Obtenir le reçu de l'envoi** pour consulter les renseignements sur la façon d'obtenir le reçu). Le champ lié au type de média désigne la version de l'API qui s'affichera.
            
            Ne sera pas retourné lorsque l'élément « provideReceiptInfo » est réglé à « true » dans la demande.
            
        10. rel="refund"
            
            Ce lien sert à demander le remboursement d'un envoi lorsqu'un manifeste n'est pas requis. Un remboursement peut être fait si vous avez imprimé une étiquette que vous n'allez pas utiliser, laquelle a été abîmée ou endommagée. Consulter la section **Demander le remboursement d'un envoi** pour obtenir plus de détails sur la façon de demander un remboursement. Ce lien s'affiche seulement pour les envois pour lesquels aucun manifeste n'est requis.
            
            Dans tous les cas susmentionnés, la valeur de le champ mediaType doit être incluse dans l'en-tête HTTP Accept lorsqu'il faut présenter toute autre demande de service désignée par le champ « href ».
            
        11. rel="publicLabel"
            
            Ce lien est à l'URL non-authentifiée à l'étiquette.
            
        12. rel="publicKeyInfo"
            
            Ce lien est utilisé pour demander des détails sur l'étiquette publique (date d'expiration et potentiellement code QR, si demandé)
      type: object
      properties:
        href:
          description: |-
            Indicates the endpoint to be used to call the web service. It contains the URL and may also contain a query string.

            ---

            Désigne le point final à utiliser pour présenter une demande de service en ligne. Il contient l'adresse URL et peut également contenir une chaîne de requête.
          type: string
        rel:
          description: |-
            Indicates the resource related to the current response.

            ---

            Indique la ressource associée à la réponse actuelle.
          type: string
        index:
          description: |-
            Present on links to formatted output such as labels. The value starts at 0 for the first page and subsequent pages (if extant) count up by 1.

            ---

            Fait partie des liens vers les données de sortie formatées, comme les étiquettes. La valeur de la première page est de « 0 », et cette valeur augmente de un pour chaque page subséquente (le cas échéant).
          type: integer
          minimum: 0
        mediaType:
          description: |-
            A character string that indicates the format and version of the data to expect when the web service is invoked. The value in this field should be copied to the HTTP header variable "Accept" when the href link is invoked.

            ---

            Il s'agit d'une chaîne de caractères indiquant le format et la version des données prévus lorsqu'un service Internet est utilisé.
            La valeur de cet attribut doit être copiée dans la variable de l'en-tête HTTP « Accept » lorsque le lien href est utilisé.
          type: string
      required:
        - href
        - rel
        - mediaType
    messages:
      type: object
      properties:
        title:
          type: string
          description: |-
            Type of error.

            ---

            Type d'erreur.
        detail:
          type: string
          description: |-
            Detailed description of type of error.

            ---

            Description détaillée du type d'erreur.
        errors:
          type: array
          description: |-
            List of errors.

            ---

            Liste des erreurs.
          items:
