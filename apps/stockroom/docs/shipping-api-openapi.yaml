            Message d'erreur détaillé.
    createShipmentRequest:
      description: |-
        Create Shipment - Request

        ---

        Créer l'envoi - Demande
      type: object
      additionalProperties: false
      properties:
        customerRequestId:
          $ref: '#/components/schemas/customerRequestId'
        groupId:
          allOf:
            - $ref: '#/components/schemas/groupId'
          description: |-
            This field represents the groupId number (or group name) in which to place the created shipment. The group will be created by the Canada Post service if it does not exist.

            The groupId field is required unless transmitShipment is provided, in which case groupId must not be provided.

            Do not generate a unique group for each individual shipment. The purpose of a groupId is to group several shipments together to include on the same manifest. For example, grouping is useful in the following scenarios:

            - You have multiple fulfillment locations.
            - You want all shipments in a group to be shipped on the same day.
            - You want to group shipments together for internal reference or billing purposes.

            **Note:** domestic, U.S., and international shipments will be placed on separate manifests even if they contain the same groupId.

            **Performance limitations**

            To avoid a timeout of our servers, please follow these recommendations:

            - Do not include more than 30 groups per manifest (i.e., maximum of 30 groupIds in one Transmit Shipments request.)
            - Do not put more than 5,000 shipments in one group.

            **System limitations**

            To avoid an error, please do not exceed the following limits before performing a Transmit Shipments call:

            - Maximum of 50 groups per manifest (error 9109 if exceeded).
            - Maximum of 10,000 shipments in one group (error 9110 if exceeded).
            - Maximum of 10,000 shipments across multiple groups (error 9108 if exceeded).

            ---

            Ce champ correspond au numéro d'identification du groupe (ou au nom du groupe) dans lequel il faut placer l'envoi créé. Le groupe sera créé par le service de Postes Canada s'il n'existe pas.

            Le champ groupId est requis, à moins que l'élément transmitShipment soit fourni; dans un tel cas, l'élément groupId ne doit par être fourni.

            Il ne faut pas créer un groupe unique pour chaque envoi individuel. Un groupId a pour but de regrouper plusieurs envois ensemble afin de les inclure sur le même manifeste. Par exemple, le regroupement est utile dans les scénarios suivants :

            - Vous avez plusieurs emplacements de service.
            - Vous souhaitez que tous les envois dans un groupe soient expédiés le même jour.
            - Vous voulez regrouper les envois ensemble aux fins de référence interne ou de facturation.

            **Remarque :** Les envois du régime intérieur, à destination des États-Unis et du régime international seront placés sur des manifestes séparés, même s'ils contiennent le même groupId.

            **Limites du rendement**  

            Afin d'éviter un délai de temporisation de nos serveurs, veuillez suivre ces recommandations :

            - Ne pas inclure plus de 30 groupes par manifeste (p. ex. un maximum de 30 groupIds dans une seule demande de service Transmettre les envois).
            - Ne pas placer plus de 5 000 envois dans un groupe.

            **Limites du système**  

            Pour éviter une erreur, veuillez ne pas dépasser les limites suivantes avant d'effectuer une demande de service Transmettre les envois :

            - Maximum de 50 groupes par manifeste (erreur 9109 si la limite est dépassée).
            - Maximum de 10 000 envois dans un groupe (erreur 9110 si la limite est dépassée).
            - Maximum de 10 000 envois dans l'ensemble de plusieurs groupes (erreur 9108 si la limite est dépassée).
        transmitShipment:
          $ref: '#/components/schemas/transmitShipment'
        quickshipLabelRequested:
          $ref: '#/components/schemas/quickshipLabelRequested'
        cpcPickupIndicator:
          $ref: '#/components/schemas/cpcPickupIndicator'
        requestedShippingPoint:
          $ref: '#/components/schemas/requestedShippingPoint'
        shippingPointId:
          $ref: '#/components/schemas/shippingPointId'
        expectedMailingDate:
          $ref: '#/components/schemas/expectedMailingDate'
        providePricingInfo:
          description: |-
            This field identifies that you want the shipmentPrice structure included in the response to this call. It will result in a larger payload but eliminates the need for a subsequent call to *Get Shipment Price*.

            Only applicable to a shipment where transmitShipment=true.

            Only provide this parameter if you want pricing details in the response (i.e., do not provide when false).

            ---

            Ce champ indique que vous voulez que la structure tarifaire des envois soit incluse dans la réponse à cette demande. Cela entraîne une plus grande charge, mais élimine la nécessité de soumettre une autre demande Obtenir le tarif de l'envoi.

            S'applique uniquement aux envois où l'élément « transmitShipment » est réglé à « true ».

            Fournir ce paramètre uniquement si vous voulez obtenir des détails sur la tarification dans la réponse (ne pas le fournir lorsque l'élément est réglé à « false »).
          type: boolean
          enum:
            - true
        provideReceiptInfo:
          description: |-
            This field identifies that you want the shipmentReceipt structure included in the response to this call. It will result in a larger payload but eliminates the need for a subsequent call to *Get Shipment Receipt*.

            Only applicable to a shipment where transmitShipment=true that is paid by credit card or Supplier Account.

            Only provide this parameter if you want receipt details in the response (i.e., do not provide when false).

            ---

            Ce champ indique que vous voulez que la structure « shipmentReceipt » soit incluse dans la réponse à cette demande. Il en résulte une plus grande charge, mais cela élimine la nécessité de soumettre une autre demande Obtenir le reçu de l'envoi.

            Ne s'applique qu'à un envoi où l'élément « transmitShipment=true » est payé par carte de crédit ou par compte de fournisseur.

            Fournir ce paramètre uniquement si vous voulez que les détails du reçu soient indiqués dans la réponse (c.-à-d. qu'il ne faut pas le fournir lorsque l'élément est réglé à « false »).
          type: boolean
          enum:
            - true
        deliverySpec:
          allOf:
            - $ref: '#/components/schemas/deliverySpec'
        returnSpec:
          $ref: '#/components/schemas/returnSpec'
        preAuthorizedPayment:
          description: |-
            Supplier Account providers can pre-authorize payment using the Supplier Account of their customer.

            **Important:** This functionality can only be used by Canada Post approved Supplier Account providers, and only on a shipment where no manifest is required.

            ---

            Les fournisseurs de comptes de fournisseur peuvent préautoriser les paiements à l'aide du compte de fournisseur de leurs clients.

            **Important :** Cette fonction ne peut être utilisée que par les fournisseurs de comptes de fournisseur approuvés par Postes Canada, et ce, uniquement pour les envois n'exigeant pas de manifeste.
          type: object
          properties:
            accountNumber:
              description: |-
                The account number from which the amount will be withdrawn; will
                be used for reconciliation.

                ---

                Le numéro de compte à partir duquel le montant sera retiré;
                sera utilisé aux fins de rapprochement.
              type: string
              minLength: 1
              maxLength: 16
            authCode:
              description: |-
                The authorization code from the supplier; will be used for reconciliation.

                ---

                Le code d'autorisation du fournisseur; sera utilisé aux fins de rapprochement.
              type: string
              minLength: 1
              maxLength: 16
            authTimestamp:
              description: |-
                The authorization date and time; will be used for reconciliation.

                ---

                La date et l'heure d'autorisation; seront utilisés aux fins de rapprochement.
              type: string
              format: date-time
            chargeAmount:
              description: |-
                The amount authorized in Canadian dollars; must match the total charges that will be calculated.

                ---

                Le montant autorisé en dollars canadiens; doit correspondre au total des frais qui seront calculés.
              type: number
              minimum: 0
              maximum: 9999999.99
              multipleOf: 0.01
          required:
            - accountNumber
            - authCode
            - authTimestamp
            - chargeAmount
        createPublicKey:
          description: |-
            This is an optional field, used to request the public key label URL, and expiry date.

            If true, two new links are provided: publicLabel and publicKeyInfo

            Note: Only applicable to 8 1/2 X 11 paper encoded in pdf.

            ---

            Il s'agit d'un champ facultatif, utilisé pour demander l'URL de l'étiquette de clé publique et la date d'expiration.

            Si c'est vrai, deux nouveaux liens sont fournis : publicLabel et publicKeyInfo

            Remarque : Applicable uniquement à 8 1/2 X 11 papier codé en pdf.
          type: boolean
        createQrCode:
          description: |-
            This is an optional field, used to request the QR code image of
            the public label in base64 format, along with contains public key
            label URL, and expiry date.

            If true, two new links are provided: publicLabel and publicKeyInfo.

            Note: Only applicable to 8 1/2 X 11 paper encoded in pdf.

            ---

            Il s'agit d'un champ facultatif, utilisé pour demander l'image
            de code QR de l'étiquette publique au format base64, ainsi que
            contient l'URL de l'étiquette de clé publique et la date
            d'expiration.

            c'est vrai, deux nouveaux liens sont fournis : publicLabel et
            publicKeyInfo.

            Remarque : Applicable uniquement à 8 1/2 X 11 papier codé en pdf.
          type: boolean
          default: false
      allOf:
        - required:
            - deliverySpec
        - anyOf:
            - required:
                - transmitShipment
              not:
                required:
                  - groupId
            - required:
                - groupId
              not:
                required:
                  - transmitShipment
