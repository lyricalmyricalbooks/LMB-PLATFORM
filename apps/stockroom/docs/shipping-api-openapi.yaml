                        <li>(Six caract&egrave;res alphanum&eacute;riques pour le Canada [A9A9A9]) &ndash; <br>Format [A-Z]\d[A-Z]\d[A-Z]\d</li>
                        <li>(Code num&eacute;rique &agrave; cinq chiffres ou &agrave; neuf chiffres [cinq chiffres suivis de quatre autres chiffres] pour les &Eacute;tats-Unis) &ndash; <br>Format \d{5}(-\d{4})?</li>
                        <li>Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 14 caract&egrave;res (tout format) pour les autres pays</li>
                      </ul>
                      <p>Requis pour les pays n&eacute;cessitant un code postal ou un code ZIP (p. ex. Canada, <br>&Eacute;tats-Unis).</p>
