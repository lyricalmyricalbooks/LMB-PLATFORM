                    <td>
                      <p>(Cha&icirc;ne alphanum&eacute;rique &ndash; Jusqu'&agrave; 30 lettres/chiffres)</p>
                      <p>Un ID de déclaration est requis lors de l’expédition d’articles vers les États-Unis si une clé de compte Zonos n’est pas incluse dans l’en-tête. Veuillez saisir votre ID de déclaration Zonos ici lorsqu’il est généré directement à partir de leurs API. Chaque envoi doit avoir son propre ID de déclaration.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>currency</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Trois caract&egrave;res alphab&eacute;tiques)</p>
                      <p>Il s&rsquo;agit de la devise du pays de destination. Le code de devise est converti en majuscules, s&rsquo;il ne l&rsquo;est pas d&eacute;j&agrave;. La valeur doit &ecirc;tre :</p>
                      <ul>
                        <li>&laquo; CAD &raquo; pour une devise canadienne;</li>
                        <li>&laquo; USD &raquo; pour une devise am&eacute;ricaine;</li>
                        <li>Autre code de devise ISO valide</li>
                      </ul>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; customs &raquo; existe.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>conversionFromCad</p>
                    </td>
                    <td>
                      <p>Nombre</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Champ num&eacute;rique de trois chiffres, suivis de trois d&eacute;cimales [p. ex., format 999.999])</p>
                      <p>Le taux de conversion du dollar canadien &agrave; la devise que vous avez entr&eacute;e dans le champ de devise ci-dessus; par exemple, si vous entr&eacute; les dollars am&eacute;ricains comme devise cible et que 1,00 $ CAD = 0,85 $ US, le taux de conversion est de 0,85.</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; customs &raquo; existe et si la devise n'est pas canadienne.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>reasonForExport</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Trois caract&egrave;res)</p>
                      <p>Code repr&eacute;sentant la raison de l'exportation, lequel facilite le passage transfrontalier.</p>
                      <p>Voici les codes et leurs significations :</p>
                      <p>DOC = Document<br>SAM = &Eacute;chantillon commercial<br>REP = R&eacute;paration ou garantie<br>SOG = Vente de biens<br>OTH = Autre</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; customs &raquo; existe.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>otherReason</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Minimum de 4 caract&egrave;res; maximum de 44 caract&egrave;res)</p>
                      <p>Requis si le champ &laquo; reasonForExport &raquo; est &laquo; Autre &raquo;.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>dutiesAndTaxesPrepaid</p>
                    </td>
                    <td>
                      <p>Nombre</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>R&eacute;serv&eacute; aux fins d'utilisation ult&eacute;rieure.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>certificateNumber</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 10 caract&egrave;res)</p>
                      <p>Si requis par les douanes du pays de destination, le num&eacute;ro du certificat ou du permis du gouvernement ou de l'organisme.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>licenseNumber</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 10 caract&egrave;res)</p>
                      <p>Si requis par les douanes du pays de destination, le num&eacute;ro de la licence d'importation ou d'exportation du gouvernement ou de l'organisme.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>invoiceNumber</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 10 caract&egrave;res)</p>
                      <p>Si requis par les douanes du pays de destination, le num&eacute;ro de la facture commerciale.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>iossId</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 13 caract&egrave;res)</p>
                      <p>Champ facultatif pour la saisie des num&eacute;ros ou ID d&rsquo;inscription &agrave; l&rsquo;imp&ocirc;t (p. ex., ID d&rsquo;inscription &agrave; l&rsquo;imp&ocirc;t, num&eacute;ro IRS, TVA, num&eacute;ro IOSS) aux fins de transmission &eacute;lectronique au poste de r&eacute;ception. Remarque : Le num&eacute;ro IOSS doit &ecirc;tre saisi selon le format &laquo; IMxxxxxxxxxx &raquo;.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>skuList</p>
                    </td>
                    <td>Tableau d'objets</td>
                    <td>Requis</td>
                    <td>
                      <p>S'il existe un champ parent douanier correspondant, ce champ est obligatoire.</p>
                      <p>Contient la liste de types d'articles uniques inclus dans cet envoi ainsi que les renseignements connexes. Une quantit&eacute; de un ou plus peut &ecirc;tre associ&eacute;e &agrave; chaque type d'article. Ces renseignements sont imprim&eacute;s sur l'&eacute;tiquette du manifeste pour faciliter le traitement du colis aux douanes.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>customsNumberOfUnits</p>
                    </td>
                    <td>
                      <p>Nombre</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Champ num&eacute;rique de quatre chiffres [p. ex. format 9999])</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; item &raquo; existe.</p>
                      <p>Nombre d'unit&eacute;s dans le colis.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>customsUnitOfMeasure</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Code de pays ISO &agrave; trois caract&egrave;res)</p>
                      <p>Indique l'unit&eacute; de mesure pour le champ customsNumberOfUnits.</p>
                      <ul>
                        <li>PCE &ndash; Article</li>
                        <li>NMB &ndash; Num&eacute;ro</li>
                        <li>PAR &ndash; Paire</li>
                        <li>PKG &ndash; Paquet</li>
                        <li>ENV &ndash; Enveloppe</li>
                        <li>LTR &ndash; Litre</li>
                        <li>MLT &ndash; Millilitre</li>
                        <li>BOX &ndash; Bo&icirc;te</li>
                        <li>BAG &ndash; Sac</li>
                        <li>MTR &ndash; M&egrave;tre</li>
                        <li>MMT &ndash; Millim&egrave;tre</li>
                        <li>DZN &ndash; Douzaine</li>
                        <li>GRM &ndash; Gramme</li>
                        <li>KGM &ndash; Kilogramme</li>
                        <li>CTN &ndash; Carton</li>
                        <li>BIN &ndash; Bac</li>
                        <li>SET &ndash; Nombre de s&eacute;ries</li>
                        <li>BOT &ndash; Bouteille</li>
                        <li>TBE &ndash; Tube</li>
                        <li>KIT &ndash; Trousse</li>
                      </ul>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>customsDescription</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 45 caract&egrave;res)</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; item &raquo; existe.</p>
                      <p>Description pour douanes de l'article.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>sku</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 15 caract&egrave;res)</p>
                      <p>Nom ou num&eacute;ro de l'article aux fins de d&eacute;douanement</p>
                      <p><strong>Nota :</strong> La version 6 permet seulement un maximum de 15 caract&egrave;res. Les versions pr&eacute;c&eacute;dentes permettent un maximum de 44 caract&egrave;res, mais les donn&eacute;es seront tronqu&eacute;es en 15 caract&egrave;res. Les limites de longueur sont n&eacute;cessaires &agrave; des fins de conformit&eacute; aux r&egrave;glements douaniers internationaux.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>hsTariffCode</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Champ num&eacute;rique de format g&eacute;n&eacute;ral 9999.99.99.99)</p>
                      <p>Le format est \d{4}(\.\d{2}(\.\d{2}(\.\d{2})?)?)?.</p>
                      <p>Code de tarification de l'article.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>unitWeight</p>
                    </td>
                    <td>
                      <p>Nombre</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Champ num&eacute;rique de deux chiffres, suivis de trois d&eacute;cimales [p. ex. format 99.999])</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; item &raquo; existe.</p>
                      <p>Poids unitaire de l'article en kilogrammes.</p>
                    </td>
                  </tr>
