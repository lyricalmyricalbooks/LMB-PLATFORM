                  baseCost: 16.88
                  automationDiscount: 0
                  optionsAndSurcharges: 1.35
                  gst: 0
                  pst: 0
                  hst: 2.73
                  totalDueCpc: 20.96
                manifestAddress:
                  manifestCompany: ABC
                  manifestName: MajorShop
                  phoneNumber: 902-444-4444
                  addressDetails:
                    addressLine1: 1 Main St
                    addressLine2: string
                    city: Halifax
                    provState: NS
                    postalZipCode: B3L2C2
                    mediaType: application/json
        '401':
          $ref: '#/components/responses/401'
