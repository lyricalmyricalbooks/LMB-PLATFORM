        - name: no-manifest
          in: query
          description: Shipments where no manifest is required, which require you to pass a {no-manifest=true} parameter to identify this type of request.
          x-ibm-languages:
            description:
              fr: Il s'agit d'envois pour lesquels un manifeste n'est pas requis, ce qui exige que vous passiez le paramètre {no-manifest=true} pour désigner ce type de requête.
          schema:
            type: boolean
          example: true
        - name: date
          in: query
          description: 'The date from which you want the search to start for shipments sent with no manifest required. Defaults to current date if not present. Format: YYYYMMDD'
          x-ibm-languages:
            description:
              fr: 'La date à partir de laquelle vous voulez que la recherche commence pour les envois pour lesquels un manifeste n''est pas requis. La date du jour s''affiche par défaut si l''élément n''est pas présent. Format : AAAAMMJJ'
          schema:
            type: string
            pattern: ^\d{8}$
          example: 20231026
        - name: limit
          in: query
          description: |-
            The maximum number of links to include in response, from most recent to oldest. (e.g.; limit=1 would return only the most recent shipment).

            Defaults to 100 when parameter is not supplied. Limited to 99,999 if a number larger than that value is supplied.
          x-ibm-languages:
            description:
              fr: |-
                Le nombre maximal de liens à inclure dans la réponse, du plus récent au plus ancien. (p. ex. limit=1 affichera uniquement l'envoi le plus récent).

                Le nombre par défaut est « 100 » si le paramètre n'est pas fourni. Ce nombre est limité à 99 999 si un nombre plus grand que cette valeur est fourni.
          schema:
            type: integer
            minimum: 1
            maximum: 99999
            default: 100
          example: 10
        - name: request-id
          in: query
          description: The customer-provided request ID of the shipment for which information is being requested.
          x-ibm-languages:
            description:
              fr: Le numéro de demande du client associé à l'envoi pour lequel des renseignements sont demandés.
          schema:
            type: string
            maxLength: 32
          example: 412011698382821250
        - name: tracking-pin
          in: query
          description: |-
            The tracking ID of the existing shipment for which information is being requested.

            **Note:**

            - As Small Packet shipments do not have a tracking-pin, you must search for them using the other search parameters.</p>
            - In the sandbox (development) environment,the same tracking PIN is always returned (123456789012), so this query would not return representative results in that environment.
          x-ibm-languages:
            description:
              fr: |-
                NIP de repérage de l'envoi existant pour lequel les renseignements sont demandés.

                **Remarque :**

                - Comme les envois de Petits paquets n'ont pas de NIP de repérage, vous devez les chercher à l'aide des autres paramètres de recherche.
                - Dans l'environnement (de développement) « Bac à sable », le même NIP de repérage est toujours retourné (123456789012); alors, cette requête ne retournera pas des résultats représentatifs dans cet environnement.
          schema:
            minLength: 11
            maxLength: 16
            type: string
          example: 123456789012
        - name: group-id
          in: query
          description: |-
            Shipments not yet transmitted in that group.

            **Note:** one of either group-id or manifest-id fields must be present, but never both.
          x-ibm-languages:
            description:
              fr: |-
                Envois pas encore transmis dans ce groupe.

                **Nota :** Un des deux champs (« group-id » ou « manifest-id ») doit être présent, mais jamais les deux.
          schema:
            type: string
            maxLength: 32
          example: 123456
        - name: manifest-id
          in: query
          description: |-
            Shipments in that manifest.

            **Note:** one of either group-id or manifest-id fields must be present, but never both.
          x-ibm-languages:
            description:
              fr: |-
                Envois sur ce manifeste.

                **Nota :** Un des deux champs (« group-id » ou « manifest-id ») doit être présent, mais jamais les deux.
          schema:
            type: string
          example: 412011698382821250
