                    href: https://api.canadapost-postescanada.ca/prod/devportal-portaildesdeveloppeurs/shipping/v1/12345678901234567890/9876543210/shipments?group-id=sdfsdfsd
                    mediaType: application/json
                  groupId: sdfsdfsd
        '400':
          description: The 400 (Bad Request) status code indicates that the server cannot or will not process the request due to something that is perceived to be a client error (for example, malformed request syntax). There will be diagnostic message text in the preferred language (English or French).
          x-ibm-languages:
            description:
              fr: Le code d’état 400 (Mauvaise demande) indique que le serveur ne peut pas ou ne veut pas traiter la demande en raison d’une erreur de la clientèle (p. ex., syntaxe de demande mal formée). Il y aura un message de diagnostic dans la langue de préférence (français ou anglais).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
              examples:
                English:
                  value:
                    title: Validation failed
                    detail: Errors occurred while processing the request.
                    errors:
                      - errorCode: AA003
                        message: The customer number in the URL does not belong to the web service authorization provided in your request.
                Français:
                  value:
                    title: Validation échouée
                    detail: Une erreur est survenue lors du traitement de la demande.
                    errors:
                      - errorCode: AA003
                        message: Le numéro de client figurant dans l'URL ne correspond pas à l'autorisation de service web fournie dans votre requête.
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'
      operationId: getShipmentGroups
      tags:
        - Shipping
      summary: Get Groups
      description: Retrieves all group IDs associated with a customer (or mailed-on-behalf-of customer) for shipments that have been created.
      x-ibm-languages:
        summary:
          fr: Obtenir des groupes
        description:
          fr: Récupérer tous les ID de groupe associés à un client ou une cliente (ou à une personne au nom de laquelle nous assurons l'expédition) pour les envois qui ont été créés.
  /{mailedBy}/{mobo}/manifests:
    post:
      parameters:
        - $ref: '#/components/parameters/mailedBy'
        - $ref: '#/components/parameters/mobo'
        - $ref: '#/components/parameters/platformID'
        - $ref: '#/components/parameters/language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transmitRequest'
            example:
              groupIds:
                - APIC_DS
              requestedShippingPoint: R3T4G4
              detailedManifests: true
              methodOfPayment: CreditCard
              manifestAddress:
                manifestCompany: MajorShop
                manifestName: John Doe
                phoneNumber: 613-123-4567
                addressDetails:
                  addressLine1: 123 Eerie St
                  addressLine2: Ste 17
                  city: Ottawa
                  provState: 'ON'
                  countryCode: CA
                  postalZipCode: K1L9G6
              customerReference: custRef
        description: |-
          <p><strong>Request &ndash; Top Level View of Fields</strong></p> <p>This section describes the top level (complex) fields that are part of the input to this service.</p> <table border="1">
            <thead>
              <tr>
                <th>Field Name</th>
                <th>Type</th>
                <th>Required / Optional</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <p>customerRequestId</p>
                </td>
                <td>String</td>
                <td>Optional</td>
                <td>For Future Use.</td>
              </tr>
              <tr>
                <td>groupIds</td>
                <td>Array of Strings</td>
                <td>Required</td>
                <td>
                  <p>This is a list of groupIds. The Transmit Shipments service will create a manifest for each group. The manifest will list the shipments included in the group (with the exception of shipments you exclude)</p>
                </td>
              </tr>
              <tr>
                <td>requestedShippingPoint</td>
                <td>String</td>
                <td>Conditionally</td>
                <td>
                  <p>(6-character alphanumeric string)</p>
                  <p>Must be in valid Postal Code format</p>
                  <p>e.g. A9A9A9</p>
                  <p>Pattern is [A-Z]\d[A-Z]\d[A-Z]\d</p>
                  <p>If you deposit your shipments yourself, you have 2 choices:</p>
                  <ul>
                    <li>Omit this field and provide the site number of your deposit location in shippingPointId. (recommended), or</li>
                    <li>Provide the postal code of your deposit location here and omit shippingPointId.</li>
                  </ul>
                  <p><strong>Note:</strong> Using requestedShippingPoint to indicate your deposit location postal code will be discontinued in a future release. If you deposit your shipments yourself, we recommend using the shippingPointId field.</p>
                  <p>Mandatory when&nbsp;cpcPickupIndicator is provided.</p>
                  <p>Mutually exclusive with shippingPointId, but one of the two must be provided.</p>
                  <p>If you provide the same Postal Code here that you used in your Create Shipment requests, then there will be no pricing adjustments related to the starting point for shipping. If you use a different Postal Code here than in Create Shipment, it may result in a pricing adjustment depending on the distance between the original shipping point (in the Create Shipment request) and the final shipping point (in the Transmit Shipments) request</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>cpcPickupIndicator</p>
                </td>
                <td>Boolean</td>
                <td>Optional</td>
                <td>
                  <p>(true)</p>
                  <p>Set this field to true if your shipments are picked up by Canada Post or a third party. Do not provide this field when false. Provide the Postal Code of your pickup location in requestedShippingPoint. If you use the same indicator and requestedShippingPoint as you did in Create Shipment, there will be no pricing adjustment; see details in requestedShippingPoint.</p>
                  <p>Omit this field if you deposit your shipments yourself.</p>
                  <p>Mutually exclusive with shippingPointId.</p>
                  <p><strong>Note:</strong> In a future release it will become mandatory to explicitly identify whether your shipment is picked up by Canada Post (by providing both this indicator and requestedShippingPoint) or deposited at a Canada Post site (by providing shippingPointId).</p>
                  <p>We recommend preparing for this change by providing this indicator (and requestedShippingPoint) if your shipment is picked up by Canada Post.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>shippingPointId</p>
                </td>
                <td>String</td>
                <td>Conditionally required</td>
                <td>
                  <p>(4-character alphanumeric string)</p>
                  <p>If you deposit your items at a Post Office or other Canada Post facility, provide the site number of the deposit location. Look up the site number using Find a Deposit Location. This information is used for pricing.</p>
                  <p>If you enter a different site number than you provided in your Create Shipment request, pricing may be affected.</p>
                  <p>Mutually exclusive with requestedShippingPoint but one of the two must be provided.</p>
                  <p><strong>Note:</strong> If you deposit your items yourself, we recommend using this field rather than the requestedShippingPoint field to indicate your deposit location.</p>
                </td>
              </tr>
              <tr>
                <td>methodOfPayment</td>
                <td>String</td>
                <td>required</td>
                <td>
                  <p>{15-character string}</p>
                  <p>This indicates what the method of payment is for the manifests that are to be generated.</p>
                  <p>Valid methods of payment are as follows:</p>
                  <ul>
                    <li>CreditCard = the payment will be by credit card.</li>
                    <li>Account = the payment will be via an existing contract with the paid-by-customer.</li>
                    <li>SupplierAccount = the payment will be through the Supplier Account identified as default in the customer profile (only available to Supplier Account providers).</li>
                  </ul>
                  <p><strong>Note:</strong> Different shipments may have different paid-by-customers. Separate manifests will be generated for shipments with different paid-by-customers.</p>
                </td>
              </tr>
              <tr>
                <td>manifestAddress</td>
                <td>Object</td>
                <td>required</td>
                <td>
                  <p>This structure contains the address that is printed on the manifest label.</p>
                </td>
              </tr>
              <tr>
                <td>detailedManifests</td>
                <td>Boolean</td>
                <td>required</td>
                <td>
                  <p>{true,false}</p>
                  <p>This indicates whether a full detailed manifest document will be rendered, or a summarized manifest document will be rendered.</p>
                </td>
              </tr>
              <tr>
                <td>customerReference</td>
                <td>String</td>
                <td>Optional</td>
                <td>
                  <p>(Alphanumeric String - up to 12 letters/digits)</p>
                  <p>A customer reference number may be provided to Canada Post which is placed on the manifest and returned in a Get Manifest Details request.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>excludedShipments</p>
                </td>
                <td>Array of Strings</td>
                <td>Optional</td>
                <td>
                  <p>The list of shipmentIds that are to be excluded from transmission. These shipments will remain in their group and will automatically be picked up for the next transmit.</p>
                </td>
              </tr>
            </tbody>
          </table> <p><strong>Request &ndash; Detailed View of Simple Fields</strong></p> <table border="1">
            <thead>
              <tr>
                <th>Field Name</th>
                <th>Type</th>
                <th>Required / Optional</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <p>groupId</p>
                </td>
                <td>String</td>
                <td>required</td>
                <td>
                  <p>(Character String &ndash; up to 32 characters)</p>
                  <p>Contained within groupIds.</p>
                  <p>May occur 1 &hellip; N times.</p>
                  <p>The groupId of any group, whose shipments are to be included in the Transmit Shipments action.</p>
                  <p>The purpose of a groupId is to group several shipments together to include on the same manifest. For example, grouping is useful in the following scenarios:</p>
                  <ul>
                    <li>You have multiple fulfillment locations.</li>
                    <li>You want all shipments in a group to be shipped on the same day.</li>
                    <li>You want to group shipments together for internal reference or billing purposes.</li>
                  </ul>
                  <p><strong>Note:</strong> domestic, U.S., and international shipments will be placed on separate manifests even if they contain the same groupId.</p>
                  <p><strong>Performance limitations</strong><br>To avoid a timeout of our servers, please follow these recommendations:</p>
                  <ul>
                    <li>Do not include more than 30 groups per manifest (i.e., maximum of 30 groupIds in one Transmit Shipments request.)</li>
                    <li>Do not put more than 5,000 shipments in one group.</li>
                  </ul>
                  <p><strong>System limitations</strong><br>To avoid an error, please do not exceed the following limits before performing a Transmit Shipments call:</p>
                  <ul>
                    <li>Maximum of 50 groups per manifest (error 9109 if exceeded).</li>
                    <li>Maximum of 10,000 shipments in one group (error 9110 if exceeded).</li>
                    <li>Maximum of 10,000 shipments across multiple groups (error 9108 if exceeded).</li>
                  </ul>
                </td>
              </tr>
              <tr>
                <td>
                  <p>manifestName</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Optional</p>
                </td>
                <td>
                  <p>(Character String up to 44 characters)</p>
                  <p>Contact name for the manifest address.</p>
                  <p>This is printed on the manifest document.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>manifestCompany</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>(Character String up to 44 characters)</p>
                  <p>Contained within manifestAddress.</p>
                  <p>The company name of the manifest address.</p>
                  <p>This is printed on the manifest document.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>phoneNumber</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>(Character String &ndash; up to 32 characters)</p>
                  <p>Contained within manifestAddress.</p>
                  <p>Phone number to be printed on the manifest.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>addressDetails</p>
                </td>
                <td>
                  <p>Object</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>Contained within manifestAddress.</p>
                  <p>This structure contains the address details for the manifest address.</p>
                  <p>The address is printed on the manifest document.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>addressLine1</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>(Character String up to 44 characters)</p>
                  <p>Contained within addressDetails.</p>
                  <p>address line 1 for the manifest address.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>addressLine2</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Optional</p>
                </td>
                <td>
                  <p>(Character String up to 44 characters)</p>
                  <p>Contained within addressDetails.</p>
                  <p>address line 2 for the manifest address.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>city</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>(Character String up to 40 characters)</p>
                  <p>Contained within addressDetails.</p>
                  <p>City for the manifest address.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>provState</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>(Character String &ndash; up to 20 characters)</p>
                  <p>Contained within addressDetails.</p>
                  <p>Province (or state) for the manifest address.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>countryCode</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Conditionally<br>Required</p>
                </td>
                <td>
                  <p>(2-character string)</p>
                  <p>Contained within addressDetails.</p>
                  <p>Country code for the manifest address; CA and US are accepted.</p>
                  <p>Required if US. Optional if CA.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>postalZipCode</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Required</p>
                </td>
                <td>
                  <p>Can be:</p>
                  <ol class="lowerRoman">
                    <li>6-character alphanumeric for Canada (A9A9A9) <p>Pattern is [A-Z]\d[A-Z]\d[A-Z]\d <strong>or</strong></p>
                    </li>
                    <li>5-digit or 5-4 digit numeric code for US) <p>Pattern is \d{5}(-\d{4})?</p>
                    </li>
                  </ol>
                  <p>Contained within addressDetails.</p>
                  <p>Postal Code or zip code for the manifest address.</p>
                </td>
              </tr>
              <tr>
                <td>
                  <p>shipmentId</p>
                </td>
                <td>
                  <p>String</p>
                </td>
                <td>
                  <p>Optional</p>
                </td>
                <td>
                  <p>(Alphanumeric String &ndash; up to 32 letters/digits)</p>
                  <p>Contained within excludedShipments.</p>
                  <p>This is an identification number representing an existing shipment that is to be excluded from the Transmit Shipments.</p>
                  <p><strong>Note:</strong> If this feature is to be used, your system must store shipment ids from prior Create Shipment or Get Shipment calls and have a mechanism for selecting the ones to be excluded from transmit.</p>
                </td>
              </tr>
            </tbody>
          </table>
        x-ibm-languages:
          description:
            fr: |-
              <p><strong>Demande &ndash; Aper&ccedil;u g&eacute;n&eacute;ral des champs</strong></p> <p>La&nbsp;pr&eacute;sente section offre un aper&ccedil;u g&eacute;n&eacute;ral des champs (Complexe) faisant partie des donn&eacute;es d'entr&eacute;e pour ce service.</p> <table>
                <thead>
                  <tr>
                    <th>Nom du champ</th>
                    <th>Type</th>
                    <th>Requis/Facultatif</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <p>customerRequestId</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>
                      <p>Facultatif</p>
                    </td>
                    <td>
                      <p>Pour utilisation future.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>groupIds</td>
                    <td>Tableau de cha&icirc;nes de caract&egrave;res</td>
                    <td>Requis</td>
                    <td>
                      <p>Il s'agit d'une liste de num&eacute;ros d'identification de groupe. Le service Transmettre les envois cr&eacute;era un manifeste pour chaque groupe. Le manifeste comprendra la liste des envois compris dans le groupe (&agrave; l'exception des envois que vous excluez).</p>
                    </td>
                  </tr>
                  <tr>
                    <td>requestedShippingPoint</td>
                    <td>Cha&icirc;ne de caract&egrave;res</td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Cha&icirc;ne de six caract&egrave;res alphanum&eacute;riques)</p>
                      <p>Doit &ecirc;tre dans un format de code postal valide.</p>
                      <p>Exemple : A9A9A9</p>
                      <p>Le format est [A-Z]\d[A-Z]\d[A-Z]\d.</p>
                      <p>Si vous d&eacute;posez vous-m&ecirc;me vos envois, vous avez deux choix :</p>
                      <ul>
                        <li>ne pas r&eacute;gler ce champ, et indiquer le num&eacute;ro d'identification de l'emplacement d'exp&eacute;dition dans shippingPointId (option recommand&eacute;e);</li>
                        <li>fournir le code postal de votre lieu d'exp&eacute;dition ici et ne pas r&eacute;gler le champ shippingPointId.</li>
                      </ul>
                      <p><strong>Nota :</strong> L'utilisation de le champ requestedShippingPoint pour indiquer le code postal de votre lieu d'exp&eacute;dition ne sera plus possible dans une version future. Si vous d&eacute;posez vous-m&ecirc;me vos envois, nous vous recommandons d'utiliser le champ shippingPointId.</p>
                      <p>Ce champ est obligatoire lorsque l'indicateur de ramassage de la SCP (cpcPickupIndicator) est fourni.</p>
                      <p>Option s'excluant mutuellement avec le champ shippingPointId.</p>
                      <p>Si vous fournissez ici le m&ecirc;me code postal que vous avez utilis&eacute; dans vos demandes de service &laquo; Cr&eacute;er l'envoi &raquo;, aucun rajustement tarifaire ne sera associ&eacute; au point de d&eacute;part pour l'exp&eacute;dition. Si vous utilisez ici un code postal diff&eacute;rent de celui utilis&eacute; dans les demandes de service &laquo; Cr&eacute;er l'envoi &raquo;, un rajustement tarifaire pourrait &ecirc;tre effectu&eacute; selon la distance entre le point d'exp&eacute;dition initial (dans la demande de service &laquo; Cr&eacute;er l'envoi &raquo;) et le point d'exp&eacute;dition final (dans la demande de service &laquo; Transmettre les envois &raquo;).</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>cpcPickupIndicator</p>
                    </td>
                    <td>
                      <p>Bool&eacute;en</p>
                    </td>
                    <td>
                      <p>Facultatif</p>
                    </td>
                    <td>
                      <p>(true)</p>
                      <p>R&eacute;glez ce champ &agrave; &laquo; true &raquo; si vos envois sont ramass&eacute;s par Postes Canada ou par une tierce partie. Ne fournissez pas ce champ si le champ est r&eacute;gl&eacute; &agrave; &laquo; false &raquo;. Fournissez le code postal de votre lieu de ramassage dans le champ requestedShippingPoint. Si vous utilisez le m&ecirc;me indicateur et le m&ecirc;me point d'exp&eacute;dition demand&eacute; (requestedShippingPoint) que ceux utilis&eacute;s dans la demande de service &laquo; Cr&eacute;er l'envoi &raquo;, il n'y aura aucun rajustement tarifaire; consultez les d&eacute;tails dans le champ requestedShippingPoint.</p>
                      <p>Ne fournissez pas ce renseignement si vous d&eacute;posez vous-m&ecirc;me vos envois.</p>
                      <p>Option s'excluant mutuellement avec le champ shippingPointId.</p>
                      <p><strong>Nota :</strong> Dans une version future, il sera obligatoire d'indiquer explicitement si votre envoi est ramass&eacute; par Postes Canada (en fournissant &agrave; la fois cet indicateur et le champ requestedShippingPoint) ou d&eacute;pos&eacute; &agrave; un emplacement de Postes Canada (en fournissant le champ shippingPointId).</p>
                      <p>Nous vous recommandons de vous pr&eacute;parer &agrave; ce changement en offrant cet indicateur (et le champ requestedShippingPoint) si votre envoi est ramass&eacute; par Postes Canada.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>shippingPointId</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>
                      <p>Requis sous condition</p>
                    </td>
                    <td>
                      <p>(Cha&icirc;ne de quatre caract&egrave;res alphanum&eacute;riques)</p>
                      <p>Si vous d&eacute;posez vos articles &agrave; un bureau de poste ou &agrave; une autre installation de Postes Canada, fournissez le num&eacute;ro d'emplacement de ce lieu de d&eacute;p&ocirc;t. Recherchez le num&eacute;ro d'emplacement en question &agrave; l'aide de la fonction <a href="../../../../information/app/fdl/entreprise/trouverunlieudedepot" aria-invalid="true">Trouver un lieu de d&eacute;p&ocirc;t</a>. Cette information est utilis&eacute;e pour la tarification.</p>
                      <p>Si vous saisissez un num&eacute;ro d'emplacement diff&eacute;rent de celui fourni dans votre demande de service &laquo; Cr&eacute;er l'envoi &raquo;, des ajustements tarifaires peuvent s'imposer.</p>
                      <p>Option s'excluant mutuellement avec l'option requestedShippingPoint; cependant, l'une des deux doit &ecirc;tre saisie.</p>
                      <p><strong>Nota :</strong> Si vous d&eacute;posez vous-m&ecirc;me vos envois, nous vous recommandons d'utiliser ce champ plut&ocirc;t que le champ requestedShippingPoint pour indiquer votre lieu d'exp&eacute;dition.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>methodOfPayment</td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis</td>
                    <td>
                      <p>{Cha&icirc;ne de 15 caract&egrave;res}</p>
                      <p>Cela d&eacute;signe le mode de paiement utilis&eacute; pour les manifestes devant &ecirc;tre g&eacute;n&eacute;r&eacute;s.</p>
                      <p>Les modes de paiement valides sont les suivants :</p>
                      <ul>
                        <li>CreditCard = Le paiement sera effectu&eacute; par carte de cr&eacute;dit.</li>
                        <li>Account = Le paiement se fera par l'interm&eacute;diaire d'une convention en vigueur qui aura &eacute;t&eacute; conclue avec le payeur.</li>
                        <li>SupplierAccount = le paiement se fera par l&rsquo;interm&eacute;diaire du compte de fournisseur d&eacute;sign&eacute; comme valeur par d&eacute;faut dans le profil du client (offert uniquement aux fournisseurs de comptes de fournisseur).</li>
                      </ul>
                      <p>Nota : Diff&eacute;rents payeurs pourraient &ecirc;tre associ&eacute;s &agrave; diff&eacute;rents envois. Des manifestes distincts seront g&eacute;n&eacute;r&eacute;s pour les envois dont les payeurs sont diff&eacute;rents.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>manifestAddress</td>
                    <td>Objet</td>
                    <td>Requis</td>
                    <td>Cette structure contient l'adresse imprim&eacute;e sur l'&eacute;tiquette du manifeste.</td>
                  </tr>
