        nameOnCard:
          $ref: '#/components/schemas/nameOnCard'
        authCode:
          description: |-
            The authorization code received from the credit card issuer.

            ---

            Code d'autorisation reçu de la société émettrice de la carte de crédit.
          type: string
          minLength: 1
          maxLength: 10
        authTimestamp:
          description: |-
            The date and time that the credit card company authorized the transaction.

            ---

            Date et heure auxquelles la transaction a été autorisée par la société émettrice de cartes de crédit.
          type: string
          format: date-time
        cardType:
          description: |-
            The type of credit card used for the purchase.

            ---

            Type de carte de crédit utilisé pour l'achat.
          enum:
            - MC
            - VIS
            - AME
            - DC
            - DIS
            - ER
        currency:
          $ref: '#/components/schemas/currency'
        transactionType:
          $ref: '#/components/schemas/transactionType'
      required:
        - merchantName
        - merchantUrl
        - authCode
        - authTimestamp
        - cardType
        - currency
        - transactionType
    supplierAccountReceiptDetails:
      description: |-
        This structure will be provided if the manifest was paid for by Supplier Account in the Transmit Shipments request.

        This structure is not returned in the sandbox environment.

        ---

        Cette structure sera offerte si le manifeste a été payé par compte de fournisseur dans la demande Transmettre les envois.

        Cette structure n'est pas retournée dans l'environnement « bac à sable ».
      type: object
      properties:
        merchantName:
          $ref: '#/components/schemas/merchantName'
        merchantUrl:
          $ref: '#/components/schemas/merchantUrl'
        authCode:
          description: |-
            The authorization code received from the supplier.

            ---

            Le code d'autorisation reçu du fournisseur.
          type: string
          minLength: 1
          maxLength: 16
        authTimestamp:
          description: |-
            The date and time the supplier authorized the transaction.

            ---

            Date et heure auxquelles la transaction a été autorisée par la société émettrice de cartes de crédit.
          type: string
          format: date-time
        supplierId:
          description: |-
            The supplier that authorized the transaction. Values are:

            - FP = FrancoTyp Postalia
            - NE = Neopost
            - PB = Pitney Bowes

            ---

            Le fournisseur qui a autorisé la transaction. Les valeurs
            sont :

            - FP = FrancoTyp Postalia
            - NE = Neopost
            - PB = Pitney Bowes
          type: string
        currency:
          $ref: '#/components/schemas/currency'
        transactionType:
          $ref: '#/components/schemas/transactionType'
      required:
        - merchantName
        - merchantUrl
