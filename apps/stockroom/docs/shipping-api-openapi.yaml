      schema:
        $ref: '#/components/schemas/trackingPin'
    manifestId:
      name: id
      in: path
      description: ID of the manifest to retrieve.
      x-ibm-languages:
        description:
          fr: Identifiant du manifeste à récupérer.
      required: true
