                      <p>Le num&eacute;ro de r&eacute;f&eacute;rence du client peut &ecirc;tre fourni &agrave; Postes Canada, puis inscrit sur le manifeste et affich&eacute; dans une demande de service Obtenir les d&eacute;tails du manifeste.</p>
