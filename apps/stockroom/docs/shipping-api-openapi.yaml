    createShipmentResponse:
      description: |-
        Create Shipment - Response

        ---

        Créer l'envoi - Réponse
      type: object
      properties:
        customerRequestId:
          $ref: '#/components/schemas/customerRequestId'
        shipmentId:
          $ref: '#/components/schemas/shipmentId'
        shipmentStatus:
          $ref: '#/components/schemas/shipmentStatus'
        trackingPin:
          $ref: '#/components/schemas/trackingPin'
        returnTrackingPin:
          $ref: '#/components/schemas/returnTrackingPin'
        poNumber:
          $ref: '#/components/schemas/poNumber'
        shipmentPrice:
          allOf:
            - $ref: '#/components/schemas/shipmentPrice'
          description: |-
            This structure will only be returned on a shipment where no manifest is required and where the providePricingInfo field was set to true in the request.

            ---

            Cette structure ne sera renvoyée que pour une expédition pour laquelle aucun manifeste n'est requis et où le champ providePricingInfo a été défini sur true dans la requête.
        shipmentReceipt:
          allOf:
            - $ref: '#/components/schemas/shipmentReceipt'
          description: |-
            This structure will only be returned on a shipment where no manifest is required and was paid for by credit card or Supplier Account.

            It contains the same fields provided in the response to **Get Shipment Receipt**.

            Please note that the same dummy values are always returned in the sandbox environment (AA1111 for auth-code, for example).

            ---

            Cette structure ne sera renvoyée que pour les expéditions pour lesquelles aucun manifeste n'est requis et payées par carte de crédit ou compte fournisseur.

            Elle contient les mêmes champs que ceux fournis dans la réponse à **Obtenir le reçu d'expédition**.

            Veuillez noter que les mêmes valeurs fictives sont toujours renvoyées dans l'environnement sandbox (AA1111 pour le code d'autorisation, par exemple).
        links:
          $ref: '#/components/schemas/links'
      required:
        - shipmentId
        - shipmentStatus
        - links
    shipmentPrice:
      description: |-
        Get Shipment Price - Response

        ---

        Obtenir le tarif de l'envoi - Réponse
      properties:
        serviceCode:
          $ref: '#/components/schemas/serviceCode'
        baseAmount:
          $ref: '#/components/schemas/baseAmount'
        pricedOptions:
          description: |-
            This structure contains the list of options applied to this shipment and the associated price impact.

            This will be absent if there are no options applied to the price of this shipment.

            ---

            Cette structure contient la liste d'options appliquées à cet envoi et l'incidence tarifaire connexe.

            Cet élément sera absent s'il n'y a aucune option appliquée au tarif de cet envoi.
          type: array
          items:
            type: object
            properties:
              optionCode:
                $ref: '#/components/schemas/optionCode'
              optionPrice:
                allOf:
                  - $ref: '#/components/schemas/costAllowsNegative'
                description: |-
                  This is the total component of the price that is attributable to the option. Units are $CAD.

                  ---

                  Il s'agit de la composante totale du tarif attribuable à l'option. Les unités s'affichent en dollars canadiens.
            required:
              - optionCode
        adjustments:
          description: |-
            This structure contains the list of adjustments applied to this shipment and the associated price impact.

            This will be absent if there are no adjustments applied to the price of this shipment.

            ---

            Cette structure contient la liste de rajustements appliqués à cet envoi et l'incidence tarifaire connexe.

            Cet élément sera absent s'il n'y a aucun rajustement appliqué au tarif de cet envoi.
          type: array
          items:
            properties:
              adjustmentCode:
                description: |-
                  The code indicating which adjustment is applied to this shipment:

                  - AUTDISC – Automation discount
                  - FUELSC – Fuel surcharge
                  - NCNTGST – Non-contiguous state fee (applies to Priority Worldwide products sent to Alaska and Hawaii)
                  - V1DISC – Solutions for Small Business savings
                  - PROMODISC – Promotional discount (if the promo code is invalid or expired, the discount amount will show as zero under adjustment-amount)
                  - PLATFMDISC – Discount for using an e-commerce platform
                  - NEWREGDISC – Discount for joining the Developer Program
                  - ORIGSC – Service area adjustment (at origin)
                  - DESTSC – Service area adjustment (at destination)
                  - PURFEE – Fee charged for using a label before it was paid for (i.e., before performing **Transmit Shipments**)
                  - SAADJ – Service area adjustment (rate adjustment up or down for specific source and destination postal code combinations)

                  ---

                  Il s'agit du code de rajustement désignant le rajustement appliqué à cet envoi.

                  - AUTDISC – Réduction à l'automatisation
                  - FUELSC – Supplément pour carburant
                  - V1DISC – Économies du programme Solutions pour petites entreprises
                  - PROMODISC – Réduction promotionnelle (si le code de promotion est invalide ou expiré, le montant de la réduction sera indiqué comme étant zéro sous adjustment-amount).
                  - PLATFMDISC – Réduction pour utilisation d'une plateforme de cybercommerce
                  - NEWREGDISC – Réduction accordée lors de l'inscription au Programme pour développeurs
                  - ORIGSC – Rajustement en fonction de la zone de service (origine)
                  - DESTSC – Rajustement en fonction de la zone de service (destination)
                  - PURFEE – Frais facturés pour avoir utilisé une étiquette avant qu'elle ait été payée (c.-à-d. avant d'exécuter le service **Transmettre les envois**
                  - SAADJ – Ajustement pour zone de service (rajustement tarifaire à la hausse ou à la baisse pour des combinaisons précises de codes postaux d'origine et de destination)
                type: string
              adjustmentAmount:
                allOf:
                  - $ref: '#/components/schemas/costAllowsNegative'
                description: |-
                  This is the total cost attributable to the adjustment.

                  ---

                  Il s'agit du coût total attribuable au rajustement.
            required:
              - adjustmentCode
              - adjustmentAmount
        preTaxAmount:
          allOf:
            - $ref: '#/components/schemas/costAllowsNegative'
          description: |-
            This is the pre-tax total amount of the shipment cost.

            ---

            Il s'agit du montant total avant les taxes pour le tarif d'expédition.
        gstAmount:
          allOf:
            - $ref: '#/components/schemas/costAllowsNegative'
          description: |-
            This is the amount of the GST added to the base cost.

            ---

            Il s'agit du montant de TPS ajouté au prix de base.
        pstAmount:
          allOf:
            - $ref: '#/components/schemas/costAllowsNegative'
          description: |-
            This is the amount of the PST added to the base cost.

            ---

            Il s'agit du montant de TVP ajouté au prix de base.
        hstAmount:
          allOf:
            - $ref: '#/components/schemas/costAllowsNegative'
          description: |-
            This is the amount of the HST added to the base cost.

            ---

            Il s'agit du montant de TVH ajouté au prix de base.
        dueAmount:
          allOf:
            - $ref: '#/components/schemas/costAllowsNegative'
          description: |-
            This is the total amount due for the shipment.

            ---

            Il s'agit du montant total dû pour l'envoi.
        serviceStandard:
          description: |-
            This structure represents the service standard to which this shipment will be delivered.
            ---
            Cette structure représente la norme de service selon laquelle cet envoi sera livré.
          type: object
          properties:
            amDelivery:
              description: |-
                This indicates whether morning delivery is part of the service standard.

                ---

                Cela indique si la livraison le matin fait partie de la norme de service.
              type: boolean
            guaranteedDelivery:
              description: |-
                This indicates whether guaranteed delivery is part of the service standard.

                ---

                Cela indique si la garantie de livraison fait partie de la norme de service.
              type: boolean
            expectedTransitTime:
              description: |-
                This indicates the number of days the package is expected to be in the mail stream from induction to delivery.

                ---

                Il s'agit du nombre de jours pendant lesquels le paquet devrait se trouver dans le flot du courrier, c'est-à-dire depuis le dépôt jusqu'à la livraison.
              type: integer
              minimum: 0
              maximum: 99
            expectedDeliveryDate:
              description: |-
                This indicates the estimated delivery date based from the creation date of the shipment or the expected mailing date provided in the "create" request if greater.

                ---

                Il s'agit de la date de livraison approximative en fonction de la date de création de l'envoi ou de la date de dépôt prévue fournie dans la demande de création si elle dépasse la date de livraison prévue.
              type: string
              format: date
          required:
            - amDelivery
            - guaranteedDelivery
        ratedWeight:
          allOf:
            - $ref: '#/components/schemas/parcelCharacteristics/properties/weight'
          description: |-
            This indicates the actual weight or volumetric equivalent used to determine the base price, within the prescribed weight  and size limits of the specific product, on the greater of actual weight or volumetric equivalent of actual weight.

            ---

            Il désigne le poids réel ou l'équivalent volumétrique utilisé pour déterminer le tarif de base, dans le cadre des limites prescrites en matière de poids et de dimensions pour le produit concerné, à partir du poids réel et l'équivalent volumétrique du poids réel, selon la plus élevée des deux valeurs.
      required:
        - serviceCode
        - baseAmount
        - preTaxAmount
        - gstAmount
        - pstAmount
        - hstAmount
        - dueAmount
        - serviceStandard
        - ratedWeight
    shipmentReceipt:
      description: |-
        Get Shipment Receipt - Response

        ---

        Obtenir le reçu de l'envoi - Réponse
      type: object
      anyOf:
        - properties:
            ccReceiptDetails:
              description: |-
                This structure contains details required for a credit card receipt.

                ---

                Cette structure contient les détails requis pour un reçu de carte de crédit.
              allOf:
                - $ref: '#/components/schemas/ccReceiptDetails'
                - type: object
                  properties:
                    chargeAmount:
                      description: |-
                        The total amount charged to the credit card.

                        ---

                        Montant total facturé sur la carte de crédit.
                      type: number
                  required:
                    - chargeAmount
          required:
            - ccReceiptDetails
        - properties:
            supplierAccountReceiptDetails:
              description: |-
                This structure will be provided only if the shipment was paid by Supplier Account.

                This structure is not returned in the sandbox environment.

                ---

                Cette structure sera fournie uniquement si l'envoi a été payé par compte de fournisseur.

                Cette structure n'est pas retournée dans l'environnement « bac à sable ».
              allOf:
                - $ref: '#/components/schemas/supplierAccountReceiptDetails'
                - type: object
                  properties:
                    chargeAmount:
                      description: |-
                        The total amount charged to the account.

                        ---

                        Le montant total facturé au compte.
                      type: number
                  required:
                    - chargeAmount
          required:
            - supplierAccountReceiptDetails
    shipmentInfo:
      description: |-
        Get Shipment - Response

        ---

        Obtenir l'envoi - Réponse
      type: object
      properties:
        customerRequestId:
          $ref: '#/components/schemas/customerRequestId'
        shipmentId:
          $ref: '#/components/schemas/shipmentId'
        shipmentStatus:
          $ref: '#/components/schemas/shipmentStatus'
        trackingPin:
          $ref: '#/components/schemas/trackingPin'
        returnTrackingPin:
          $ref: '#/components/schemas/returnTrackingPin'
        poNumber:
          $ref: '#/components/schemas/poNumber'
        links:
          $ref: '#/components/schemas/links'
      required:
        - shipmentId
        - shipmentStatus
        - links
    shipmentDetails:
      description: |-
        Get Shipment Details - Response

        ---

        Obtenir les détails de l'envoi - Réponse
      type: object
      properties:
        customerRequestId:
          $ref: '#/components/schemas/customerRequestId'
        shipmentStatus:
          $ref: '#/components/schemas/shipmentStatus'
        finalShippingPoint:
          description: |-
            This field is used for pricing purposes.

            If you provided a requestedShippingPoint field in your Create Shipment request, this is the Postal Code of the Canada Post facility that is closest to your pickup location.

            If you provided a shippingPointId in your Create Shipment request, this is the Postal Code of the deposit location you chose. 

            ---

            Ce champ est utilisé pour la tarification.

            Si vous fournissez un champ requestedShippingPoint dans votre demande de service « Créer l'envoi », il faut saisir le code postal de l'installation de Postes Canada qui est la plus près de votre lieu de ramassage.

            Si vous avez réglé le champ shippingPointId dans votre demande de service « Créer l'envoi », il s'agit du code postal du lieu de dépôt que vous avez choisi.
          type: string
          pattern: ^[A-Z]\d[A-Z]\d[A-Z]\d$
        trackingPin:
          $ref: '#/components/schemas/trackingPin'
        poNumber:
          $ref: '#/components/schemas/poNumber'
        shippingPointId:
          $ref: '#/components/schemas/shippingPointId'
        cpcPickupIndicator:
          allOf:
            - $ref: '#/components/schemas/cpcPickupIndicator'
          description: |-
            Returned if you requested your shipments be picked up.

            ---

            Cet élément s'affiche si vous avez demandé que vos envois soient ramassés.
        shipmentDetail:
          description: |-
            Shipment details.
            ---
            Les détails de l'envoi.
          type: object
          properties:
            groupId:
              $ref: '#/components/schemas/groupId'
            transmitShipment:
              $ref: '#/components/schemas/transmitShipment'
            quickshipLabelRequested:
              $ref: '#/components/schemas/quickshipLabelRequested'
            expectedMailingDate:
              $ref: '#/components/schemas/expectedMailingDate'
            deliverySpec:
              allOf:
                - $ref: '#/components/schemas/deliverySpec'
                - properties:
                    recipient:
                      allOf:
                        - $ref: '#/components/schemas/destination'
                        - description: |-
                            This field appears in the response only if you selected the Deliver to Post Office (D2PO) option when you Generated the shipment. It contains the mail recipient's address that you provided in the destination field in your request.

                            ---

                            Ce champ s'affiche seulement dans la réponse si vous sélectionnez l'option « Livrer au bureau de poste » (D2PO) lorsque vous créez l'envoi. Il contient l'adresse du destinataire du courrier que vous avez indiquée dans le champ destination » de votre demande.
            returnSpec:
              $ref: '#/components/schemas/returnSpec'
            refundRequestInfo:
              description: |-
                This structure is present only if a refund request was submitted for this shipment.

                ---

                This structure is present only if a refund request was submitted for this shipment.
              allOf:
                - $ref: '#/components/schemas/refundInfo'
          allOf:
            - required:
                - deliverySpec
            - anyOf:
                - required:
                    - transmitShipment
                  not:
                    required:
                      - groupId
                - required:
                    - groupId
                  not:
                    required:
                      - transmitShipment
    publicKeyInfo:
      description: |-
        Get Shipment Public Key Info - Response

        ---

        Obtenir les informations sur la clé publique de l'expédition - Réponse
      type: object
      properties:
        expiryDate:
          description: |-
            Provides when the public URL is valid till.

            ---

            Indique quand l'URL publique est valide jusqu'à.
          type: string
          format: date-time
        url:
          description: |-
            Provides un-authenticated url to the label.

            ---

            Fournit une URL non authentifiée à l'étiquette
          type: string
        qrCode:
          description: |-
            It encodes the public url (base64 encode).

            ---

            Il encode l'URL publique (encodage base64)
          type: string
      required:
        - expiryDate
        - url
    groups:
      description: |-
        Get Groups - Response

        ---

        Obtenir les groupes - Réponse
      type: array
      items:
        type: object
        properties:
          groupId:
            $ref: '#/components/schemas/groupId'
          link:
            description: |-
              See **Get Shipments** for information about this link. The group id is automatically provided as a query string in each link.

              ---

              Consultez la section **Obtenir les envois** pour obtenir de plus amples renseignements sur ce lien. L'ID du groupe est automatiquement fourni comme chaîne de requête pour chaque lien.
            allOf:
              - $ref: '#/components/schemas/link'
        required:
          - groupId
          - link
    shipments:
      description: |-
        Get Shipments - Response

        ---

        Obtenir les envois - Réponse
      type: array
      items:
        description: |-
          The href field can be used as an endpoint to the **Get Shipment** service for the shipment.

          The href field can also be used to delete the shipment via an invocation of the **Void Shipment** service.

          ---

          Le champ href peut être utilisé comme point final propre au service **Obtenir l'envoi** pour l'envoi en question.

          Le champ href peut également être utilisé pour supprimer l'envoi à l'aide du service **Annuler l'envoi**.
        allOf:
          - $ref: '#/components/schemas/link'
    refundRequest:
      description: |-
        Request Shipment Refund - Request

        ---

        Demander le remboursement d'un envoi - Demande
      type: object
      properties:
        email:
          allOf:
            - $ref: '#/components/schemas/email'
          description: |-
            Email address used to create the service ticket.

            ---

            Adresse courriel utilisée pour créer le billet de service.
      required:
        - email
      example: '{"email": "joesmith@home.com"}'
    refundInfo:
      description: |-
        Request Shipment Refund - Response

        ---

        Demande de remboursement d'un envoi - Réponse
      type: object
      properties:
        serviceTicketDate:
          description: |-
            Date when the refund request was submitted.

            ---

            Date à laquelle la demande de remboursement a été soumise
          type: string
          format: date
        serviceTicketId:
          description: |-
            The service ticket ID number for your refund request. Please use this number in any communications with Canada Post regarding this refund request.

            **Note:** In the sandbox (development) environment, the same test value (0123456789) is always returned.

            ---

            Numéro d'identification du billet de service associé à votre demande de remboursement. Veuillez utiliser ce numéro dans toutes les communications que vous entretenez avec Postes Canada au sujet de cette demande de remboursement.

            Remarque : Dans l'environnement (de développement) « Bac à sable », la même valeur d'essai (0123456789) est toujours retournée.
          type: string
      required:
        - serviceTicketDate
        - serviceTicketId
    transmitRequest:
      description: |-
        Transmit Shipments - Request

        ---

        Transmettre les envois - Demande
      type: object
      properties:
        customerRequestId:
          allOf:
            - $ref: '#/components/schemas/customerRequestId'
          description: |-
            For Future Use.

            ---

            Pour utilisation future.
        groupIds:
          description: |-
            This is a list of groupIds. The Transmit Shipments service will generate a manifest for each group. The manifest will list the shipments included in the group (with the exception of shipments you exclude).

            ---

            Il s'agit d'une liste de numéros d'identification de groupe. Le service Transmettre les envois créera un manifeste pour chaque groupe. Le manifeste comprendra la liste des envois compris dans le groupe (à l'exception des envois que vous excluez).
          type: array
          items:
            $ref: '#/components/schemas/groupId'
          minItems: 1
        cpcPickupIndicator:
          $ref: '#/components/schemas/cpcPickupIndicator'
        requestedShippingPoint:
          $ref: '#/components/schemas/requestedShippingPoint'
        shippingPointId:
          $ref: '#/components/schemas/shippingPointId'
        detailedManifests:
          description: |-
            This indicates whether a full detailed manifest document will be
            rendered, or a summarized manifest document will be rendered.

            ---

            Cela indique si une version résumée ou très détaillée du
            manifeste sera produite. 
          type: boolean
        methodOfPayment:
          $ref: '#/components/schemas/methodOfPayment'
        manifestAddress:
          $ref: '#/components/schemas/manifestAddress'
        customerReference:
          description: |-
            A customer reference number may be provided to Canada Post which is placed on the manifest and returned in a Get Manifest Details request.

            ---

            Le numéro de référence du client peut être fourni à Postes Canada, puis inscrit sur le manifeste et affiché dans une demande de service Obtenir les détails du manifeste.
          type: string
          maxLength: 12
        excludedShipments:
          description: |-
            The list of shipmentIds that are to be excluded from transmission. These shipments will remain in their group and will automatically be picked up for the next transmit.

            ---

            Il s'agit de la liste de shipmentIds devant être exclus de la transmission. Ces envois demeureront dans leur groupe et ils seront automatiquement ramassés au cours de la prochaine transmission.
          type: array
          items:
            $ref: '#/components/schemas/shipmentId'
          minItems: 1
      required:
        - groupIds
        - detailedManifests
        - methodOfPayment
        - manifestAddress
      example: |-
        {
          "groupIds": [
            "testGroup"
          ],
          "requestedShippingPoint": "K0A1W0",
          "cpcPickupIndicator": true,
          "detailedManifests": true,
          "methodOfPayment": "Account",
          "customerReference": "reference",
          "excludedShipments": {
            "shipmentId": "750721708399395444"
          },
          "manifestAddress": {
            "manifestCompany": "my company",
            "manifestName": "MajorShop",
            "phoneNumber": "555 555 5555",
            "addressDetails": {
              "addressLine1": "1230 Tako RD.",
              "city": "Ottawa",
              "provState": "ON",
              "postalZipCode": "K1A1A1"
            }
          }
        }
    manifestList:
      description: |-
        Response:

        - Transmit Shipments
        - Get Manifests

        ---

        Réponse :

        - Transmettre les expéditions
        - Obtenir les manifestes
      type: array
      items:
        allOf:
          - $ref: '#/components/schemas/link'
        description: |-
          The system will generate separate manifests:

          - by Canadian vs. international shipments.
          - by mobo
          - by paid-by-customer
          - by contract number

          If you attempt to transmit shipments that we billed you for automatically (in cases where you inducted shipments before performing a Transmit Shipments call), you will receive a link to an empty manifest. The empty manifest informs you that you were billed automatically and provides details about how to avoid this in the future.

          The empty manifest does not contain shipments or details, cannot be retrieved through Get Manifests and cannot be used to induct mail. The detailed manifest we created for you with the shipments that you were billed for automatically will be sent to the email address provided in your online Canada Post profile.

          ---

          Le système produira des manifestes séparés en fonction des éléments suivants :

          - Envois canadiens par rapport aux envois internationaux
          - Client « Expédié au nom de »
          - Payeur
          - Numéro de convention

          Si vous tentez de transmettre des envois que nous avons facturés automatiquement (dans les cas où vous avez déposé des envois avant deffectuer une demande de service Transmettre les envois), vous recevrez un lien vers un manifeste vide. Le manifeste vide vous informe que vos envois ont été facturés automatiquement et fournit des détails sur la façon déviter que cela ne se reproduise.

          Le manifeste vide ne contient pas les envois ou les détails et ne peut pas être récupéré au moyen du paramètre Obtenir les manifestes ni utilisé pour déposer du courrier. Le manifeste détaillé que nous avons créé pour vous au moyen des envois qui vous ont été facturés automatiquement sera envoyé à ladresse courriel qui figure dans votre profil de PostesCanada en ligne.
    manifestInfo:
      description: |-
        Get Manifest - Response

        ---

        Obtenir le manifeste - Réponse
      type: object
      properties:
        customerRequestId:
          allOf:
            - $ref: '#/components/schemas/customerRequestId'
          description: |-
            For Future Use.

            ---

            Pour utilisation future.
        poNumber:
          $ref: '#/components/schemas/poNumberManifest'
        links:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/link'
            description: |-
              May occur 1 … N times. However, at the current time, there are four links:

              1.  rel="self"
              2.  rel="artifact"
              3.  rel="details"
              4.  rel="manifestShipments"

              Each link allows you to retrieve different information about the manifest.

              1.  rel="self"
                  
                  This represents a repeat of the original Get Manifest call used to get this list of links. It can be stored for later use.
                  
              2.  rel = "artifact"
                  
                  This link will return a PDF file to be printed to allow pickup or drop-off of the associated physical shipments. See **Get Artifact**.
                  
              3.  rel = "details"
                  
                  This link returns details found on the hardcopy manifest such as a summary of shipments and the total cost of the manifest. See **Get Manifest Details**.
                  
                  **Note:** This link would not be returned for an empty manifest (see **Transmit Shipments** for details).
                  
              4.  rel – "manifestShipments"
                  
                  This link will return links to every shipment in the manifest. See **Get Shipments**.
                  
                  **Note:** This link would not be returned for an empty manifest (see **Transmit Shipments** for details).

              ---

              Occurrence (1 à N fois). Toutefois, à l'heure actuelle, il y a quatre liens :

              1.  rel="self"
              2.  rel="artifact"
              3.  rel="details"
              4.  rel="manifestShipments"

              Chaque lien vous permet de récupérer différents renseignements sur le manifeste.

              1.  rel="self"
                  
                  Cela représente une répétition de la demande de service Obtenir le manifeste initial utilisé pour obtenir cette liste de liens. On peut le garder pour plus tard.
                  
              2.  rel = "artifact"
                  
                  Ce lien affichera un fichier PDF à imprimer pour permettre le ramassage ou le dépôt des envois physiques associés. Voir **Obtenir l'artefact**.
                  
              3.  rel = "details"
                  
                  Ce lien fournit des détails qui se trouvent dans le manifeste papier, notamment le sommaire des envois et le coût total du manifeste. Voir **Obtenir les détails du manifeste**.
                  
                  **Remarque :** Ce lien ne serait pas retourné pour un manifeste vide (consultez la page **Transmettre les envois** pour obtenir plus de détails).
                  
              4.  rel – "manifestShipments"
                  
                  Ce lien fournira des liens vers chaque envoi inclus dans le manifeste. Voir **Obtenir les envois**.
                  
                  **Remarque :** Ce lien ne serait pas retourné pour un manifeste vide (consultez la page **Transmettre les envois** pour obtenir plus de détails).
      required:
        - poNumber
        - links
    manifestDetails:
      description: |-
        Get Manifest Details - Response

        ---

        Obtenir les détails du manifeste - Réponse
      type: object
      properties:
        poNumber:
          $ref: '#/components/schemas/poNumberManifest'
        finalShippingPoint:
          description: |-
            This is the Postal Code of the Post Office where the shipment is to be dropped off.

            ---

            Il s'agit du code postal du bureau de poste où l'envoi doit être déposé.
          type: string
          pattern: ^[A-Z]\d[A-Z]\d[A-Z]\d$
        shippingPointName:
          description: |-
            This is the descriptive name of the shipping point.

            ---

            Il s'agit du nom descriptif du point d'expédition.   
          type: string
          maxLength: 35
        shippingPointId:
          allOf:
            - $ref: '#/components/schemas/shippingPointId'
          description: |-
            This is the Canada Post identification number of the shipping point.

            ---

            Il s'agit du numéro d'identification de Postes Canada pour le point d'expédition.
        cpcPickupIndicator:
          allOf:
            - $ref: '#/components/schemas/cpcPickupIndicator'
          description: |-
            Returned if you specified that your mail is picked up by Canada Post at your site.

            ---

            Affiché si vous avez mentionné que votre courrier est ramassé par Postes Canada à votre emplacement.
        mailedByCustomer:
          $ref: '#/components/schemas/mailedByCustomer'
        mailed-on-behalf-of:
          $ref: '#/components/schemas/mailed-on-behalf-of'
        paidByCustomer:
          allOf:
            - $ref: '#/components/schemas/paidByCustomer'
          description: |-
            Customer number of the customer who is paying for the shipment. This is often the same as the mailed-on-behalf-of customer number.

            ---

            Numéro de client du client qui paie l'envoi. Ce numéro est souvent le même que celui du client « Expédié au nom de ».
        customerRef:
          description: |-
            This is the reference field provided by the client in the transmit request.

            ---

            Il s'agit du champ de référence fourni par le client dans la demande de transfert.
          type: string
          maxLength: 12
        manifestDate:
          description: |-
            This is the date the manifest was generated.

            Note: on the printed manifest, there is both a "manifest date" and a "shipment date" printed.  The shipment date is the same as the manifest date.

            ---

            Il s'agit de la date à laquelle le manifeste a été généré.

            Nota : Sur le manifeste imprimé, on trouve à la fois la « date du manifeste » et la « date d'expédition ». La date d'expédition est la même que la date du manifeste.
          type: string
          format: date
        manifestTime:
          description: |-
            (HH:MM TZ) where

            - HH = the 24-hour based hour
            - MM = the minutes
            - TZ = the time zone abbreviation (for the server)

            This is the time when the manifest was generated.

            ---

            (HH:MM TZ) :

            - HH = Heure au format 24 heures
            - MM = Minutes
            - TZ = Abréviation pour le fuseau horaire (du serveur)

            Il s'agit de l'heure à laquelle le manifeste a été généré.
          type: string
          pattern: ^\d{2}:\d{2} [a-zA-Z ]+$
        contractId:
          allOf:
            - $ref: '#/components/schemas/contractId'
          description: |-
            This is the contract number that was used for pricing this manifest, if applicable (i.e. if you are using a service not on your contract, contract id is not required).

            ---

            Il s'agit du numéro de la convention utilisée pour la tarification de ce manifeste, s'il y a lieu (p. ex., si vous utilisez un service qui n'est pas indiqué dans votre convention, il n'est pas nécessaire d'indiquer le numéro de cette dernière).
        methodOfPayment:
          allOf:
            - $ref: '#/components/schemas/methodOfPayment'
          description: |-
            This indicates the method of payment by the customer.

            ---

            Cela indique le mode de paiement du client.
        ccReceiptDetails:
          allOf:
            - $ref: '#/components/schemas/ccReceiptDetails'
        supplierAccountReceiptDetails:
          allOf:
            - $ref: '#/components/schemas/supplierAccountReceiptDetails'
        manifestPricingInfo:
          description: |-
            This structure contains the information about the total pricing of
            all items on the manifest.

            ---

            Cette structure comprend l'information sur la tarification totale
            de tous les envois inclus dans le manifeste.
          type: object
          properties:
            baseCost:
              allOf:
                - $ref: '#/components/schemas/costAllowsZero'
              description: |-
                This is the total pre-tax pricing of all items on the manifest.

                ---

                Il s'agit du total des coûts de base pour tous les envois figurant sur le manifeste.
            automationDiscount:
              allOf:
                - $ref: '#/components/schemas/costAllowsNegative'
              description: |-
                This is the total pre-tax automation discount of all items on the manifest.

                ---

                Il s'agit du total de la réduction à l'automatisation pour tous les envois figurant sur le manifeste. 
            optionsAndSurcharges:
              allOf:
                - $ref: '#/components/schemas/costAllowsNegative'
              description: |-
                This is the total pre-tax options and surcharges amount for all items on the manifest.

                ---

                Il s'agit du total pour les options et les suppléments pour tous les envois figurant sur le manifeste
            gst:
              allOf:
                - $ref: '#/components/schemas/costAllowsZero'
              description: |-
                This is the GST total for all shipments on the manifest.

                ---

                Il s'agit du total de la TPS pour tous les envois figurant sur le manifeste.
            pst:
              allOf:
                - $ref: '#/components/schemas/costAllowsZero'
              description: |-
                This is the GST total for all shipments on the manifest.

                ---

                Il s'agit du total de la TVP pour tous les envois figurant sur le manifeste.
            hst:
              allOf:
                - $ref: '#/components/schemas/costAllowsZero'
              description: |-
                This is the GST total for all shipments on the manifest.

                ---

                Il s'agit du total de la TVH pour tous les envois figurant sur le manifeste.
            totalDueCpc:
              allOf:
                - $ref: '#/components/schemas/costAllowsZero'
              description: |-
                This is the total due amount for all items on the manifest.

                ---

                Il s'agit du total dû à Postes Canada pour tous les envois figurant sur le manifeste.
          required:
            - baseCost
            - automationDiscount
            - optionsAndSurcharges
            - gst
            - pst
            - hst
            - totalDueCpc
        manifestAddress:
          $ref: '#/components/schemas/manifestAddress'
      required:
        - poNumber
        - finalShippingPoint
        - shippingPointName
        - shippingPointId
        - mailedByCustomer
        - mailed-on-behalf-of
        - paidByCustomer
        - manifestDate
        - manifestTime
        - methodOfPayment
        - manifestPricingInfo
        - manifestAddress
  securitySchemes:
    Oauth2:
      type: oauth2
      x-ibm-oauth-provider: cpc-api-native-oauth-provider
      flows:
        clientCredentials:
          tokenUrl: https://api.canadapost-postescanada.ca/prod/devportal-portaildesdeveloppeurs/cpc-api-native-oauth-provider/oauth2/token
          scopes:
            merchant: default description
            platform: ''
x-ibm-configuration:
  cors:
    enabled: true
  type: rest
  phase: realized
  enforced: true
  testable: true
  oauth-servers:
    Oauth2:
      clientCredentials:
        tokenUrls:
          - https://api.canadapost-postescanada.ca/prod/devportal-portaildesdeveloppeurs/cpc-api-native-oauth-provider/oauth2/token
        authorizationUrls: []
        refreshUrls: []
x-ibm-endpoints:
  - url: https://api.canadapost-postescanada.ca/prod/devportal-portaildesdeveloppeurs/shipping/v1
security:
  - Oauth2:
      - merchant
