                    <td>
                      <p>{PDF, ZPL}</p>
                      <p>Servez-vous de ce champ pour pr&eacute;ciser le format de sortie pour votre &eacute;tiquette d'exp&eacute;dition : PDF ou ZPL II. Si le champ est vide, le format PDF sera s&eacute;lectionn&eacute; par d&eacute;faut.</p>
                      <p>Si vous choisissez le format ZPL, la r&eacute;ponse du service &laquo; Obtenir l'artefact &raquo; inclura un fichier contenant des commandes d'impression ZPL II. Vous devrez ensuite coder une solution ou utiliser une application afin d'envoyer les commandes directement &agrave; une imprimante thermique.</p>
                      <p>Pour les &eacute;tiquettes de format ZPL II, votre imprimante doit permettre la troncature. Utilisez notre <a href="../../../printing-labels">exemple de code pour tester la capacit&eacute; de votre imprimante &agrave; tronquer du texte.</a></p>
                      <p>Le format ZPL est uniquement disponible sur du papier thermosensible, alors le champ &laquo; outputFormat &raquo;&nbsp;doit &ecirc;tre de 4 po sur 6 po.</p>
