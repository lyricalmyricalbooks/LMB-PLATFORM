                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Cha&icirc;ne alphanum&eacute;rique &ndash; Jusqu'&agrave; 10 lettres/chiffres)</p>
                      <p>Requis si le champ parent correspondant &laquo; option &raquo; existe.</p>
                      <p>Il s'agit du code d'option indiquant l'option qui s'applique &agrave; l'envoi.</p>
                      <p>Les codes d'option valides sont les suivants :</p>
                      <p>SO &ndash; Signature<br>COV &ndash; Couverture<br>COD &ndash; Contre remboursement <br>PA18 &ndash; Preuve d'&acirc;ge requise (18 ans)<br>PA19 &ndash; Preuve d'&acirc;ge requise (19 ans)<br>PA21 &ndash; Preuve d'&acirc;ge requise (21 ans)<br>HFP &ndash; Annoncer par carte<br>DNS &ndash; Ne pas laisser en lieu s&ucirc;r<br>LAD &ndash; Laisser &agrave; la porte &ndash; Pas d'avis<br>D2PO &ndash; Livrer au bureau de poste</p>
                      <p><strong>Nota :</strong> L'option &laquo; D2PO &raquo; indique que le colis sera livr&eacute; directement &agrave; un bureau de poste proche. Les champs&nbsp;suivants sont requis pour l'option &laquo; D2PO &raquo; :</p>
                      <ul>
                        <li>name (sous destination)</li>
                        <li>clientVoiceNumber (sous destination)</li>
                        <li>notification</li>
                        <li>optionQualifier2</li>
                      </ul>
                      <p><strong>Remarque :</strong> Si vous choisissez l'option de contre remboursement (COD), l'option Annoncer par carte (HFP) ou l'option Livrer au bureau de poste (D2PO). La perception de fonds pour des envois contre remboursement est ainsi facilit&eacute;e au bureau de poste. Si aucune option n'est choisie, le syst&egrave;me s&eacute;lectionnera par d&eacute;faut l'option HFP.</p>
                      <p><strong>Codes de traitement pour la non-livraison</strong><br>(requis pour certains envois &agrave; destination des &Eacute;.-U. et du r&eacute;gime international)<br>RASE &ndash; Retourner aux frais de l'exp&eacute;diteur<br>RTS &ndash; Renvoi &agrave; l'exp&eacute;diteur<br>ABAN &ndash; Abandon</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>optionAmount</p>
                    </td>
                    <td>
                      <p>Nombre</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Champ num&eacute;rique de six chiffres, suivis de deux d&eacute;cimales [p. ex., format 999999.99])</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; option &raquo; existe, selon la valeur du code d'option.</p>
                      <p>Exemple : Pour l'option &laquo; COV &raquo;, il s'agit du montant de la couverture &agrave; acheter.</p>
                      <p>Pour l'option &laquo; COD &raquo;, il s'agit du montant de base pour les envois contre remboursement (les frais d'exp&eacute;dition peuvent aussi &ecirc;tre ajout&eacute;s par le syst&egrave;me, tel qu'il est d&eacute;crit ci-dessous pour le champ &laquo; optionQualifier1 &raquo;).</p>
                      <p>Ne pas fournir dans le cas des envois &agrave; destination des &Eacute;tats-Unis ou du r&eacute;gime international si vous voulez que le syst&egrave;me calcule la couverture maximale permise (voir le champ optionQualifier1 ci-dessous).</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>optionQualifier1</p>
                    </td>
                    <td>
                      <p>Bool&eacute;en</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>Attribut bool&eacute;en &ndash; {vrai, faux}</p>
                      <p>Peut &ecirc;tre utilis&eacute; pour fournir un qualificatif pour les options CR ou COV.</p>
                      <p>Pour indiquer si le montant du paiement CR comprend les frais d&rsquo;exp&eacute;dition ou non :</p>
                      <ul>
                        <li>Vrai = Les frais d&rsquo;exp&eacute;dition seront ajout&eacute;s au montant CR que vous avez indiqu&eacute; dans &laquo; optionAmount &raquo;.</li>
                        <li>Faux = Le montant CR &agrave; percevoir est indiqu&eacute; dans &laquo; optionAmount &raquo;&nbsp;(c.-&agrave;-d. que les frais d&rsquo;exp&eacute;dition ne seront pas ajout&eacute;s).</li>
                      </ul>
                      <p>&Agrave; utiliser avec l&rsquo;option COV pour les envois &agrave; destination des &Eacute;tats-Unis ou du r&eacute;gime international pour indiquer que le syst&egrave;me peut appliquer le montant de la couverture maximale permise, qui devrait correspondre &agrave; la valeur totale de vos articles, jusqu&rsquo;&agrave; la limite maximale permise pour le produit et le pays en question :</p>
                      <ul>
                        <li>Vrai = Utiliser la couverture maximale permise; lorsqu&rsquo;elle est utilis&eacute;e, il n&rsquo;est pas n&eacute;cessaire de fournir &laquo; optionAmount &raquo;.</li>
                        <li>Faux (par d&eacute;faut) = Utiliser le montant de la couverture indiqu&eacute;e dans &laquo; optionAmount &raquo;.</li>
                      </ul>
                      <p>Si le qualificatif n&rsquo;est pas fourni, l&rsquo;attribut &laquo; Faux &raquo; est s&eacute;lectionn&eacute; par d&eacute;faut.</p>
                    </td>
