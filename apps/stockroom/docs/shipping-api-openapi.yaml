        type: string
      example: '949771771416148042'
  responses:
    '202':
      description: The 202 (Accepted) status code indicates that the request has been accepted for processing, but the processing has not been completed. The request might or might not eventually be acted upon, as it might be disallowed when processing actually takes place.
      x-ibm-languages:
        description:
          fr: Le code d’état 202 (Acceptée) indique que la demande a été acceptée aux fins de traitement, mais que le traitement n’a pas été effectué. La demande pourrait éventuellement être traitée ou non, car elle pourrait être refusée au moment du traitement.
    '204':
      description: The 204 (No Content) status code indicates that the server has successfully fulfilled the request and that there is no additional content to send in the response content.
      x-ibm-languages:
        description:
          fr: Le code d’état 204 (Aucun contenu) indique que le serveur a bien traité la demande et qu’il n’y a pas de contenu supplémentaire à envoyer dans le contenu de la réponse.
    '401':
      description: The 401 (Unauthorized) status code indicates that the server understood the request but refuses to fulfill it.
      x-ibm-languages:
        description:
          fr: Le code d'état 401 (Non autorisé) indique que le serveur a compris la requête mais refuse de la satisfaire.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/unauthorizedError'
          example:
            - httpCode: 401
              httpMessage: Unauthorized
              moreInformation: Cannot pass the security checks that are required by the target API or operation, Enable debug headers for more details.
    '403':
      description: The HTTP 403 (Forbidden) error means the web server received your request but denies you access to the requested resource because you don't have permission.
      x-ibm-languages:
        description:
          fr: L'erreur HTTP 403 (Interdit) signifie que le serveur Web a reçu votre requête mais vous refuse l'accès à la ressource demandée car vous n'en avez pas l'autorisation.
    '404':
      description: The 404 (Not Found) status code indicates that the origin server did not find a current representation for the target resource or is not willing to disclose that one exists.
      x-ibm-languages:
        description:
          fr: Le code d'état 404 (Introuvable) indique que le serveur d'origine n'a pas trouvé de représentation actuelle pour la ressource cible ou ne souhaite pas divulguer son existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/messages'
    '412':
      description: The 412 (Precondition Failed) status code indicates that one or more conditions given in the request header fields evaluated to false when tested on the server (Section 13).
      x-ibm-languages:
        description:
          fr: Le code d'état 412 (Échec de la condition préalable) indique qu'une ou plusieurs conditions données dans les champs d'en-tête de la requête ont été évaluées à faux lors du test sur le serveur (Section 13).
    '500':
      description: The 500 (Internal Server Error) status code indicates that the server encountered an unexpected condition that prevented it from fulfilling the request. Passed through from backend.
      x-ibm-languages:
        description:
          fr: Le code d'état 500 (Erreur interne du serveur) indique que le serveur a rencontré une condition inattendue l'empêchant de traiter la requête. Transmis par le serveur d'arrière-plan.
    '501':
      description: The 501 (Not Implemented) status code indicates that the server does not support the functionality required to fulfill the request.
      x-ibm-languages:
        description:
          fr: Le code d’état 501 (non mis en œuvre) indique que le serveur ne prend pas en charge les fonctions nécessaires pour traiter la demande.
    '503':
      description: The 503 (Service Unavailable) status code indicates that the server is currently unable to handle the request due to a temporary overload or scheduled maintenance, which will likely be alleviated after some delay. Passed through from backend.
      x-ibm-languages:
        description:
          fr: Le code d'état 503 (Service indisponible) indique que le serveur est actuellement indisponible en raison d'une surcharge temporaire ou d'une maintenance planifiée, qui devrait être résolue après un certain délai. Message transmis par le serveur d'arrière-plan.
    '504':
      description: The 504 (Gateway Timeout) status code indicates that the server, while acting as a gateway or proxy, did not receive a timely response from an upstream server it needed to access in order to complete the request. May be passed through from backend.
      x-ibm-languages:
        description:
          fr: Le code d'état 504 (Délai d'attente de la passerelle) indique que le serveur, agissant comme passerelle ou proxy, n'a pas reçu de réponse dans un délai raisonnable d'un serveur en amont auquel il devait accéder pour traiter la requête. Ce code peut provenir du serveur principal.
  schemas:
    shipmentId:
      description: |-
        An unique identifier for the shipment.

        ---

        Il s'agit d'un numéro d'identification unique pour l'envoi.
      type: string
      maxLength: 32
      example: '949771771413547546'
    customerRequestId:
      description: |-
        A unique ID that you can define for this shipment. It must be unique or the request will be rejected.

        Supplier Account vendors must use this field to provide a unique identifier for any shipment that is a pre-authorized payment request.

        You can also use this ID recover shipment details, such as the label, without the need for the information provided in the generate Shipment response. Instead, just use this ID in a request to Get Shipments.        

        ---

        Un numéro d'identification unique que vous pouvez définir pour cet envoi. Il doit être unique ou la demande sera rejetée.

        Les fournisseurs de compte de fournisseur doivent utiliser ce champ pour indiquer un numéro d'identification unique pour tout envoi associé à une demande de paiement préautorisé.

        Vous pouvez également utiliser ce numéro d'identification pour récupérer les détails relatifs à l'envoi, tels que l'étiquette, sans avoir à fournir d'information dans la réponse « Créer l'envoi ». Au lieu de cela, il suffit d'utiliser ce numéro d'identification dans les demandes Obtenir l'envoi.                
      type: string
      maxLength: 35
    customerNumber:
      type: string
      minLength: 7
      maxLength: 18
      example: '0007271592'
    workgroupID:
      type: string
      pattern: ^[0-9]{1,10}(-[0-9]{1,10})?$
      example: '0007271592'
    zonosAccountId:
      type: string
      minLength: 1
      maxLength: 30
      example: credential_live_9a97e2a3-7491-0326-4a9f-7e4a5297c2a5
    mailedByCustomer:
      allOf:
        - $ref: '#/components/schemas/customerNumber'
      description: |-
        Customer number of the mailedBy.

        ---

        Numéro de client de « Expédié au nom de ».
    mailed-on-behalf-of:
      allOf:
        - $ref: '#/components/schemas/customerNumber'
      description: |-
        Customer number of the mail owner.

        ---

        Numéro de client du propriétaire du courrier.
    paidByCustomer:
      allOf:
        - $ref: '#/components/schemas/customerNumber'
      description: |-
        The customer number of the customer who will be billed for the shipment. This is typically the same as the "mailed on behalf of" customer unless a Central Payer relationship has been identified to Canada Post. If it is not supplied, it defaults to mailed-on-behalf-of.

        ---

        Il s'agit du numéro du client qui recevra la facture pour l'envoi. Il correspond habituellement au même numéro de client « Expédié au nom de », à moins qu'une relation de payer central n'ait été signalée à Postes Canada. S'il n'est pas fourni, le numéro de client « Expédié au nom de » s'affiche par défaut.
    contractId:
      description: |-
        Contract Id numbers are 10 digits. If the number you provide has fewer than 10 digits, the system will add leading zeros to increase the length to 10.

        Required to identify contract discounts if the intended method of payment is Account.        

        ---

        Les numéros d'identification de convention comptent 10 chiffres. Si le numéro fourni est inférieur à 10 chiffres, le système ajoutera des zéros au début jusqu'à ce qu'il y ait 10 chiffres.

        Requis pour déterminer les rabais consentis par convention si le mode de paiement voulu est « Compte ».            
      type: string
      pattern: ^\d{1,10}$
    shipmentStatus:
      description: |-
        Valid values are

        - created
        - transmitted
        - suspended

        Indicates the current status of the shipment.

        ---

        Les valeurs valides sont les suivantes :

         - created 
         - transmitted
         - suspended 

        Indique l'état actuel de l'envoi.            
      type: string
      maxLength: 14
    trackingPin:
      description: |-
        This is the tracking PIN for the shipment. 

        ---

        Il s'agit du numéro d'identification du produit (NIP) pour l'envoi.
      type: string
      minLength: 11
      maxLength: 16
    returnTrackingPin:
      description: |-
        This is the tracking PIN for the return shipment.

        ---

        Il s'agit du numéro d'identification du produit (NIP) pour l'envoi de retour.
      allOf:
        - $ref: '#/components/schemas/trackingPin'
    poNumber:
      description: |-
        The Canada Post Purchase Order number; only applicable and returned on a shipment where no manifest is required for proof of payment.

        ---

        Il s'agit du numéro de bon de commande de Postes Canada. Il ne s'applique et n'est affiché que pour pour lequel un manifeste n'est pas requis à titre de preuve de paiement.            
      type: string
      pattern: ^[a-zA-Z0-9]{1,10}$
    poNumberManifest:
      allOf:
        - $ref: '#/components/schemas/poNumber'
      description: |-
        This is the PO number for the manifest, except for an empty manifest where it is always set to EMPTY.

        ---

        Il s'agit du numéro de bon de commande associé au manifeste, sauf dans le cas des manifestes vides, qui sont toujours réglés à « EMPTY ».
    shippingPointId:
      description: |-
        If you deposit your items at a Post Office or other Canada Post facility, provide the site number of the deposit location. Look up the site number using [Find a Deposit Location](https://www.canadapost-postescanada.ca/information/app/fdl/business/findDepositLocation). This information is used for pricing.

        You will also be asked to provide the shippingPointId in your Transmit Shipments request. Enter the same site number or pricing may be affected.

        Mutually exclusive with requestedShippingPoint but one of the two must be provided.

        **Note:** If you deposit your items yourself, we recommend using this field rather than the requestedShippingPoint field to indicate your deposit location.

        ---

        Si vous déposez vos articles à un bureau de poste ou à une autre installation de Postes Canada, fournissez le numéro d'emplacement de ce lieu de dépôt. Recherchez le numéro d'emplacement en question à l'aide de la fonction [Trouver un lieu de dépôt](https://www.canadapost-postescanada.ca/information/app/fdl/entreprise/trouverunlieudedepot). Cette information est utilisée pour la tarification.

        Vous devrez aussi fournir de nouveau le numéro d'identification du lieu d'expédition (shippingPointId) dans votre demande de service Transmettre les envois. Si vous n'entrez pas le même numéro d'emplacement, des ajustements tarifaires peuvent s'imposer.

        Option s'excluant mutuellement avec l'option requestedShippingPoint; cependant, l'une des deux doit être saisie.

        **Nota :** Si vous déposez vous-même vos envois, nous vous recommandons d'utiliser cet élément plutôt que le champ requestedShippingPoint pour indiquer votre lieu d'expédition.
      type: string
      maxLength: 4
    expectedMailingDate:
      description: |-
        **Note:** You can omit this field. It will be used in a future release.

        All shipments are priced as per the current shipment date and are re-priced at time of transmit if transmitted at a later date.

        ---

        **Nota :** Vous pouvez omettre ce champ. Il sera utilisé dans une version future.

        Le tarif de tous les envois est établi en fonction de la date d'expédition actuelle, puis il est rajusté au moment de la transmission (si l'envoi est transmis à une date ultérieure).
      type: string
      format: date
    groupId:
      description: |-
        This is the name of the group specified by your system in a prior Create Shipment call.

        Groups may be empty of shipments due to a prior Transmit Shipments call since they can persist for up to 24 hours while empty.

        **Performance limitations**

        To avoid a timeout of our servers, please follow these recommendations:

        - Do not include more than 30 groups per manifest (i.e., maximum of 30 group-ids in one Transmit Shipments request.)
        - Do not put more than 5,000 shipments in one group.

        **System limitations**

        To avoid an error, please do not exceed the following limits before performing a Transmit Shipments call:

        - Maximum of 50 groups per manifest (error 9109 if exceeded).
        - Maximum of 10,000 shipments in one group (error 9110 if exceeded).
        - Maximum of 10,000 shipments across multiple groups (error 9108 if exceeded).

        ---

        Il s'agit du nom du groupe précisé par le système dans une demande de service précédente pour créer l'envoi.

        Les groupes peuvent ne contenir aucun envoi en raison d'une demande de service précédente pour transmettre les envois puisqu'ils peuvent persister jusqu'à 24 heures lorsqu'ils sont vides.

        **Limites du rendement**  

        Afin d'éviter un délai de temporisation de nos serveurs, veuillez suivre ces recommandations :

        - Ne pas inclure plus de 30 groupes par manifeste (p. ex. un maximum de 30 group-ids dans une seule demande de service Transmettre les envois).
        - Ne pas placer plus de 5 000 envois dans un groupe.

        **Limites du système**  

        Pour éviter une erreur, veuillez ne pas dépasser les limites suivantes avant d'effectuer une demande de service Transmettre les envois :

        - Maximum de 50 groupes par manifeste (erreur 9109 si la limite est dépassée).
        - Maximum de 10 000 envois dans un groupe (erreur 9110 si la limite est dépassée).
        - Maximum de 10 000 envois dans l'ensemble de plusieurs groupes (erreur 9108 si la limite est dépassée).
      type: string
      minLength: 1
      maxLength: 32
    transmitShipment:
      description: |-
        This field identifies a shipment where no manifest is required for proof of payment.

        This shipment will be transmitted immediately and a subsequent Transmit Shipments call is not required.

        Use this field if you ship fewer than 50 parcels per day from multiple locations using one of these business models:

        - Consumer-to-consumer shipping (e.g. online auction websites)
        - Distributed order management
        - Third-party direct fulfillment

        When this field is set to true, you will be charged immediately once your Create Shipment request is complete. Your shipment cannot be voided.

        **Important:** If you use traditional contract shipping and manifest processes (e.g. you ship more than 50 parcels per day from a central warehouse), this process is not for you. You must continue to use the regular manifest process. Failure to do so will result in refusal of your shipment until you produce the required manifests.

        If you are a non-contract shipping customer who uses contract shipping web services, you must provide this field.

        ---

        Ce champ désigne un envoi pour lequel un manifeste n'est pas requis à titre de preuve de paiement.

        Cet envoi sera transmis immédiatement et une demande de service « Transmettre les envois » n'est pas requise.

        Utilisez ce champ si vous expédiez moins de 50 colis par jour à partir de différents endroits à l'aide de l'un des modèles opérationnels ci-dessous.

        -   Expédition de consommateur à consommateur (p. ex. sites Web de vente aux enchères en ligne)
        -   Gestion de la distribution des commandes
        -   Livraison directe par une tierce partie

        Lorsque ce champ est réglé à « Vrai », la facturation sera effectuée immédiatement après la présentation d'une demande de création d'un envoi. Votre envoi ne peut pas être annulé.

        **Important :** Si vous utilisez les procédés traditionnels liés à l'expédition avec convention et aux manifestes (p. ex. si vous expédiez plus de 50 colis par jour à partir d'un entrepôt central), ce procédé ne vous convient pas. Vous devez continuer à utiliser le procédé habituel lié aux manifestes. Le non-respect de cette consigne entraînera le refus de votre envoi jusqu'à ce que vous produisiez les manifestes requis.

        Si vous êtes un client des services d'expédition sans convention qui utilise des services Web d'expédition avec convention, vous devez fournir ce champ.             
      type: boolean
      enum:
        - true
    quickshipLabelRequested:
      description: |-
        Use this field if you already have a domestic parcel with the recipient's name and address on it, but you want to generate an additional label to affix to the parcel for tracking purposes.

        Set this field to true, and, for billing purposes, provide the country code (must be CA)  and the postal code, in the destination structure. A label that contains a tracking barcode and the words "Quick Ship – Refer to Address Label/Expédition rapide – Reportez-vous à l'étiquette d'adresse" will be generated.

        Only provide this parameter when you want a Quick Ship label (i.e. do not provide when false).

        ---

        Utilisez ce champ si vous avez déjà un colis du régime intérieur indiquant le nom et l'adresse du destinataire, mais que vous voulez créer une étiquette supplémentaire aux fins de suivi.

        Réglez ce champ à « true » et, à des fins de facturation, fournissez le code du pays (doit être CA) et le code postal dans la structure de destination. Une étiquette comprenant un code à barres de repérage et la mention « Quick Ship – Refer to Address Label/Expédition rapide – Reportez-vous à l'étiquette d'adresse » sera créée.

        Fournissez uniquement ce paramètre lorsque vous souhaitez créer une étiquette d'expédition rapide (ne fournissez pas ce paramètre lorsque l'élément est réglé à « false »).
      type: boolean
    cpcPickupIndicator:
      description: |-
        Set this field to true if your shipments are picked up by Canada Post or a third party. Provide the Postal Code of your pickup location in requestedShippingPoint.

        Omit this field if you deposit your shipments yourself.

        Mutually exclusive with shippingPointId.

        You must also set this field to true in your Transmit Shipments request.

        **Note:** In a future release it will become mandatory to explicitly identify whether your shipment is picked up by Canada Post  (by providing both this indicator and requestedShippingPoint) or deposited at a Canada Post site (by providing shippingPointId).

        We recommend preparing for this change by providing this indicator (and requestedShippingPoint) if your shipment is picked up by Canada Post.

        ---

        Réglez cet élément à « true » si vos envois sont ramassés par Postes Canada ou par une tierce partie. Fournissez le code postal de votre lieu de ramassage dans le champ requestedShippingPoint.

        Ne fournissez pas ce renseignement si vous déposez vous-même vos envois.

        Option s'excluant mutuellement avec le champ shippingPointId.

        Vous devez aussi régler ce champ à « true » dans votre demande Transmettre les envois.

        **Nota :** Dans une version future, il sera obligatoire d'indiquer explicitement si votre envoi est ramassé par Postes Canada (en fournissant à la fois cet indicateur et le champ requestedShippingPoint) ou déposé à un emplacement de Postes Canada (en fournissant le champ shippingPointId).

        Nous vous recommandons de vous préparer à ce changement en offrant cet indicateur (et le champ requestedShippingPoint) si votre envoi est ramassé par Postes Canada.
      type: boolean
      enum:
        - true
    requestedShippingPoint:
      description: |-
        Postal Code of the location where your shipments are picked up. The Postal Code you provide is used for pricing purposes.

        If you deposit your shipments yourself, you have 2 choices:

        - Omit this field and provide the site number of your deposit location in shippingPointId. (recommended), or

        - Provide the postal code of your deposit location here and omit shippingPointId.

        **Note:** Using requestedShippingPoint to indicate your deposit location postal code will be discontinued in a future release.  If you deposit your shipments yourself, we recommend using the shippingPointId field.

        Mandatory when cpcPickupIndicator is provided.

        Mutually exclusive with shippingPointId, but one of the two must be provided.

        You will be asked to provide the requestedShippingPoint again in your Transmit Shipments request. If you use a different Postal Code, it may result in a price adjustment depending on the difference in distance between the two locations.

        ---

        Il s'agit du code postal de l'emplacement où vos envois sont ramassés. Le code postal fourni est utilisé aux fins de tarification.

        Si vous déposez vous-même vos envois, vous avez deux choix :

        ne pas régler ce champ, et indiquer le numéro d'identification de l'emplacement d'expédition dans shippingPointId (option recommandée); fournir le code postal de votre lieu d'expédition ici et ne pas régler le champ shippingPointId. Nota : L'utilisation de le champ requestedShippingPoint pour indiquer le code postal de votre lieu d'expédition ne sera plus possible dans une version future. Si vous déposez vous-même vos envois, nous vous recommandons d'utiliser l'élément shippingPointId.

        Cet élément est obligatoire lorsque l'indicateur de ramassage de la SCP (cpcPickupIndicator) est fourni.

        Option s'excluant mutuellement avec le champ shippingPointId; cependant, l'une des deux doit être saisie.
      type: string
      pattern: ^[A-Z]\d[A-Z]\d[A-Z]\d$
    serviceCode:
      description: |-
        Must be a valid code representing the Canada Post delivery service used
        for shipping the item.  The most frequently used codes are listed below:

        Service-Code  | Description
        --------------|------------
        DOM.RP        | Regular Parcel
        DOM.EP        | Expedited Parcel
        DOM.XP        | Xpresspost
        DOM.PC        | Priority
        DOM.LIB       | Library Books
        USA.EP        | Expedited Parcel USA
        USA.SP.AIR    | Small Packet USA Air
        USA.TP        | Tracked Packet – USA
        USA.TP.LVM    | Tracked Packet – USA (LVM)<br>(large volume mailers)<br><br>Note: To use this option, it must be specified in your
        contract.
        USA.XP        | Xpresspost USA
        INT.XP        | Xpresspost International
        INT.IP.AIR    | International Parcel Air
        INT.IP.SURF   | International Parcel Surface
        INT.SP.AIR    | Small Packet International Air
        INT.SP.SURF   | Small Packet International Surface
        INT.TP        | Tracked Packet – International

        **Note:** These delivery services and their codes can be discovered by calling the Get Rates and Discover Services web services described in *Rating*.

        ---

        Doit être un code valide correspondant au service de livraison de Postes Canada utilisé pour expédier l'article. Les codes les plus fréquemment utilisés sont énumérés ci-dessous.

        Code de service | Description
        ----------------|------------
        DOM.RP          | Colis standard
        DOM.EP          | Colis accélérés
        DOM.XP          | Xpresspost
        DOM.PC          | Priorité
        DOM.LIB         | Livres de bibliothèque
        USA.EP          | Colis accélérés É.-U.
        USA.SP.AIR      | Petits paquets-avion à destination des É.-U.
        USA.TP          | Paquet repérable – É.-U.
        USA.TP.LVM      | Paquet repérable – É.-U. (GEC)<br>(gros expéditeur de courrier)<br><br>Nota : Cette option doit figurer dans votre convention pour pouvoir être utilisée.
        USA.XP          | Xpresspost É.-U.
        INT.XP          | Xpresspost – International
        INT.IP.AIR      | Colis-avion du régime international
        INT.IP.SURF     | Colis de surface du régime international
        INT.SP.AIR      | Petits paquets-avion du régime international
        INT.SP.SURF     | Petits paquets de surface du régime international
        INT.TP          | Paquet repérable – International

        **Nota :** Les services de livraison et leurs codes peuvent être obtenus en faisant appel aux services « Obtenir les tarifs » et « Découvrir les services » décrits dans la section *Tarification*.
      type: string
      minLength: 1
      maxLength: 32
    optionCode:
      description: |-
        This is the option code indicating an option that applies to this shipment.

        Valid option codes are as follows

        - SO - Signature
        - COV - Coverage
        - COD - Collect on delivery
        - PA18 - Proof of Age Required - 18
        - PA19 - Proof of Age Required - 19
        - HFP - Card for pickup
        - DNS - Do not safe drop
        - LAD - Leave at door - do not card
        - D2PO - Deliver to Post Office

        **Note:** The D2PO option indicates that the parcel will be delivered directly to a nearby Post Office. For the D2PO option, the following fieldss are required:

        - name (under destination)
        - clientVoiceNumber (under destination)
        - notification
        - optionQualifier2

        **Note:** If you select Collect on Delivery (COD), specify Card for Pickup (HFP) or Deliver to Post Office (D2PO). This is to facilitate the collection of COD funds at a post office. If not specified, the system will default to HFP.

        **Non-delivery handling codes**

        (required for some U.S.A. and international shipments)

        - RASE - Return at Sender's Expense
        - RTS - Return to Sender
        - ABAN - Abandon

        ---

        Requis si le champ parent correspondant « option » existe.

        Il s'agit du code d'option indiquant l'option qui s'applique à l'envoi.

        Les codes d'option valides sont les suivants :

        - SO – Signature
        - COV – Couverture
        - COD – Contre remboursement
        - PA18 – Preuve d'âge requise (18 ans)
        - PA19 – Preuve d'âge requise (19 ans)
        - HFP – Annoncer par carte
        - DNS – Ne pas laisser en lieu sûr
        - LAD – Laisser à la porte – Pas d'avis
        - D2PO – Livrer au bureau de poste

        **Nota :** L'option « D2PO » indique que le colis sera livré directement à un bureau de poste proche. Le champ suivants sont requis pour l'option « D2PO » :

        - name (sous destination)
        - clientVoiceNumber (sous destination)
        - notification
        - optionQualifier2

        **Remarque :** Si vous choisissez l'option de contre remboursement (COD), l'option Annoncer par carte (HFP) ou l'option Livrer au bureau de poste (D2PO). La perception de fonds pour des envois contre remboursement est ainsi facilitée au bureau de poste. Si aucune option n'est choisie, le système sélectionnera par défaut l'option HFP.

        **Codes de traitement pour la non-livraison**

        (requis pour certains envois à destination des É.-U. et du régime international)

        - RASE – Retourner aux frais de l'expéditeur
        - RTS – Renvoi à l'expéditeur
        - ABAN – Abandon            
      type: string
      minLength: 1
      maxLength: 10
    methodOfPayment:
      description: |-
        This indicates what the method of payment is for the manifests that are to be generated.

        Valid methods of payment are as follows:

        - CreditCard = the payment will be by credit card.
        - Account = the payment will be via an existing contract with the paid-by-customer.
        - SupplierAccount = the payment will be through the Supplier Account identified as default in the customer profile (only available to Supplier Account providers).

        **Note:** Different shipments may have different paid-by-customers. Separate manifests will be generated for shipments with different paid-by-customers.

        ---

        Cela désigne le mode de paiement utilisé pour les manifestes devant être générés.

        Les modes de paiement valides sont les suivants :

        - CreditCard = Le paiement sera effectué par carte de crédit.
        - Account = Le paiement se fera par l'intermédiaire d'une convention en vigueur qui aura été conclue avec le payeur.
        - SupplierAccount = le paiement se fera par l'intermédiaire du compte de fournisseur désigné comme valeur par défaut dans le profil du client (offert uniquement aux fournisseurs de comptes de fournisseur).

        **Nota :** Différents payeurs pourraient être associés à différents envois. Des manifestes distincts seront générés pour les envois dont les payeurs sont différents.            
      type: string
      maxLength: 15
    baseAmount:
      description: |-
        This is the base amount cost for shipping in $CAD.

        ---

        Il s'agit du coût de base pour l'expédition en dollars canadiens.
      type: number
      exclusiveMinimum: true
      minimum: 0
      maximum: 999999.99
      multipleOf: 0.01
    costNonZero:
      type: number
      exclusiveMinimum: true
      minimum: 0
      maximum: 999999.99
      multipleOf: 0.01
    costAllowsZero:
      type: number
      minimum: 0
      maximum: 999999.99
      multipleOf: 0.01
    costAllowsNegative:
      type: number
      minimum: -999999.99
      maximum: 999999.99
      multipleOf: 0.01
    phoneNumber:
      type: string
      description: |-
        Phone number to be printed on the manifest.        

        ---

        Numéro de téléphone devant être imprimé sur le manifeste            
      maxLength: 25
    returnRecipient:
      type: object
      description: |-
        The returnRecipient structure provides the shipping details (e.g. address) for the return delivery as it shows on the return label.

        ---

        La structure de l'élément « returnRecipient » fournit les détails d'expédition (p. ex. adresse) pour la livraison d'un envoi retourné, tels qu'ils figurent sur l'étiquette du Service de retour.
      properties:
        name:
          $ref: '#/components/schemas/name'
        company:
          $ref: '#/components/schemas/company'
        addressDetails:
          $ref: '#/components/schemas/addressDomestic'
    returnNotification:
      description: |-
        The email address that an on-delivery notification will be sent to when the return shipment is delivered.

        ---

        Il s'agit de l'adresse électronique à laquelle un avis de livraison sera envoyé lorsque les envois retournés seront livrés.
      type: string
      pattern: ^(['_A-Za-z0-9\-+]+)(\.['_A-Za-z0-9\-+]+)*@([A-Za-z0-9-]+)(\.[A-Za-z0-9-]+)*(\.[A-Za-z]{2,})$
      maxLength: 60
    dimensionMeasurement:
      type: number
      exclusiveMinimum: true
      minimum: 0
      maximum: 999.9
      multipleOf: 0.1
    parcelCharacteristics:
      description: |-
        Describes the characteristics of the parcel.

        ---

        Décrit les caractéristiques du colis.
      type: object
      properties:
        weight:
          description: |-
            Total package weight in kg.

            ---

            Poids total du colis en kilogrammes.
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
        dimensions:
          description: |-
            Contains the physical dimensions of the parcel, which can be used to make a more accurate determination of shipping cost.
            ---
            Contient les dimensions physiques du colis qui peuvent être utilisées pour déterminer les frais d'expédition de façon plus précise.
          type: object
          properties:
            length:
              description: |-
                Length of parcel in cm.

                ---

                Longueur du colis en centimètres.
              $ref: '#/components/schemas/dimensionMeasurement'
            width:
              description: |-
                Width of parcel in cm.

                ---

                Largeur du colis en centimètres.
              $ref: '#/components/schemas/dimensionMeasurement'
            height:
              description: |-
                Height of parcel in cm.

                ---

                Hauteur du colis en centimètres.
              $ref: '#/components/schemas/dimensionMeasurement'
          required:
            - length
            - width
            - height
        unpackaged:
          description: |-
            Indicates whether a shipment is unpackaged or not. For example, auto tires may be an example of an unpackaged shipment.

            ---

            Indique si un envoi est emballé ou non. Par exemple, les pneus d'une voiture peuvent constituer un envoi non emballé.
          type: boolean
        mailingTube:
          description: |-
            Indicates whether a shipment is contained in a mailing tube. e.g. a poster tube
            ---
            Indique si un envoi est inséré dans un tube d'expédition (p. ex. tube contenant une affiche).
          type: boolean
        oversized:
          description: |-
            Indicates whether the parcel is oversized or not.

            **Note:** If parcel dimensions have been provided, then this field will be automatically determined (as either true or false) based on the parcel dimensions (regardless of whether you include a value for the "oversized" field). However, if no dimensions are provided, then you can specify that a parcel is oversized (or not) using this field.

            ---

            Indique si le colis est surdimensionné ou non.

            Nota : Si les dimensions du colis ont été fournies, ce champ sera donc automatiquement défini (comme étant vrai ou faux) en fonction de ces dimensions (peu importe si vous ajoutez une valeur dans le champ « oversized »). Toutefois, si aucune dimension n'est fournie, vous pouvez préciser que le colis est surdimensionné (ou non) à l'aide de ce champ.
          type: boolean
      required:
        - weight
    name:
      description: |-
        Contact name.

        ---

        Nom du contact.
      type: string
      maxLength: 44
    company:
      description: |-
        Company name.

        ---

        Nom de l'entrepris.
      type: string
      maxLength: 44
    additionalAddressInfo:
      description: |-
        Additional address information for the destination.

        This information is printed directly above address line 1 on the shipping label.

        ---

        Données d'adressage supplémentaires pour la destination.

        Ces renseignements sont imprimés directement au-dessus de la ligne d'adresse 1 sur l'étiquette d'expédition.
      type: string
      maxLength: 44
    contactPhone:
      description: |-
        Contact phone number.

        ---

        Numéro de téléphone du contact.
      type: string
      maxLength: 25
    clientVoiceNumber:
      description: |-
        Phone number at the destination. Not required for domestic shipments unless the Deliver to Post Office option has been selected.

        **Note:** In addition to numbers, the following characters are also accepted in this field:

        - A plus sign (+), but only as the first character in the string.
        - Period (.), hyphen (-), open and close brackets, space, and x or p to indicate an extension.

        ---

        Numéro de téléphone du destinataire. Il n'est pas requis pour les envois du régime intérieur, sauf si l'option « Livrer au bureau de poste » a été sélectionnée.

        **Remarque :** En plus des chiffres, les caractères suivants sont acceptés dans ce champ :

        - Un symbole d'addition (+), mais seulement tout au début de la chaîne de caractères.
        - Un point (.), un tiret (-), des parenthèses ou une espace suivie d'un « x » ou d'un « p » pour indiquer un numéro de poste.
      type: string
      maxLength: 25
    addressLine1:
      description: |-
        Address line 1.

        ---

        Ligne d'adresse 1.
      type: string
      minLength: 1
      maxLength: 44
    addressLine2:
      description: |-
        Address line 2.

        ---

        Ligne d'adresse 2.                           
      type: string
      maxLength: 44
    city:
      description: |-
        City.

        ---

        Ville.
      type: string
      minLength: 1
      maxLength: 40
    provStateDomestic:
      type: string
      description: |-
        Standard Canadian province code.            

        ---

        Code de province standard pour les provinces au Canada.
      minLength: 2
      maxLength: 2
    provState:
      description: |-
        Province or state.            

        ---

        Province ou État.
      type: string
      minLength: 1
      maxLength: 20
    countryCode:
      description: |-
        Country code for the manifest address; CA and US are accepted.

        Required if US. Optional if CA.

        ---

        Code de pays pour l'adresse du manifeste; CA et US sont acceptés.

        Obligatoire si US. Facultatif si CA.
      type: string
      pattern: ^[a-zA-Z][a-zA-Z]$
    postalZipCodeDomestic:
      type: string
      description: |-
        Canadian Postal Code.

        ---

        Code postal canadien.
      pattern: ^[A-Z]\d[A-Z]\d[A-Z]\d$
    postalZipCodeDomesticUs:
      type: string
      description: |-
        Postal Code or zip code:

        - 6-character alphanumeric for Canada (A9A9A9).

        - 5-digit or 5-4 digit numeric code for US.

        ---

        Code postal ou ZIP:

        - Six caractères alphanumériques pour le Canada [A9A9A9].

        - Code numérique à cinq chiffres ou à neuf chiffres [cinq chiffres suivis de quatre autres chiffres] pour les États-Unis.
      anyOf:
        - pattern: ^[A-Z]\d[A-Z]\d[A-Z]\d$
        - pattern: ^\d{5}(-\d{4})?$
    postalZipCodeAll:
      type: string
      description: |-
        Postal Code or zip code:

        - 6-character alphanumeric for Canada (A9A9A9).
        - 5-digit or 5-4 digit numeric code for US.
        - Up to 14 characters (free format) for other countries.

        ---

        Code postal ou ZIP:

        - Six caractères alphanumériques pour le Canada [A9A9A9].
        - Code numérique à cinq chiffres ou à neuf chiffres [cinq chiffres suivis de quatre autres chiffres] pour les États-Unis.
        - Jusqu'à 14 caractères (tout format) pour les autres pays.
      anyOf:
        - pattern: ^[A-Z]\d[A-Z]\d[A-Z]\d$
        - pattern: ^\d{5}(-\d{4})?$
        - pattern: ^.{1,14}$
      minLength: 1
      maxLength: 14
    addressDomestic:
      type: object
      description: |-
        Domestic address data.

        Blank address fields will be removed for formatting the labels.   

        ---

        Données d'adresses du régime intérieur.

        Les champs d'adresse vides seront retirés pendant le formatage des étiquettes.         
      properties:
        addressLine1:
          $ref: '#/components/schemas/addressLine1'
        addressLine2:
          $ref: '#/components/schemas/addressLine2'
        city:
          $ref: '#/components/schemas/city'
        provState:
          $ref: '#/components/schemas/provStateDomestic'
        postalZipCode:
          $ref: '#/components/schemas/postalZipCodeDomestic'
      required:
        - addressLine1
        - city
        - provState
        - postalZipCode
    manifestAddress:
      description: |-
        This structure contains the address that is printed on the manifest label.

        ---

        Cette structure contient l'adresse imprimée sur l'étiquette du manifeste.
      type: object
      properties:
        manifestCompany:
          description: |-
            The company name of the manifest address.

            This is printed on the manifest document.

            ---

            Nom de l'entreprise figurant dans l'adresse du manifeste.

            Le nom est imprimé sur le manifeste.
          type: string
          minLength: 1
          maxLength: 44
        manifestName:
          description: |-
            Contact name for the manifest address.

            This is printed on the manifest document.

            ---

            Nom de la personne-ressource figurant dans l'adresse du manifeste

            Le nom est imprimé sur le manifeste.
          type: string
          minLength: 1
          maxLength: 44
        phoneNumber:
          $ref: '#/components/schemas/phoneNumber'
        addressDetails:
          description: |-
            This structure contains the address that is printed on the manifest label.

            ---

            Cette structure contient l'adresse imprimée sur l'étiquette du manifeste.
          type: object
          properties:
            addressLine1:
              $ref: '#/components/schemas/addressLine1'
            addressLine2:
              $ref: '#/components/schemas/addressLine2'
            city:
              $ref: '#/components/schemas/city'
            provState:
              $ref: '#/components/schemas/provState'
            countryCode:
              $ref: '#/components/schemas/countryCode'
            postalZipCode:
              $ref: '#/components/schemas/postalZipCodeDomesticUs'
          required:
            - addressLine1
            - city
            - provState
            - postalZipCode
      required:
        - manifestCompany
        - phoneNumber
        - addressDetails
    addressDestination:
      description: |-
        Contains the address data the destination of the shipment.

        Blank fields will be removed for formatting the labels.

        ---

        Contient les données d'adressage liées à la destination de l'envoi.

        Les champs vides seront retirés pendant le formatage des étiquettes.
      type: object
      properties:
        addressLine1:
          allOf:
            - $ref: '#/components/schemas/addressLine1'
          description: |-
            Address at the destination.

            Not required when quickshipLabelRequested is true; mandatory
            otherwise.

            ---

            Adresse de l'expéditeur.

            N'est pas requis lorsque quickshipLabelRequested est réglé à « true »; obligatoire sinon.               
        addressLine2:
          $ref: '#/components/schemas/addressLine2'
        city:
          allOf:
            - $ref: '#/components/schemas/city'
          description: |-
            Destination city.

            Optional for international shipments. Required for domestic and
            U.S.A. shipments.

            Not required when quickshipLabelRequested is true.            

            ---

            Ville de destination.

            Optionnel pour les envois du régime international. Requis pour
            les envois à destination des États-Unis et du régime intérieur.

            N'est pas requis lorsque quickshipLabelRequested est réglé à «
            true ».
        provState:
          allOf:
            - $ref: '#/components/schemas/provState'
          description: |-
            Province or state.

            - Standard province code for provinces within Canada.
            - Standard state code for U.S. states.
            - Free form for states and provinces of other countries.

            Optional for international shipments. Required for domestic and U.S.A. shipments (except when quickshipLabelRequested is true).

            ---

            Province ou État.

            Il faut utiliser l'un des codes suivants :  

            - Code de province standard pour les provinces au Canada.
            - Code d'état standard pour les États américains.
            - Format non structuré pour les États et les provinces des autres pays.

            Optionnel pour les envois du régime international. Requis pour les envois à destination des États-Unis et du régime intérieur. (Sauf lorsque quickshipLabelRequested est réglé à « true ».)
        countryCode:
          $ref: '#/components/schemas/countryCode'
        postalZipCode:
          $ref: '#/components/schemas/postalZipCodeAll'
      required:
        - countryCode
    sender:
      description: |-
        This structure contains data about the sender that will appear in the "From" address of the label.  Blank fields will be removed for address formatting.

        ---

        Cette structure contient des données sur l'expéditeur correspondant à l'adresse de l'expéditeur figurant sur l'étiquette. Les champs vides seront retirés pendant le formatage des adresses.                 
      type: object
      properties:
        name:
          $ref: '#/components/schemas/name'
        company:
          $ref: '#/components/schemas/company'
        contactPhone:
          $ref: '#/components/schemas/contactPhone'
        addressDetails:
          allOf:
            - $ref: '#/components/schemas/addressDomestic'
            - type: object
              properties:
                countryCode:
                  allOf:
                    - $ref: '#/components/schemas/countryCode'
                    - description: |-
                        Country code of sender. Must be CA.

                        ---

                        Code de pays de l'expéditeur. Doit être CA.
                      enum:
                        - CA
              required:
                - countryCode
      required:
        - company
        - contactPhone
        - addressDetails
    destination:
      description: |-
        This field should always contain the address of the mail recipient, even if you are using the Deliver to Post Office option.

        - For regular shipments, this data will appear in the "To" address of the label.
        - For Deliver to Post Office shipments, the system will substitute the Post Office address on the label.
        - For Quick Ship shipments (quickshipLabelRequested = true), this is only used for rating purposes and only the destination countryCode (CA) and postalCode fields must be provided.

        Blank fields will be removed in the address formatting.

        When shipping outside of Canada, at least one of name or company is required to comply with international customs regulations.

        ---

        Ce champ doit toujours contenir l'adresse du destinataire du courrier, et ce, même si vous utilisez l'option « Livrer au bureau de poste ».

        - Pour les envois réguliers, ces données s'afficheront dans l'adresse de destination figurant sur l'étiquette.
        - Pour les envois assortis de l'option « Livrer au bureau de poste », le système remplacera l'adresse du bureau de poste sur l'étiquette.
        - Pour les envois d'expédition rapide (quickshipLabelRequested = true), le champ est seulement utilisé aux fins de tarification, et seuls les champs de destination countryCode (CA) et postalCode doivent être fournis.

        Les champs vides seront retirés pendant le formatage des adresses.

        Si l'expédition se fait à l'extérieur du Canada, au moins un des champs « name » ou « company » est requis pour respecter les règlements douaniers internationaux.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/name'
        company:
          $ref: '#/components/schemas/company'
        additionalAddressInfo:
          $ref: '#/components/schemas/additionalAddressInfo'
        clientVoiceNumber:
          $ref: '#/components/schemas/clientVoiceNumber'
        addressDetails:
          $ref: '#/components/schemas/addressDestination'
      required:
        - addressDetails
      anyOf:
        - properties:
            addressDetails:
              properties:
                countryCode:
                  pattern: ^[Cc][Aa]$
          anyOf:
            - required:
                - name
            - required:
                - company
        - not:
            properties:
              addressDetails:
                properties:
                  countryCode:
                    pattern: ^[Cc][Aa]$
    options:
      description: |-
        Contains options for the delivery service code such as insurance, COD, etc.

        ---

        Contient les options liées au code du service de livraison (p. ex. couverture, CR).
      type: array
      items:
        description: |-
          A selection of a shipping option (e.g. COD, insurance, etc.)

          ---

          Sélection d'une option d'expédition (p. ex. CR, couverture).
        type: object
        properties:
          optionCode:
            $ref: '#/components/schemas/optionCode'
          optionAmount:
            allOf:
              - $ref: '#/components/schemas/costNonZero'
            description: |-
              Required depending on the value of optionCode.


              e.g., For COV option, this is the amount of insurance coverage to be purchased.


              For COD option, this is the base amount to collect on delivery (shipping costs may also be added by the system as described below in optionQualifier1).


              On U.S. and international shipments, do not provide if you want the system to calculate the maximum allowable coverage (see optionQualifier1 below).

              ---

              Requis selon la valeur du code d'option.

              Exemple : Pour l'option « COV », il s'agit du montant de la couverture à acheter.

              Pour l'option « COD », il s'agit du montant de base pour les envois contre remboursement (les frais d'expédition peuvent aussi être ajoutés par le système, tel qu'il est décrit ci-dessous pour le champ « optionQualifier1 »).

              Ne pas fournir dans le cas des envois à destination des États-Unis ou du régime international si vous voulez que le système calcule la couverture maximale permise (voir le champ optionQualifier1 ci-dessous).
          optionQualifier1:
            description: |-
              Can be used to provide a qualifier for the COD or COV options.

              To indicate if the COD amount is to include the shipping cost or not:

              - true = Shipping costs will be added to the COD amount you provided in option amount.

              - false = The COD amount to collect is specified in option amount (i.e. Shipping costs are not to be added).

              To use with the COV option on U.S. and international shipments to indicate that the system can apply the maximum allowable coverage amount, which would equal the total value of your goods, up to the allowable maximum for product and country:

              - true = Use maximum allowable coverage; when used, there is no need to provide option amount.

              - false (the default) = Use the amount of coverage as provided in option amount.


              False is the default if the qualifier is not provided.

              ---

              Peut être utilisé pour fournir un qualificatif pour les options CR ou COV.

              Pour indiquer si le montant du paiement CR comprend les frais d'expédition ou non :

              - Vrai = Les frais d'expédition seront ajoutés au montant CR que vous avez indiqué dans l'option.

              - Faux = Le montant CR à percevoir est indiqué dans l'option (c.-à-d. que les frais d'expédition ne seront pas ajoutés).

              À utiliser avec l'option COV pour les envois à destination des États-Unis ou du régime international pour indiquer que le système peut appliquer le montant de la couverture maximale permise, qui devrait correspondre à la valeur totale de vos articles, jusqu'à la limite maximale permise pour le produit et le pays en question :

                - Vrai = Utiliser la couverture maximale permise; lorsqu'elle est utilisée, il n'est pas nécessaire de fournir le montant de l'option.

                - Faux (par défaut) = Utiliser le montant de couverture indiqué dans le montant de l'option.

              Si le qualificatif n'est pas fourni, le champ « Faux » est sélectionné par défaut.
            type: boolean
          optionQualifier2:
            description: |-
              Required if option code requires a 2nd qualifier.

              Currently, the options requiring a 2nd qualifier are:

              - **Deliver to Post Office**

                For the Deliver to Post Office option, this field must contain the office id of the destination Post Office.

              ---

              Requis si le code d'option nécessite un second qualificateur.

              À l'heure actuelle, les options nécessitant un deuxième qualificatif sont les suivants :

              - **Livrer au bureau de poste**

                Pour l'option « Livrer au bureau de poste », ce champ doit contenir le numéro d'identification du bureau de poste de destination.
            type: string
            maxLength: 12
        required:
          - optionCode
      minItems: 1
      maxItems: 20
    deliverySpec:
      description: |-
        Provides a description of the delivery request details, including recipient, service code, sender, options, item specification, notification info and reference ids.

        ---

        Fournit une description des détails de la demande de livraison, y compris le destinataire, le code de service, l'expéditeur, les options, les spécifications de l'envoi, les renseignements liés à l'avis et les numéros d'identification de référence.
      type: object
      properties:
        serviceCode:
          $ref: '#/components/schemas/serviceCode'
        sender:
          $ref: '#/components/schemas/sender'
        destination:
          $ref: '#/components/schemas/destination'
        options:
          $ref: '#/components/schemas/options'
        parcelCharacteristics:
          $ref: '#/components/schemas/parcelCharacteristics'
        notification:
          $ref: '#/components/schemas/notification'
        printPreferences:
          $ref: '#/components/schemas/printPreferences'
        preferences:
          $ref: '#/components/schemas/preferences'
        references:
          $ref: '#/components/schemas/references'
        customs:
          $ref: '#/components/schemas/customs'
        settlementInfo:
          $ref: '#/components/schemas/settlementInfo'
      required:
        - serviceCode
        - sender
        - destination
        - parcelCharacteristics
        - preferences
        - settlementInfo
    returnSpec:
      description: |-
        Contains the return delivery request details, including return
        recipient, label count, service code and reference ids.  If this
        field is absent, no return shipping label is required.

        ---

        Contient les détails liés à la demande de livraison d'un envoi
        retourné, y compris le destinataire de l'envoi retourné, le
        nombre d'étiquettes, le code du service et les numéros
        d'identification de référence. Si ce champ est absent, aucune
        étiquette d'expédition du Service de retour n'est requise
      type: object
      properties:
        serviceCode:
          allOf:
            - $ref: '#/components/schemas/serviceCode'
          description: |-
            Must be a valid code representing the Canada Post delivery service used for shipping the item. The most frequently used codes are listed below.

             Service-Code | Description
            --------------|------------------
             DOM.RP       | Regular Parcel
             DOM.EP       | Expedited Parcel
             DOM.XP       | Xpresspost
             DOM.PC       | Priority
             DOM.LIB      | Library Books

            Note - These delivery services and their codes can be discovered by calling the Get Rates and Discover Services web services described in Rating.

            ---

            Doit être un code valide correspondant au service de livraison de Postes Canada utilisé pour expédier l'article. Les codes les plus fréquemment utilisés sont énumérés ci-dessous.

            Code de service | Description
            --------------- | -----------
            DOM.RP          | Colis standard
            DOM.EP          | Colis accélérés
            DOM.XP          | Xpresspost
            DOM.PC          | Priorité
            DOM.LIB         | Livres de bibliothèque

            Nota : Les services de livraison et leurs codes peuvent être obtenus en faisant appel aux services « Obtenir les tarifs » et « Découvrir les services » décrits dans la section Tarification.
        returnRecipient:
          $ref: '#/components/schemas/returnRecipient'
        returnNotification:
          $ref: '#/components/schemas/returnNotification'
      required:
        - serviceCode
        - returnRecipient
    email:
      type: string
      description: |-
        Email address to receive automatic tracking updates.

        ---

        Adresse électronique pour recevoir des mises à jour de suivi automatiques.
      pattern: ^(['_A-Za-z0-9\-+]+)(\.['_A-Za-z0-9\-+]+)*@([A-Za-z0-9-]+)(\.[A-Za-z0-9-]+)*(\.[A-Za-z]{2,})$
      maxLength: 60
    notification:
      description: |-
        Contains client preferences with respect to email notification for tracking events e.g. delivery.

        This field is required if the Deliver to Post Office (D2PO) option has been selected.  For Deliver to Post Office, the email indicated within notification will be used to notify the customer that their parcel is ready for pickup.

        ---

        Contient les préférences des clients quant à la fonction d'avis électronique pour les activités de suivi (p. ex. livraison).

        Ce champ est requis si l'option « Livrer au bureau de poste » (D2PO) a été sélectionnée. Pour la livraison au bureau de poste, le courriel désigné dans le champ « notification » sera utilisé pour aviser le client qu'il peut ramasser son colis.
      type: object
      properties:
        email:
          $ref: '#/components/schemas/email'
        onShipment:
          description: |-
            Indicates whether you wish to receive an email notification upon shipment of the parcel.

            ---

            Indique si vous souhaitez recevoir un avis électronique concernant l'expédition d'un envoi.
          type: boolean
        onException:
          description: |-
            Indicates whether you wish to receive an email notification on exceptions.
            ---
            Indique si vous souhaitez recevoir un avis électronique concernant l'expédition d'un envoi.
          type: boolean
        onDelivery:
          description: |-
            Indicates whether you wish to receive an email notification upon delivery of the parcel.

            ---

            Indique si vous souhaitez recevoir un avis électronique concernant l'expédition d'un envoi.
          type: boolean
      required:
        - email
        - onShipment
        - onException
        - onDelivery
    printPreferences:
      description: |-
        Contains print preferences for the labels.

        ---

        Contient les préférences d'impression pour les étiquettes.
      type: object
      properties:
        outputFormat:
          description: |-
            8.5x11 indicates paper and 4x6 indicates thermal.

            ---

            Le format du papier ordinaire est de 8 ½ po sur 11 po alors que celui du papier thermosensible est de 4 po sur 6 po.
          type: string
          enum:
            - 8.5x11
            - 4x6
        encoding:
          description: |-
            Use this field to specify the output format for your shipping label: PDF or ZPL II. If not provided, PDF will be selected by default.

            If you choose ZPL, the response from a Get Artifact call will include a file containing ZPL II printer commands. You will then need to either code a solution or use an application to stream the commands directly to a thermal printer.

            For ZPL II labels, your printer must support truncation. Use our sample code to test your printer's ability to truncate text.

            ZPL is only available on thermal paper so "output-format" must be 4x6.

            ---

            Servez-vous de ce champ pour préciser le format de sortie pour votre étiquette d'expédition : PDF ou ZPL II. Si le champ est vide, le format PDF sera sélectionné par défaut.

            Si vous choisissez le format ZPL, la réponse du service « Obtenir l'artefact » inclura un fichier contenant des commandes d'impression ZPL II. Vous devrez ensuite coder une solution ou utiliser une application afin d'envoyer les commandes directement à une imprimante thermique.

            Pour les étiquettes de format ZPL II, votre imprimante doit permettre la troncature. Utilisez notre exemple de code pour tester la capacité de votre imprimante à tronquer du texte.

            Le format ZPL est uniquement disponible sur du papier thermosensible, alors l'élément « output-format » doit être de 4 po sur 6 po.
          type: string
          enum:
            - PDF
            - ZPL
    preferences:
      description: |-
        Contains a number of preferences with respect to printing labels, etc.

        ---

        Contient un certain nombre de préférences en ce qui a trait à l'impression des étiquettes, etc.
      type: object
      properties:
        showPackingInstructions:
          description: |-
            Indicates whether packing instructions are to be rendered on the label.

            ---

            Indique si les directives d'emballage doivent être inscrites sur l'étiquette.
          type: boolean
        showPostageRate:
          description: |-
            Indicates whether the postal rate is to be shown on the label.

            This field is required only for U.S.A. and international shipments.

            ---

            Indique si le tarif postal doit être inscrit sur l'étiquette.

            Ce champ est seulement requis pour les envois à destination des États-Unis et du régime international.
          type: boolean
        showInsuredValue:
          description: |-
            Indicates whether the insured value is to be shown on the label.

            This field is required only for insured U.S.A. and international shipments.

            ---

            Indique si la valeur assurée doit être inscrite sur l'étiquette.

            Ce champ est seulement requis pour les envois assurés à destination des États-Unis et du régime international.
          type: boolean
      required:
        - showPackingInstructions
    references:
      description: |-
        Contains reference fields that you assign. You can assign these alternate (possibly unique) identification numbers to the shipment for any purpose useful to you.

        ---

        Contient des champs de référence que vous pouvez attribuer. Vous pouvez attribuer ces autres numéros d'identification (pouvant être uniques) à l'envoi pour une raison quelconque utile pour vous.
      type: object
      properties:
        costCentre:
          type: string
          description: |-
            This is a value you assign for use by your applications. The value you enter here will appear on your invoice and in the PosteCS secure email that we use to send your invoice.        

            ---

            Il s'agit d'une valeur que vous pouvez attribuer pour vos applications. La valeur que vous saisissez ici apparaîtra sur votre facture et dans le courriel sécurisé PosteCS que nous utilisons pour envoyer votre facture.            
          maxLength: 30
        customerRef1:
          description: |-
            This is a user-defined value available for use by your applications. (e.g. you could use this field as an internal "order id"). The value you enter here will appear on the shipping label, in Track and – for customers who subscribe to our Automated Parcel Tracking service – in your APT file.

            ---

            Il s'agit d'une valeur définie par l'utilisateur disponible pour vos applications (p. ex. vous pourriez utiliser ce champ pour le numéro d'identification d'une commande interne). La valeur que vous saisissez ici apparaîtra sur l'étiquette d'expédition, dans l'outil Repérer et, pour les clients qui sont inscrits à notre service de suivi automatisé des colis, dans votre fichier SAC.
          type: string
          maxLength: 35
        customerRef2:
          description: |-
            This is a user-defined value available for use by your applications. The value you enter here will appear on the shipping label, in Track and – for customers who subscribe to our Automated Parcel Tracking service – in your APT file.

            ---

            Il s'agit d'une valeur définie par l'utilisateur disponible pour vos applications. La valeur que vous saisissez ici apparaîtra sur l'étiquette d'expédition, dans l'outil Repérer et, pour les clients qui sont inscrits à notre service de suivi automatisé des colis, dans votre fichier SAC
          type: string
          maxLength: 35
    customs:
      description: |-
        Contains information to be printed on the label to facilitate passing through customs at international borders.

        ---

        Contient des renseignements qui doivent être imprimés sur l'étiquette pour faciliter le dédouanement transfrontalier.
      type: object
      properties:
        usdeclarationid:
          description: |-
            A declaration ID is required when shipping items to the US if a Zonos account key is not included in the header. Please provide your Zonos declaration id here when it is being generated directly from their APIs. Each declaration ID is unique to a single shipment.

            ---

            Un ID de déclaration est requis lors de l’expédition d’articles vers  les États-Unis si une clé de compte Zonos n’est pas incluse dans  l’en-tête. Veuillez saisir votre ID de déclaration Zonos ici lorsqu’il  est généré directement à partir de leurs API. Chaque envoi doit avoir  son propre ID de déclaration.
          type: string
          minLength: 1
          maxLength: 30
        currency:
          description: |-
            This is the currency of the receiving country. The currency code is converted to uppercase, if not already. Value must be:

            - CAD for Canadian currency
            - USD for U.S. currency
            - Other valid ISO currency code

            Required if the corresponding parent field "customs" exists.

            ---

            Il s'agit de la devise du pays de destination. Le code de devise est converti en majuscules, s'il ne l'est pas déjà. La valeur doit être :

            - « CAD » pour une devise canadienne;
            - « USD » pour une devise américaine;
            - Autre code de devise ISO valide

            Requis si le champ parent correspondant « customs » existe.
          type: string
          minLength: 1
          maxLength: 3
        conversionFromCad:
          description: |-
            The conversion rate from the Canadian dollar to the currency you entered in the currency field above;  for example, if you used USD as the target currency and $1.00 CAD = $0.85 USD, the conversion rate is 0.85.

            Required if the corresponding parent field "customs" exists and the currency is not CAD.

            ---

            Le taux de conversion du dollar canadien à la devise que vous avez entrée dans le champ de devise ci-dessus; par exemple, si vous entré les dollars américains comme devise cible et que 1,00 $ CAD = 0,85 $ US, le taux de conversion est de 0,85.

            Requis si le champ parent correspondant « customs » existe et si la devise n'est pas canadienne.
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999.999999
          pattern: ^\d{1,4}(?:\.\d{1,6})?$
        reasonForExport:
          description: |-
            A code that represents the reason for export, which assists
            with border crossing.

            The codes and their meanings are as follows:

            - DOC = document
            - SAM = commercial sample
            - REP = repair or warranty
            - SOG = sale of goods
            - OTH = other

            Required if the corresponding parent field "customs"
            exists.

            ---

            Code représentant la raison de l'exportation, lequel facilite le passage transfrontalier.

            Voici les codes et leurs significations :

            - DOC = Document  
            - SAM = Échantillon commercial  
            - REP = Réparation ou garantie  
            - SOG = Vente de biens  
            - OTH = Autre

            Requis si le champ parent correspondant « customs » existe.
          type: string
          minLength: 3
          maxLength: 3
        otherReason:
          description: |-
            Contains the reason for export.

            Required if the field reasonForExport is "other".

            ---

            Requis si le champ « reasonForExport » est « Autre ».
          type: string
          minLength: 4
          maxLength: 44
        skuList:
          description: |-
            Contains the list of unique types of items that are contained within this shipment,  as well as information about them. Each item type may have a quantity of 1 or more.  This information is printed on the manifest label to assist with processing of the parcel at customs.

            ---

            Contient la liste de types d'articles uniques inclus dans cet envoi ainsi que les renseignements connexes. Une quantité de un ou plus peut être associée à chaque type d'article. Ces renseignements sont imprimés sur l'étiquette du manifeste pour faciliter le traitement du colis aux douanes.
          type: array
          items:
            description: |-
              Contains the information about the item type (number of units, value per unit, etc.) that are contained in this shipment.

              ---

              Contient les renseignements sur le type d'article (nombre d'unités, valeur par unité, etc.) que comprend l'envoi.
            type: object
            properties:
              customsNumberOfUnits:
                description: |-
                  The number of units in the parcel.

                  ---

                  Nombre d'unités dans le colis. 
                type: integer
                minimum: 1
                maximum: 9999
              customsDescription:
                description: |-
                  A customs description of the item.

                  ---

                  Description pour douanes de l'article.
                type: string
                minLength: 1
                maxLength: 45
              sku:
                description: |-
                  A customs sku number or sku name for the item.

                  **Note:** Only permits up to 15 characters. The length limitations are necessary to comply with international customs regulations.

                  ---

                  Nom ou numéro de l'article aux fins de dédouanement.

                  **Nota :** Permet un maximum de 15 caractères. Les limites de longueur sont nécessaires à des fins de conformité aux règlements douaniers internationaux.                        
                type: string
                maxLength: 15
              hsTariffCode:
                description: |-
                  (Numeric field of the general form 9999.99.99.99)

                  The tariff code for the item.

                  ---

                  (Champ numérique de format général 9999.99.99.99)

                  Code de tarification de l'article.
                type: string
                pattern: ^\d{4}(\.\d{2}(\.\d{2}(\.\d{2})?)?)?$
              unitWeight:
                description: |-
                  The unit weight of the item in kg.

                  ---

                  Poids unitaire de l'article en kilogrammes.
                type: number
                exclusiveMinimum: true
                minimum: 0
                maximum: 99.999
                multipleOf: 0.001
              customsValuePerUnit:
                description: |
                  The value per unit in Canadian currency of the item.

                  ---

                  Valeur unitaire de l'article en devise canadienne.
                type: number
                exclusiveMinimum: true
                minimum: 0
                maximum: 99999.99
                multipleOf: 0.01
              customsUnitOfMeasure:
                description: |-
                  (Three-character ISO code)

                  Identifies the unit of measure for the customsNumberOfUnits.

                  - PCE – Piece
                  - NMB – Number
                  - PAR – Pair
                  - PKG – Package
                  - ENV – Envelope
                  - LTR – Litre
                  - MLT – Millilitre
                  - BOX – Box
                  - BAG – Bag
                  - MTR – Metre
                  - MMT – Millimetre
                  - DZN – Dozen
                  - GRM – Gram
                  - KGM – Kilogram
                  - CTN – Carton
                  - BIN – Bin
                  - SET – Number of sets
                  - BOT – Bottle
                  - TBE – Tube
                  - KIT – Kit        

                  ---

                  (Code de pays ISO à trois caractères)

                  Indique l'unité de mesure pour le champ customsNumberOfUnits.

                  - PCE – Article
                  - NMB – Numéro
                  - PAR – Paire
                  - PKG – Paquet
                  - ENV – Enveloppe
                  - LTR – Litre
                  - MLT – Millilitre
                  - BOX – Boîte
                  - BAG – Sac
                  - MTR – Mètre
                  - MMT – Millimètre
                  - DZN – Douzaine
                  - GRM – Gramme
                  - KGM – Kilogramme
                  - CTN – Carton
                  - BIN – Bac
                  - SET – Nombre de séries
                  - BOT – Bouteille
                  - TBE – Tube
                  - KIT – Trousse
                type: string
                maxLength: 3
              countryOfOrigin:
                description: |-
                  (2-character valid country code)

                  The country of origin of the corresponding item.

                  If the country of origin is not known, the field can be omitted.

                  ---

                  (Code de pays valide à deux caractères)

                  Pays d'origine de l'article correspondant.

                  Si le pays d'origine n'est pas connu, le champ peut être omis.
                type: string
                minLength: 2
                maxLength: 2
                pattern: ^[a-zA-Z][a-zA-Z]$
              provinceOfOrigin:
                description: |-
                  (2-character valid province code)

                  Required if country of origin is Canada.

                  The province of origin of the goods.

                  ---

                  (Code de province valide à deux caractères)

                  Requis si le pays d'origine est le Canada.

                  Province d'origine des biens.
                type: string
                minLength: 2
                maxLength: 2
            required:
              - customsNumberOfUnits
              - customsDescription
              - unitWeight
              - customsValuePerUnit
          minItems: 1
          maxItems: 500
        dutiesAndTaxesPrepaid:
          description: |-
            Reserved for future use.

            ---

            Réservé aux fins d'utilisation ultérieure.
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
        certificateNumber:
          description: |-
            If required by customs at the destination, the number of the government/agency certificate or permit.

            ---

            Si requis par les douanes du pays de destination, le numéro du certificat ou du permis du gouvernement ou de l'organisme.
          type: string
          maxLength: 10
        licenseNumber:
          description: |-
            If required by customs at the destination, the number of the government/agency import or export licence.

            ---

            Si requis par les douanes du pays de destination, le numéro de la licence d'importation ou d'exportation du gouvernement ou de l'organisme.
          type: string
          maxLength: 10
        invoiceNumber:
          description: |-
            If required by customs at the destination, the commercial invoice number.

            ---

            Si requis par les douanes du pays de destination, le numéro de la facture commerciale.
          type: string
          maxLength: 10
        usDeclarationId:
          description: |-
            Optional field to enter a US customs reference number.  This number is returned if you directly submit customs data to Zonos, instead of allowing the create-shipment API to send customs data to Zonos.  This field is not used unless the destination country is US.
            ---
            Champ facultatif pour saisir un numéro de référence douanier américain. Ce numéro est retourné si vous soumettez directement les données douanières à Zonos, au lieu d'utiliser l'API de création d'expédition. Ce champ n'est utilisé que si le pays de destination est les États-Unis.
          type: string
          maxLength: 30
        iossId:
          description: |-
            Optional field to enter Tax Registration Numbers or IDs (e.g. Tax ID, IRS No., VAT, IOSS number)  for electronic transmission to the receiving post. Note: IOSS should be entered as IMxxxxxxxxxx.

            ---

            Champ facultatif pour la saisie des numéros ou ID d'inscription à l'impôt (p. ex., ID d'inscription à l'impôt, numéro IRS, TVA, numéro IOSS) aux fins de transmission électronique au poste de réception. Remarque : Le numéro IOSS doit être saisi selon le format « IMxxxxxxxxxx ».
          type: string
          maxLength: 13
      required:
        - currency
        - reasonForExport
        - skuList
    settlementInfo:
      description: |-
        This structure contains the customer details for settlement of payment, including payment method, customer, mailed-on-behalf-of-customer.

        ---

        Cette structure comprend les détails sur le client pour le règlement des paiements, y compris le mode de paiement, le client et le client « Expédié au nom de ».
      type: object
      properties:
        paidByCustomer:
          $ref: '#/components/schemas/paidByCustomer'
        contractId:
          $ref: '#/components/schemas/contractId'
        cifShipment:
          description: |-
            If you have shipments that originate outside of Canada, but are being delivered directly to a Canada Post plant, use this field to identify these shipments as continuous inbound freight (CIF). This option allows you to be eligible for Canadian sales tax exemptions. You will need to provide Canada Post with documentation that shows proof of origin, such as a Canadian customs document or bill of lading.

            Only provide this parameter when the shipment is CIF (i.e. do not provide when false).

            ---

            Si vous avez des envois qui proviennent de l'extérieur du Canada, mais qui sont livrés directement à un établissement de Postes Canada, servez-vous de ce champ pour indiquer que ces envois sont un acheminement continu de marchandises d'arrivée (ACMA). Cette option vous permet d'être admissible à une exemption de la taxe de vente du Canada. Vous devrez fournir à Postes Canada des documents comprenant une preuve d'origine, tels qu'un document émis par les douanes canadiennes ou un connaissement.

            Fournissez uniquement ce paramètre lorsque l'envoi est un ACMA (ne fournissez pas ce paramètre lorsque le champ est réglé à « false »).
          type: boolean
          enum:
            - true
        intendedMethodOfPayment:
          description: |-
            This field indicates the customer's method of payment for a shipment where no manifest is required (transmitShipments=true), or the intended method of payment otherwise (the actual method of payment being in the subsequent Transmit Shipments).
            Valid values for intendedMethodOfPayment are:
            - CreditCard = the payment will be by credit card. This must be saved and defaulted on your Canada Post profile.
            - Account = the payment will be by an existing contract with the paid-by-customer.
            - SupplierAccount = the payment will be through the Supplier Account specified in preAuthorizedPayment or identified as default in the customer profile (only available to Supplier Account providers).
            ---
            Cet élément indique le mode de paiement du client pour un article n'exigeant pas de manifeste (« transmitShipments=true »), ou lorsque la méthode de paiement voulue est différente (le mode de paiement est indiqué dans la demande de service « Transmettre les envois » subséquente).
            Les valeurs valides pour le mode de paiement voulu sont les suivantes :
            - CreditCard = Le paiement sera effectué carte de crédit cela doit être enregistré et faites-en ma carte de crédit par défaut.
            - Account = Le paiement se fera par l'entremise d'une convention en vigueur qui aura été conclue avec le payeur.
            - SupplierAccount = le paiement se fera par l'intermédiaire du compte de fournisseur précisé dans l'élément « preAuthorizedPayment » ou sera désigné comme valeur par défaut dans le profil du client (offert uniquement aux fournisseurs de comptes de fournisseur).
          type: string
          maxLength: 15
        promoCode:
          description: |-
            Promotional discount code. Note that a promotion code is only valid for a certain period and product.

            Your entry will be converted to uppercase (i.e, you can use lowercase or a mix of lower or upper case and will get the same result).

            **Note:** Promotion Code DEVPROTEST can be used to test this functionality in the sandbox environment. This promo code is only valid in the sandbox environment and for the following products:

            - Xpresspost (DOM.XP)
            - Xpresspost International (INT.XP)

            ---

            Chaîne de caractères – Jusqu'à 10 caractères.

            Code de réduction promotionnelle. Veuillez noter que les codes promotionnels sont uniquement valides pour une certaine période et pour certains produits.

            Votre bulletin de participation sera converti en majuscules (p. ex., vous pouvez utiliser des lettres minuscules ou un mélange de minuscules et de majuscules et obtenir le même résultat).

            **Remarque :** Le code promotionnel DEVPROTEST peut être utilisé pour la mise à l'essai des fonctions dans l'environnement « bac à sable ». Ce code promotionnel est uniquement valide dans l'environnement « bac à sable » et pour les produits suivants :

            - Xpresspost (DOM.XP)
            - Xpresspost International (INT.XP)
          type: string
          maxLength: 10
      required:
        - intendedMethodOfPayment
    ccReceiptDetails:
      description: |-
        This structure will be provided if the manifest was paid for by credit card through the Transmit Shipments request.

        This structure contains the fields required for a hardcopy credit card receipt.

        ---

        Cette structure sera fournie si le manifeste a été payé par carte de crédit dans le cadre d'une demande de service « Transmettre les envois ».

        Cette structure contient les champs requis pour une copie papier du reçu de carte de crédit.
      type: object
