                    <td>
                      <p>customsValuePerUnit</p>
                    </td>
                    <td>
                      <p>Nombre</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Champ num&eacute;rique de cinq chiffres, suivis de deux d&eacute;cimales [p. ex. format 99999.99])</p>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; item &raquo; existe.</p>
                      <p>Valeur unitaire de l'article en devise canadienne.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>countryOfOrigin</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Code de pays valide &agrave; deux caract&egrave;res)</p>
                      <p>Pays d'origine de l'article correspondant. Il faut indiquer ce code si le champ&nbsp;parent correspondant &laquo; item &raquo; existe (et si le pays d'origine est connu).</p>
                      <p>Si le pays d'origine n'est pas connu, le champ peut &ecirc;tre omis.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>provinceOfOrigin</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(Code de province valide &agrave; deux caract&egrave;res)</p>
                      <p>Requis si le pays d'origine est le Canada.</p>
                      <p>Province d'origine des biens.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>settlementInfo</p>
                    </td>
                    <td>Objet</td>
                    <td>Requis</td>
                    <td>
                      <p>Cette structure comprend les d&eacute;tails sur le client pour le r&egrave;glement des paiements, y compris le mode de paiement, le client et le client &laquo; Exp&eacute;di&eacute; au nom de &raquo;.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>paidByCustomer</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(10 caract&egrave;res num&eacute;riques)</p>
                      <p>Les num&eacute;ros de client &laquo; Exp&eacute;di&eacute; par &raquo; comptent 10 chiffres. Si le num&eacute;ro fourni est inf&eacute;rieur &agrave; 10 chiffres, le syst&egrave;me ajoutera des z&eacute;ros au d&eacute;but jusqu'&agrave; ce qu'il y ait 10 chiffres.</p>
                      <p>Il s'agit du num&eacute;ro du client qui recevra la facture pour l'envoi. Il correspond habituellement au m&ecirc;me num&eacute;ro de client &laquo; Exp&eacute;di&eacute; au nom de &raquo;, &agrave; moins qu'une relation de payer central n'ait &eacute;t&eacute; signal&eacute;e &agrave; Postes Canada. S'il n'est pas fourni, le num&eacute;ro de client &laquo; Exp&eacute;di&eacute; au nom de &raquo; s'affiche par d&eacute;faut.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>contractId</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>(10 caract&egrave;res num&eacute;riques)</p>
                      <p>Les num&eacute;ros d'identification de convention comptent 10 chiffres. Si le num&eacute;ro fourni est inf&eacute;rieur &agrave; 10 chiffres, le syst&egrave;me ajoutera des z&eacute;ros au d&eacute;but jusqu'&agrave; ce qu'il y ait 10 chiffres.</p>
                      <p>Requis pour d&eacute;terminer les rabais consentis par convention si le mode de paiement voulu est &laquo; Compte &raquo;.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>cifShipment</td>
                    <td>
                      <p>Bool&eacute;en</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>{true}</p>
                      <p>Si vous avez des envois qui proviennent de l'ext&eacute;rieur du Canada, mais qui sont livr&eacute;s directement &agrave; un &eacute;tablissement de Postes Canada, servez-vous de ce champ pour indiquer que ces envois sont un acheminement continu de marchandises d'arriv&eacute;e (ACMA). Cette option vous permet d'&ecirc;tre admissible &agrave; une exemption de la taxe de vente du Canada. Vous devrez fournir &agrave; Postes Canada des documents comprenant une preuve d'origine, tels qu'un document &eacute;mis par les douanes canadiennes ou un connaissement.</p>
                      <p>Fournissez uniquement ce param&egrave;tre lorsque l'envoi est un ACMA (ne fournissez pas ce param&egrave;tre lorsque le champ est r&eacute;gl&eacute; &agrave; &laquo; false &raquo;).</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>intendedMethodOfPayment</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis</td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 15 caract&egrave;res</p>
                      <p>Ce champ indique le mode de paiement du client pour un article n&rsquo;exigeant pas de manifeste (&laquo; transmitShipments=true &raquo;), ou lorsque la m&eacute;thode de paiement voulue est diff&eacute;rente (le mode de paiement est indiqu&eacute; dans la demande de service &laquo; Transmettre les envois &raquo; subs&eacute;quente).</p>
                      <p>Les valeurs valides pour le mode de paiement voulu sont les suivantes :</p>
                      <ul>
                        <li>CreditCard = Le paiement sera effectu&eacute; carte de cr&eacute;dit cela doit &ecirc;tre enregistr&eacute; et faites-en ma carte de cr&eacute;dit par d&eacute;faut.</li>
                        <li>Account = Le paiement se fera par l'entremise d'une convention en vigueur qui aura &eacute;t&eacute; conclue avec le payeur.</li>
                        <li>SupplierAccount = le paiement se fera par l&rsquo;interm&eacute;diaire du compte de fournisseur pr&eacute;cis&eacute; dans le champ &laquo; preAuthorizedPayment &raquo; ou sera d&eacute;sign&eacute; comme valeur par d&eacute;faut dans le profil du client (offert uniquement aux fournisseurs de comptes de fournisseur).</li>
                      </ul>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>promoCode</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res &ndash; Jusqu&rsquo;&agrave; 10 caract&egrave;res.</p>
                      <p>Code de r&eacute;duction promotionnelle. Veuillez noter que les codes promotionnels sont uniquement valides pour une certaine p&eacute;riode et pour certains produits.</p>
                      <p>Votre bulletin de participation sera converti en majuscules (p. ex., vous pouvez utiliser des lettres minuscules ou un m&eacute;lange de minuscules et de majuscules et obtenir le m&ecirc;me r&eacute;sultat).</p>
                      <p><strong>Remarque :</strong> Le code promotionnel DEVPROTEST peut &ecirc;tre utilis&eacute; pour la mise &agrave; l&rsquo;essai des fonctions dans l&rsquo;environnement &laquo; bac &agrave; sable &raquo;. Ce code promotionnel est uniquement valide dans l&rsquo;environnement &laquo; bac &agrave; sable &raquo; et pour les produits suivants :</p>
                      <ul>
                        <li>Xpresspost (DOM.XP)</li>
                        <li>Xpresspost International (INT.XP)</li>
                      </ul>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>returnSpec</p>
                    </td>
                    <td>Objet</td>
                    <td>Facultatif</td>
                    <td>
                      <p>Contient les d&eacute;tails li&eacute;s &agrave; la demande de livraison d'un envoi retourn&eacute;, y compris le destinataire de l'envoi retourn&eacute;, le nombre d'&eacute;tiquettes, le code du service et les num&eacute;ros d'identification de r&eacute;f&eacute;rence. Si ce champ est absent, aucune &eacute;tiquette d'exp&eacute;dition du Service de retour n'est requise.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>serviceCode</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Requis</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 32 caract&egrave;res)</p>
                      <p>Doit &ecirc;tre un code valide correspondant au service de livraison de Postes Canada utilis&eacute; pour exp&eacute;dier l'article. Les codes les plus fr&eacute;quemment utilis&eacute;s sont &eacute;num&eacute;r&eacute;s ci-dessous.</p>
                      <table summary="Code de service" cellspacing="0">
                        <thead>
                          <tr>
                            <th>Code de service</th>
                            <th>Description</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td>DOM.RP</td>
                            <td>Colis standard</td>
                          </tr>
                          <tr>
                            <td>DOM.EP</td>
                            <td>Colis acc&eacute;l&eacute;r&eacute;s</td>
                          </tr>
                          <tr>
                            <td>DOM.XP</td>
                            <td>Xpresspost</td>
                          </tr>
                          <tr>
                            <td>DOM.PC</td>
                            <td>Priorit&eacute;</td>
                          </tr>
                          <tr>
                            <td>DOM.LIB</td>
                            <td>Livres de biblioth&egrave;que</td>
                          </tr>
                        </tbody>
                      </table>
                      <p>(Nota : Les services de livraison et leurs codes peuvent &ecirc;tre obtenus en faisant appel aux services &laquo; Obtenir les tarifs &raquo; et &laquo; D&eacute;couvrir les services &raquo; d&eacute;crits dans la section <a href="../../../api/overview/rating">Tarification</a>.)</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>returnRecipient</p>
                    </td>
                    <td>Objet</td>
                    <td>Requis sous condition</td>
                    <td>
                      <p>Requis si le champ&nbsp;parent correspondant &laquo; returnSpec &raquo; existe.</p>
                      <p>La structure du champ &laquo; returnRecipient &raquo; fournit les d&eacute;tails d'exp&eacute;dition (p. ex. adresse) pour la livraison d'un envoi retourn&eacute;, tels qu'ils figurent sur l'&eacute;tiquette du Service de retour.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>name</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 44 caract&egrave;res)</p>
                      <p>Nom du destinataire de l'envoi retourn&eacute; avec qui il faut communiquer.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>company</p>
                    </td>
                    <td>
                      <p>Cha&icirc;ne de caract&egrave;res</p>
                    </td>
                    <td>Facultatif</td>
                    <td>
                      <p>(Cha&icirc;ne de caract&egrave;res &ndash; Jusqu'&agrave; 44 caract&egrave;res)</p>
                      <p>Nom de l'entreprise du destinataire de l'envoi retourn&eacute;.</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p>addressDetails</p>
                    </td>
                    <td>Objet</td>
                    <td>Requis sous condition</td>
