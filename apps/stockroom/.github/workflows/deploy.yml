# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize Pages deployments. Two merges close together (e.g. #195 then #196)
# would otherwise race: the second deploy 400s with "in progress deployment"
# because Pages allows only one at a time. Queue them instead of failing, and
# don't cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Kept in step with .nvmrc and package.json "engines" so a local build
          # and the deployed one run the same runtime. Node 20 went end-of-life
          # in April 2026, so this tracks the active LTS instead.
          node-version-file: .nvmrc
          cache: npm

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
