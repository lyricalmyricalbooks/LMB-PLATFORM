name: CI

# Runs the full test suite, a production bundle build and the type-check ratchet on
# every pull request and on main, so contract tests (Studio coverage, section parity,
# copy coverage…) actually guard changes before they ship. The two Studio browser checks
# (about 15 minutes each on one machine) run on pull requests only, split across several
# machines; a merge to main already passed them on its pull request.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request replaces the older run. Runs on main are per commit and never cancelled:
# several merges in a row used to cancel each other's checks and leave red "cancelled" marks on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same exact version as deploy-firebase.yml and deploy-pages.yml (scripts/hostingConfig.test.ts).
env:
  FIREBASE_TOOLS_VERSION: 15.32.1

jobs:
  # Pull requests that change only the Cloud Functions, rules or docs can't change what Studio draws, so the
  # Studio browser checks pass at once for them (their tests still run in the test job).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      studio: ${{ steps.files.outputs.studio }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$changed"
          # Anything outside this list (or a diff git can't produce) runs the Studio checks.
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(functions/|docs/|src/app/admin/updates/|firestore\.rules$|firestore\.indexes\.json$|storage\.rules$|[^/]+\.md$)'; then
            echo "studio=false" >> "$GITHUB_OUTPUT"
          else
            echo "studio=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vitest also runs the Cloud Functions tests, which load the functions' own packages.
      - run: npm ci
        working-directory: functions

      # The Firebase deploy loads functions/index.js before it uploads anything; tests mock firebase-admin, so a
      # package update that breaks that load (firebase-admin 14 removed admin.firestore()) only failed after merge.
      - name: Cloud Functions load like the deploy
        working-directory: functions
        run: node -e "const n = Object.keys(require('./index.js')).length; if (!n) throw new Error('functions/index.js exports no functions'); console.log(n + ' functions load')"

      - name: Tests
        run: pnpm test

      - name: Type-check (no new errors)
        run: pnpm run typecheck

      - name: Lint (no new problems)
        run: pnpm run lint

      # Bundle only: the full `build` also prerenders live Firestore data, which the storefront workflow does.
      - name: Build
        run: pnpm exec vite build

      # That build served by the real Firebase Hosting emulator: firebase.json routing and headers are checked before
      # they can reach the live shop. No prerender here, so prerendered-page checks are skipped; the deploy workflow
      # runs them on the full build.
      - name: Firebase Hosting routing check
        run: npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec --only hosting --project demo-lyricalmyrical "node scripts/hosting-smoke.mjs"

  firestore-rules:
    # Runs scripts/firestore-rules-emulator.mjs against the real rules engine (Firestore emulator), so a rules change
    # that refuses real shopper writes (it once refused every guest order by passing the 1,000-expression limit) fails
    # before merge. Its packages go in a throwaway folder: they never touch the shop's lockfile.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the rules test packages
        run: |
          mkdir -p "$RUNNER_TEMP/rules-test"
          cd "$RUNNER_TEMP/rules-test"
          echo '{"type":"module","private":true}' > package.json
          npm install --no-audit --no-fund @firebase/rules-unit-testing@6.0.0 firebase@13.1.0 "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          cp "$GITHUB_WORKSPACE/scripts/firestore-rules-emulator.mjs" .

      - name: Firestore rules behave as expected
        working-directory: ${{ runner.temp }}/rules-test
        env:
          RULES_FILE: ${{ github.workspace }}/firestore.rules
        run: npx firebase emulators:exec --only firestore --project demo-rules "node firestore-rules-emulator.mjs"

  dependency-audit:
    # Fails a pull request when an installed package has a known high or critical advisory (root: pnpm, Cloud Functions: npm).
    # Low and moderate advisories only print, so the unpatched Quill one (guarded by quillExport.guard.test.ts) doesn't block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Storefront and admin packages
        run: pnpm audit --audit-level=high

      - name: Cloud Functions packages
        working-directory: functions
        run: npm audit --audit-level=high

  storefront-smoke:
    # Serves the production build and walks a shopper's path in Chromium against the live published catalog (home,
    # book page, add to bag, checkout, collection, wishlist, tracking, account, admin sign-in, 404, search, phone).
    # Fails when a page throws, so a dependency update that crashes the shop is caught before merge. Writes nothing:
    # cookies are rejected, no email is typed and nothing is paid (scripts/storefront-smoke.mjs).
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/chromium

      - run: pnpm exec vite build

      - name: Shopper click-through
        run: pnpm run test:storefront

  studio-browser-shard:
    # Drives the real Design studio in Chromium against the local fixture (studio-fixture.html):
    # in-memory data, no sign-in, nothing written to Firestore. Each machine runs every third check.
    name: studio-browser ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/chromium

      - name: Studio browser checks
        run: pnpm run test:studio
        env:
          STUDIO_SHOTS: studio-shots
          STUDIO_SHARD: ${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots-${{ matrix.shard }}
          path: studio-shots
          if-no-files-found: ignore

  studio-controls-shard:
    # Changes every Studio control in the fixture's preview of the live design and fails when one that used to
    # change the page no longer does, or a new control has no entry in scripts/studio-control-baseline/ (one file per control)
    # (src/app/admin/studio/CLAUDE.md › Studio controls must reach the shop). Each machine checks every fourth control.
    name: studio-controls ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/chromium

      - name: Every Studio control still reaches the preview
        run: node scripts/studio-control-audit.mjs
        env:
          AUDIT_CHECK: "1"
          AUDIT_OUT: studio-control-audit-${{ matrix.shard }}.json
          AUDIT_SHARD: ${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-control-audit-${{ matrix.shard }}
          path: studio-control-audit-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # One check per suite under its old name ("studio-browser", "studio-controls"): green only when every shard passed,
  # or when the pull request changes nothing Studio draws.
  studio-browser:
    needs: [changes, studio-browser-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          STUDIO: ${{ needs.changes.outputs.studio }}
          RESULT: ${{ needs.studio-browser-shard.result }}
        run: |
          if [ "$STUDIO" = "false" ]; then echo "Only functions, rules or docs changed: nothing for Studio to check."; exit 0; fi
          echo "Studio browser shards: $RESULT"; [ "$RESULT" = "success" ]

  studio-controls:
    needs: [changes, studio-controls-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          STUDIO: ${{ needs.changes.outputs.studio }}
          RESULT: ${{ needs.studio-controls-shard.result }}
        run: |
          if [ "$STUDIO" = "false" ]; then echo "Only functions, rules or docs changed: nothing for Studio to check."; exit 0; fi
          echo "Studio control shards: $RESULT"; [ "$RESULT" = "success" ]
