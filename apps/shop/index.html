<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Your Press — Independent Publishing House</title>
    <meta name="description" content="Your Press is an independent publishing house based in Toronto, specializing in photography and art books, photobooks and artists' books. Shop our archive of rare editions and exclusive prints." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Your Press" />
    <!-- The route SEO hook sets canonical URLs after routing, including deep links. -->

    <!-- Built-in tab and home-screen icons (cut from the logo for small sizes: scripts/favicon/). A picture set in
         Studio › Theme settings › Logo & wordmark › Browser tab icon replaces the tab icons (favicon.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Social Sharing. No og:image here: useSEO sets it (and twitter:image) from
         Studio › Style › Logo & wordmark › Share image, and prerendered pages carry it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lmb-test-shop.web.app/" />
    <meta property="og:title" content="Your Press — Independent Publishing House" />
    <meta property="og:description" content="An independent publishing house specializing in contemporary photography and art books, photobooks and artists' books. Based in Toronto with roots in Italy." />
    <meta property="og:site_name" content="Your Press" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Your Press" />
    <meta name="twitter:description" content="Independent publishing house specializing in contemporary photography and art books, photobooks and artists' books." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json" id="seo-jsonld-static">
    {
      "@context": "https://schema.org",
      "@type": "BookStore",
      "name": "Your Press",
      "url": "https://lmb-test-shop.web.app/",
      "description": "Independent publishing house based in Toronto, specializing in contemporary photography and art books, photobooks and artists' books.",
      "knowsAbout": ["Art books", "Photography books", "Photobooks", "Artists' books", "Zines"],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "456 Montrose Avenue",
        "addressLocality": "Toronto",
        "addressRegion": "Ontario",
        "postalCode": "M6G 3H1",
        "addressCountry": "CA"
      },
      "email": "owner@example.com",
      "sameAs": [
        "https://www.instagram.com/yourpress"
      ]
    }
    </script>

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Catalog data and book photos: open these connections while the app script downloads. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Fonts load without blocking first paint (display=swap shows text immediately). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" /></noscript>

    <!--
      Stale-page recovery. A page cached from an earlier deploy can point at CSS/JS files that the
      newer deploy replaced, leaving an unstyled page. If the site's own stylesheet or script fails
      to load (or a lazy page chunk does), reload once to fetch the current page. At most once a minute.
    -->
    <script>
      (function () {
        var KEY = 'lm:stale-asset-reload';
        function ownAsset(url) { return typeof url === 'string' && url.indexOf('/assets/') !== -1 && url.indexOf(location.origin) === 0; }
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 60000) return false;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) { return false; }
          location.reload();
          return true;
        }
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || el === window) return;
          if ((el.tagName === 'LINK' && ownAsset(el.href)) || (el.tagName === 'SCRIPT' && ownAsset(el.src))) reloadOnce();
        }, true);
        window.addEventListener('vite:preloadError', function (event) { if (reloadOnce()) event.preventDefault(); });
        window.addEventListener('load', function () {
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          for (var i = 0; i < links.length; i++) if (ownAsset(links[i].href) && !links[i].sheet) { reloadOnce(); return; }
        });
      })();
    </script>

    <!--
      Start the shop catalog download now, beside the app script, instead of after it has run: useSiteData
      reads this same file (features/site/storefrontDataFile.ts: same URL, CORS-anonymous, default cache mode,
      which Hosting revalidates). Not on the admin, and not in a Studio preview (that gets its data by message).
    -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          if (/\/admin(\/|$)/.test(p) || /[?&]preview=/.test(location.search)) return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = '%BASE_URL%storefront-data.json';
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>

    <!--
      The shop profile (src/lib/shopProfile.ts): this shop's Firebase settings, address and bot-check key. `defer` runs it
      after parsing and before the app script below, in page order, without holding up the page. The platform writes a
      different file per shop, so one build serves every shop; without it the app uses its built-in settings.
    -->
    <script defer src="%BASE_URL%shop-profile.js"></script>

    <style>
      html, body { height: 100%; margin: 0; background: #030213; }
      #root { height: 100%; }
    </style>
  </head>

  <body>
    <!--
      GitHub Pages SPA redirect decoder.

      Pairs with public/404.html — if a deep URL was rewritten to
      /?/some/path, restore it before React Router boots.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search.length > 1 && l.search.charAt(1) === '/') {
          // l.search looks like "?/books/test&preview=true". Drop the leading
          // "?", keep the leading "/" so the path stays absolute, then split
          // the original "&"-joined query back off the end.
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.replace(/\/$/, '') + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
