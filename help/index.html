<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colophon help</title>
<meta name="description" content="Plain answers to the questions presses ask most in their first weeks on Colophon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&family=DM+Mono&display=swap">
<style>
  :root { --paper: #f4efe6; --ink: #1d1a17; --pink: #ff48b0; --blue: #0078bf; --yellow: #ffe800; --muted: #5a534c; }
  @media (prefers-color-scheme: dark) { :root { --paper: #23201d; --ink: #f1ebe1; --muted: #b9b0a5; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.55 Archivo, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  .mark { font: 14px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font: 400 clamp(40px, 8vw, 72px)/1.12 Anton, Impact, sans-serif; text-transform: uppercase; margin: 16px 0 24px; }
  h2 { font: 400 28px/1.2 Anton, Impact, sans-serif; text-transform: uppercase; margin: 36px 0 8px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=search] { width: 100%; font: inherit; color: var(--ink); background: transparent; border: 2px solid var(--ink); padding: 12px 14px; min-height: 48px; }
  input[type=search]:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .article { border-bottom: 2px solid var(--ink); }
  .topic .article:first-of-type { border-top: 2px solid var(--ink); }
  summary { cursor: pointer; padding: 14px 0; list-style: none; display: flex; gap: 12px; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; font: 600 20px "DM Mono", monospace; width: 16px; flex: none; }
  details[open] > summary::before { content: "−"; }
  summary h3 { font-size: 19px; font-weight: 600; margin: 0; }
  .article p { margin: 0 0 12px 28px; }
  .where { font: 14px "DM Mono", monospace; }
  .where span { color: var(--muted); }
  .link { font: 13px "DM Mono", monospace; }
  .support ul { margin: 0 0 12px; padding-left: 22px; }
  .empty { border: 2px solid var(--ink); background: var(--yellow); color: #1d1a17; padding: 14px 16px; box-shadow: 4px 4px 0 var(--ink); }
  footer { font: 13px "DM Mono", monospace; color: var(--muted); margin-top: 40px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="mark">Colophon · help</div>
  <h1>How do I…?</h1>
  <label for="search">Search the answers</label>
  <input type="search" id="search" placeholder="e.g. shipping, editions, old shop" autocomplete="off">
  <div id="answers" aria-live="polite"></div>
  <div id="support"></div>
  <footer>
    <p>Didn't find it? Use <b>Get help from Colophon</b> on your account page and a person will answer.</p>
  </footer>
</main>
<script type="module">
  import { renderHelp } from "./page.js";
  import { renderSupport } from "./support.js";
  document.getElementById("support").innerHTML = renderSupport();
  const box = document.getElementById("answers");
  const search = document.getElementById("search");
  // ?plan=shop|stockroom|both shows only the answers for that plan (the account page can link with it).
  const plan = ["shop", "stockroom", "both"].includes(new URLSearchParams(location.search).get("plan")) ? new URLSearchParams(location.search).get("plan") : "both";
  const draw = () => {
    box.innerHTML = renderHelp({ search: search.value, plan, openId: decodeURIComponent(location.hash.slice(1)) });
    if (!search.value && location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  };
  search.addEventListener("input", draw);
  addEventListener("hashchange", draw);
  draw();
</script>
</body>
</html>
