name: CI
on:
  pull_request:
  push:
    branches: [main]

# Checks only. Nothing here deploys, and no job has keys for a live shop.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # The release check's browser driver against stand-in pages on the runner (release-check/local-proof.js): the
  # purchase, the stockroom opened as the test owner, the admin and the refund. Never reaches a real shop.
  release-check-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node release-check/local-proof.js

  # The platform's copy of the shop (apps/shop), with the same checks its original repo runs before merging.
  shop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: apps/shop/functions
      - name: Cloud Functions load like the deploy
        working-directory: apps/shop/functions
        run: node -e "const n = Object.keys(require('./index.js')).length; if (!n) throw new Error('functions/index.js exports no functions'); console.log(n + ' functions load')"
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: npx vite build

  # The platform's copy of the stockroom (apps/stockroom).
  stockroom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stockroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/stockroom/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Hosting settings (its own site inside each shop's project, plan 1.20) against what the build wrote.
      - run: npm run check:hosting

  # The shop copy's Firestore rules against the real rules engine (apps/shop/scripts/firestore-rules-emulator.mjs),
  # including who may open the admin (owner, staff) and manage the Team. Packages go in a throwaway folder.
  shop-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the rules test packages
        run: |
          mkdir -p "$RUNNER_TEMP/rules-test"
          cd "$RUNNER_TEMP/rules-test"
          echo '{"type":"module","private":true}' > package.json
          npm install --no-audit --no-fund @firebase/rules-unit-testing@6.0.0 firebase@13.1.0 firebase-tools@15.32.1
          cp "$GITHUB_WORKSPACE/apps/shop/scripts/firestore-rules-emulator.mjs" .
      - name: Firestore rules behave as expected
        working-directory: ${{ runner.temp }}/rules-test
        env:
          RULES_FILE: ${{ github.workspace }}/apps/shop/firestore.rules
        run: npx firebase emulators:exec --only firestore --project demo-rules "node firestore-rules-emulator.mjs"

  # The stockroom copy's three rule files against the real rules engines (apps/stockroom/scripts/rules-emulator.mjs):
  # who counts as the publisher (owner address or owner role, verified; not staff), and authors keep their own book.
  stockroom-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the rules test packages
        run: |
          mkdir -p "$RUNNER_TEMP/stockroom-rules"
          cd "$RUNNER_TEMP/stockroom-rules"
          echo '{"type":"module","private":true}' > package.json
          npm install --no-audit --no-fund @firebase/rules-unit-testing@6.0.0 firebase@13.1.0 firebase-tools@15.32.1
          cp "$GITHUB_WORKSPACE/apps/stockroom/scripts/rules-emulator.mjs" .
          R="$GITHUB_WORKSPACE/apps/stockroom"
          echo "{\"firestore\":{\"rules\":\"$R/firestore.rules\"},\"database\":{\"rules\":\"$R/database.rules.json\"},\"storage\":{\"rules\":\"$R/storage.rules\"}}" > firebase.json
      - name: Publisher, staff and author access behave as expected
        working-directory: ${{ runner.temp }}/stockroom-rules
        env:
          RULES_DIR: ${{ github.workspace }}/apps/stockroom
        run: npx firebase emulators:exec --only firestore,database,storage --project demo-stockroom "node rules-emulator.mjs"

  # The waitlist page's storage (waitlist/firestoreStore.js) against waitlist/firestore.rules in the Firestore emulator.
  waitlist-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: waitlist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: A sign-up lands, and nothing else gets through
        run: npx -y firebase-tools@15.32.1 emulators:exec --only firestore --project demo-waitlist "node firestore-emulator.mjs"
