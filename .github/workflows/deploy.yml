name: Deploy the platform

# Puts the platform live at https://lmb-platform-prod.web.app on every merge to main (and from the Actions tab, "Run
# workflow"): the front page, the front door, sign-up, account, help, terms, status, the control room and setup mode
# (site/build.js), the platform's database rules, and the platform's server once its keys are in Google's safe
# (server/README.md). Only the platform's own project, lmb-platform-prod: never a press's shop or any other project.
#
# Signs in to Google with GitHub's own short-lived identity (Workload Identity Federation): there is no key or password
# in this repository or its settings. Only this repository's main branch may use the github-deploy account
# (site/README.md, "Let GitHub deploy", made once by site/github-access.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-platform
  cancel-in-progress: false

env:
  PROJECT: lmb-platform-prod
  REGION: northamerica-northeast1
  WIF_PROVIDER: projects/1038369055304/locations/global/workloadIdentityPools/github/providers/lmb-platform
  DEPLOY_ACCOUNT: github-deploy@lmb-platform-prod.iam.gserviceaccount.com
  FIREBASE_TOOLS: firebase-tools@15.32.1

jobs:
  deploy:
    if: github.repository == 'lyricalmyricalbooks/LMB-PLATFORM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://lmb-platform-prod.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Every platform test passes first
        run: npm test
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - name: Build setup mode (the shop admin before a shop exists)
        run: pnpm install --frozen-lockfile && pnpm run build:setup
        working-directory: apps/shop
      - name: Sign in to Google as the deploy account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The server goes live only when all six of its keys are in Secret Manager and its settings are saved in the
      # repository variable SERVER_SETTINGS (server/env.example.yaml's lines). Until then this says what is missing and
      # the pages go live without it.
      - name: Is the server ready?
        id: server
        env:
          SERVER_SETTINGS: ${{ vars.SERVER_SETTINGS }}
        run: |
          missing=""
          for secret in resend-api-key stripe-platform-test-key stripe-billing-webhook-secret stripe-connect-webhook-secret-test trial-tips-secret checkup-secret; do
            gcloud secrets describe "$secret" --project="$PROJECT" > /dev/null 2>&1 || missing="$missing $secret"
          done
          [ -n "$SERVER_SETTINGS" ] || missing="$missing (repository variable SERVER_SETTINGS)"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### The server isn't put live yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Waiting on:$missing. The pages go live without it (server/README.md, Your steps)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Put the server live
        if: steps.server.outputs.ready == 'true'
        env:
          SERVER_SETTINGS: ${{ vars.SERVER_SETTINGS }}
        run: |
          printf '%s\n' "$SERVER_SETTINGS" > server/env.yaml
          node server/deploy.js --apply
          node server/setup-schedules.js --apply

      - name: Build the pages
        run: |
          if gcloud run services describe platform-api --project="$PROJECT" --region="$REGION" > /dev/null 2>&1; then
            node site/build.js --require-app --api
          else
            node site/build.js --require-app
          fi
      - name: Put the pages and the database rules live
        working-directory: site/out
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive --message "$GITHUB_SHA"
      - name: Check the live site
        run: node site/check-live.js https://lmb-platform-prod.web.app
