name: Deploy the platform

# Puts the platform live at https://lmb-platform-prod.web.app on every merge to main (and from the Actions tab, "Run
# workflow"): the front page, the front door, sign-up, account, help, terms, status, the control room and setup mode
# (site/build.js), the platform's database rules, and the platform's server once its settings are saved
# (server/README.md). Only the platform's own project, lmb-platform-prod: never a press's shop or any other project.
#
# Signs in to Google with GitHub's own short-lived identity (Workload Identity Federation): there is no key or password
# in this repository or its settings. Only this repository's main branch may use the github-deploy account
# (site/README.md, "Let GitHub deploy", made once by site/github-access.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-platform
  cancel-in-progress: false

env:
  PROJECT: lmb-platform-prod
  REGION: northamerica-northeast1
  WIF_PROVIDER: projects/1038369055304/locations/global/workloadIdentityPools/github/providers/lmb-platform
  DEPLOY_ACCOUNT: github-deploy@lmb-platform-prod.iam.gserviceaccount.com
  FIREBASE_TOOLS: firebase-tools@15.32.1

jobs:
  deploy:
    if: github.repository == 'lyricalmyricalbooks/LMB-PLATFORM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://lmb-platform-prod.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shop/pnpm-lock.yaml
      - name: Every platform test passes first
        run: npm test
      - name: Build setup mode (the shop admin before a shop exists)
        run: pnpm install --frozen-lockfile && pnpm run build:setup
        working-directory: apps/shop
      - name: Sign in to Google as the deploy account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The server goes live once its two link phrases are in Secret Manager (site/github-access.sh makes them) and its
      # settings are saved in the repository variable SERVER_SETTINGS (server/env.example.yaml's lines). The Stripe keys
      # are optional: until they are added, those parts say "not connected" and everything else works. Email has no key:
      # GMAIL_SENDING: "on" in SERVER_SETTINGS sends it through Google (server/README.md, "Email through Google").
      - name: Is the server ready?
        id: server
        env:
          SERVER_SETTINGS: ${{ vars.SERVER_SETTINGS }}
        run: |
          missing=""
          for secret in trial-tips-secret checkup-secret; do
            gcloud secrets describe "$secret" --project="$PROJECT" > /dev/null 2>&1 || missing="$missing $secret"
          done
          [ -n "$SERVER_SETTINGS" ] || missing="$missing (repository variable SERVER_SETTINGS)"
          later=""
          # Connect Google's three keys (google/config.js GOOGLE_SECRETS) are optional too: until they are there, every
          # shop's Google page says "coming soon". Adding them changes the server's fingerprint below, so it goes live again.
          for secret in stripe-platform-test-key stripe-billing-webhook-secret stripe-connect-webhook-secret-test google-client-id google-client-secret google-token-key; do
            gcloud secrets describe "$secret" --project="$PROJECT" > /dev/null 2>&1 || later="$later $secret"
          done
          echo "later=$later" >> "$GITHUB_OUTPUT"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            [ -z "$later" ] || echo "Server live without:$later (Stripe says \"not connected\" until added)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### The server isn't put live yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Waiting on:$missing. The pages go live without it (site/README.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The server is put live again only when something in it changed: the folders its image is built from (the list in
      # server/.gcloudignore; workflows.test.js keeps them in step), its settings or which keys are there. That saves about
      # two minutes on a merge that changes only the shop, the stockroom or the pages. "Run workflow" always puts it live.
      - name: Has the server changed?
        id: fingerprint
        if: steps.server.outputs.ready == 'true'
        env:
          SERVER_SETTINGS: ${{ vars.SERVER_SETTINGS }}
          LATER: ${{ steps.server.outputs.later }}
        run: |
          mkdir -p "$RUNNER_TEMP/server-mark"
          {
            for path in package.json accounts clients control-room google help profile release-check security server services setup shared signup status terms waitlist; do
              git rev-parse "HEAD:$path"
            done
            printf '%s\n' "$SERVER_SETTINGS" "$LATER"
          } | sha256sum | cut -c1-40 | tee "$RUNNER_TEMP/server-mark/fingerprint" | sed 's/^/key=platform-server-/' >> "$GITHUB_OUTPUT"
      - name: Was this server already put live?
        id: already
        if: steps.server.outputs.ready == 'true' && github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/server-mark
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true
      - name: Put the server live
        if: steps.server.outputs.ready == 'true' && steps.already.outputs.cache-hit != 'true'
        env:
          SERVER_SETTINGS: ${{ vars.SERVER_SETTINGS }}
        run: |
          printf '%s\n' "$SERVER_SETTINGS" > server/env.yaml
          node server/deploy.js --apply
          node server/setup-schedules.js --apply
      - name: Remember the server that is live
        if: steps.server.outputs.ready == 'true' && steps.already.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/server-mark
          key: ${{ steps.fingerprint.outputs.key }}
      - name: The server didn't change
        if: steps.already.outputs.cache-hit == 'true'
        run: echo "The server didn't change since it was last put live, so it stays as it is." >> "$GITHUB_STEP_SUMMARY"

      - name: Build the pages
        run: |
          if gcloud run services describe platform-api --project="$PROJECT" --region="$REGION" > /dev/null 2>&1; then
            node site/build.js --require-app --api
          else
            node site/build.js --require-app
          fi
      - name: Put the pages and the database rules live
        working-directory: site/out
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive --message "$GITHUB_SHA"
      - name: Check the live site
        run: node site/check-live.js https://lmb-platform-prod.web.app
