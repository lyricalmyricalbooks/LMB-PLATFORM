name: Walkthrough site

# The walkthrough as a web site anyone can open (walkthrough/site/build.js): runs the walkthrough and the demo shop on the
# runner, takes a picture of every stop and publishes them with what to try. Made-up data only: nothing here has keys for a
# live shop, and the pictures are all that leaves the runner. Pull requests build it (to prove it works); main publishes it.
on:
  pull_request:
    paths:
      - "walkthrough/**"
      - "demo/**"
      - "apps/**"
      - ".github/workflows/walkthrough-site.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walkthrough-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Start the demo shop and stockroom
        run: |
          nohup node demo/run.js --fresh > demo.log 2>&1 &
          for i in $(seq 1 300); do
            grep -q "The demo shop is running" demo.log && exit 0
            sleep 3
          done
          tail -50 demo.log
          exit 1
      - name: Take a picture of every stop
        run: node walkthrough/site/build.js site
      - name: Stop the demo
        if: always()
        run: pkill -INT -f demo/run.js || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
