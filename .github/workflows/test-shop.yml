name: Make the test shop

# Makes (or brings up to date) the platform's own test shop in the shared test project lmb-test-shop
# (setup/make-test-shop.js, docs/shared-system.md phase 8): the project readied for shops, its first release (rules,
# the shared server, the one site), then the test shop as a folder in it, with sample books and the owner as its owner.
# Safe to run again: it resumes where it stopped. Only lmb-test-shop, only from main, only by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: make-test-shop
  cancel-in-progress: false

env:
  TEST_SHOP: lmb-test-shop
  WIF_PROVIDER: projects/1038369055304/locations/global/workloadIdentityPools/github/providers/lmb-platform
  DEPLOY_ACCOUNT: github-deploy@lmb-platform-prod.iam.gserviceaccount.com
  FIREBASE_TOOLS: firebase-tools@15.32.1

jobs:
  make:
    if: github.repository == 'lyricalmyricalbooks/LMB-PLATFORM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment:
      name: test-shop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - name: Build the shop's pages and server code
        working-directory: apps/shop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
          (cd functions && npm ci)
          # The browser that draws the shop's pages ahead of time (scripts/prerender-storefront.mjs), the version the
          # shop copy pins. Without it the run still passes but leaves the pages for the next release to draw.
          pnpm exec playwright install chromium
          # System packages only when Chromium is missing a library: the runner image has them, and Ubuntu's
          # package servers are sometimes unreachable from GitHub (11 November 2026), which failed every browser job.
          if find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -exec ldd {} \; | grep -q "not found"; then
            timeout 600 pnpm exec playwright install-deps chromium
          fi
      - name: Build the stockroom's pages
        working-directory: apps/stockroom
        run: npm ci && npm run build
      - name: Sign in to Google as the deploy account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: The Firebase command line
        run: npm install --global "$FIREBASE_TOOLS"
      # Step 7 (test-mode payments) runs when the platform's Stripe test key is in Secret Manager; only the payment
      # service inside setup/make-test-shop.js reads it. A live key is refused there. Step 8 (the welcome email) waits
      # here: email goes through Google from the hosted server only.
      - name: The platform's test keys, when they are there
        run: |
          # When each version of the key was put there (no value is shown): a changed key explains a lost test account.
          gcloud secrets versions list stripe-platform-test-key --project=lmb-platform-prod --limit=3 --format="table(name,createTime,state)" || true
          for pair in STRIPE_PLATFORM_TEST_KEY:stripe-platform-test-key; do
            name="${pair%%:*}"
            secret="${pair#*:}"
            if value=$(gcloud secrets versions access latest --secret="$secret" --project=lmb-platform-prod 2>"$RUNNER_TEMP/secret-error"); then
              echo "::add-mask::$value"
              { echo "$name<<KEY_END"; echo "$value"; echo "KEY_END"; } >> "$GITHUB_ENV"
            elif grep -qiE "NOT_FOUND|not found" "$RUNNER_TEMP/secret-error"; then
              echo "$secret isn't in lmb-platform-prod's Secret Manager yet (or has no version), so its step waits." >> "$GITHUB_STEP_SUMMARY"
            elif grep -qiE "PERMISSION_DENIED|permission" "$RUNNER_TEMP/secret-error"; then
              echo "$secret is there, but $DEPLOY_ACCOUNT may not read it: give it Secret Manager Secret Accessor on that secret. Its step waits." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$secret can't be read yet, so its step waits." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Make the test shop
        env:
          SERVER_SETTINGS: ${{ vars.SERVER_SETTINGS }}
          # Stripe's test publishable key (public, pk_test_…): the test shop's checkout needs it to show the card form.
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ vars.STRIPE_TEST_PUBLISHABLE_KEY }}
          # Firebase takes sign-in passes only when signed by an account of the shop project itself (lmb-test-shop).
          PLATFORM_SERVICE_ACCOUNT: firebase-adminsdk-fbsvc@${{ env.TEST_SHOP }}.iam.gserviceaccount.com
        run: |
          # The owner is the platform's admin (PLATFORM_ADMIN_EMAIL in the server's settings), never written in code.
          TEST_SHOP_OWNER_EMAIL=$(printf '%s\n' "$SERVER_SETTINGS" | sed -n 's/^PLATFORM_ADMIN_EMAIL: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' | head -n 1)
          export TEST_SHOP_OWNER_EMAIL
          node setup/make-test-shop.js --apply
      # The checks run every five minutes and the backup every night; they are started now so the control room and the
      # status page show the result of this run at once. Never fails the run: the schedule runs them anyway.
      - name: Run the backup and the health checks now
        # Also after a stopped run: the checks and their report don't depend on the step that stopped it.
        if: always()
        run: |
          for job in platform-nightly-backups platform-health-checks; do
            gcloud scheduler jobs run "$job" --project=lmb-platform-prod --location=northamerica-northeast1 ||
              echo "$job couldn't be started now; it runs on its schedule." >> "$GITHUB_STEP_SUMMARY"
            sleep 60
          done
      # What the checks now say about each test shop, with the cause of any red line, for whoever reads this run.
      - name: What the health checks say
        if: always()
        run: node setup/test-shop-health.js || echo "The checks' results couldn't be read." >> "$GITHUB_STEP_SUMMARY"
