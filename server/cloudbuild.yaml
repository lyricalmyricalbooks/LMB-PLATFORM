# Builds the server's image from the repository's root and stores it in the platform's image store (Artifact
# Registry). server/deploy.js runs: gcloud builds submit --config=server/cloudbuild.yaml --substitutions=_IMAGE=<image>
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--file", "server/Dockerfile", "--tag", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
# The build's log goes to Cloud Logging only, not the default logs bucket: reading that bucket needs Viewer on the whole
# project, which the deploy account doesn't hold, and without it gcloud stops waiting and fails the deploy.
options:
  logging: CLOUD_LOGGING_ONLY
