# The hosted server's settings that aren't secret. Copy this file to server/env.yaml (never committed) and put the real
# values in; server/deploy.js gives them to both services. Keys never go here: they live in Secret Manager
# (server/README.md). The deploy itself sets PLATFORM_ROLE, PLATFORM_PROJECT and BILLING_MODE=test.

# Who may open the control room (comma-separated), and Julian's own address for the backup person's alerts.
PLATFORM_ADMIN_EMAILS: "admin@example.com"
PLATFORM_ADMIN_EMAIL: "admin@example.com"
# Where a late job or a failed health check is emailed.
HEALTH_ALERT_TO: "alerts@example.com"
# The platform's own pages and email addresses (services/settings.js has every one and its default).
PLATFORM_URL: "https://lmb-platform-prod.web.app"
PLATFORM_DOMAIN: "platform.example"
PLATFORM_SENDER_EMAIL: "notifications@platform.example"
PLATFORM_SUPPORT_EMAIL: "support@platform.example"
# "true" lets anyone sign up; anything else keeps sign-up to waitlist invites.
SIGNUP_OPEN: "false"
# How many of our own proxies add an address to x-forwarded-for before the server sees it. Check once after the
# first deploy (server/README.md) and set it to match.
LIMIT_PROXY_HOPS: "0"
